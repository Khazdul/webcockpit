<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebCockpit</title>
    <style>
      html, body { margin: 0; height: 100%; background: var(--term-bg, #000000); color: var(--term-fg, #c0c0c0); }
      #app { height: 100%; }
      /* First paint (ADR 0083, src/boot/first-paint.ts): the start page banner
       * and the loading bar, in the box the start page will fill (as
       * .wc-chrome in src/chrome/kit/kit.css and src/ui/ui.css), above it. */
      #wc-first {
        position: absolute; inset: 0; z-index: 1; overflow: hidden; pointer-events: none;
        white-space: pre; font-variant-ligatures: none; letter-spacing: 0; user-select: none;
      }
      html.wc-phone #wc-first {
        inset: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
          env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      }
      #wc-first.wcf-overlay { position: fixed; inset: 0; z-index: 2147483647; }
      .wcf-screen { position: absolute; overflow: hidden; }
      .wcf-banner { position: absolute; left: 0; right: 0; }
      .wcf-line { height: var(--wcf-h); white-space: pre; overflow: hidden; }
      @supports (overflow: clip) { .wcf-line { overflow-x: clip; overflow-y: visible; } }
      .wcf-word { color: var(--banner-word); }
      .wcf-word-dim { color: var(--banner-word-dim); }
      .wcf-s0 { color: var(--star-dim); }
      .wcf-s1 { color: var(--star-mid); }
      .wcf-s2 { color: var(--star-bright); }
      .wcf-loader { opacity: 0; }
      .wcf-loader.on { opacity: 1; }
      .wcf-loader .bar { position: absolute; display: flex; }
      .wcf-loader .f, .wcf-loader .t { display: inline-block; height: var(--wcf-h); overflow: hidden; }
      .wcf-loader .f { background: var(--wcf-fill, #ffaf00); }
      .wcf-loader .t { color: var(--wcf-track, #585858); }
      .wcf-loader .p, .wcf-loader .l { color: var(--wcf-text, #8a8a8a); }
      .wcf-loader .l { position: absolute; left: 0; right: 0; text-align: center; }
    </style>
    <!-- wc:first-paint: src/boot/first-paint.ts, inlined by vite.config.ts (ADR 0083) -->
  </head>
  <body>
    <div id="app"><div id="wc-start-host" class="wc-start-host" style="position: relative; height: 100%"><div id="wc-first"></div></div></div>
    <script>
      // Draws the banner and the bar into the box above (src/boot/first-paint.ts).
      try { window.__wcPaint && window.__wcPaint(); } catch (e) {}
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
