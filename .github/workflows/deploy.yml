# Cloudflare deployment (ADR 0144): the Worker `webcockpit` with the site
# as its static assets (wrangler.jsonc).
#   - a version tag (`git tag vX.Y.Z && git push origin vX.Y.Z`) deploys
#     production
#   - by hand (Actions → deploy → Run workflow): staging (the default,
#     `webcockpit-staging`) or production
# `npm run build:site` does the checks, the build, the smoke test and the
# carried assets; this workflow only runs `wrangler deploy` on the result.
# Until the switch of stage 58 both Workers answer on workers.dev only, and
# pages.yml still deploys the live site from the same tag.
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (the stage file).
name: deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: Which Worker to deploy
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'push' && 'production' || inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ github.event_name == 'push' && 'production' || inputs.environment }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # No GPU on the runner: Firefox's map worker gets no WebGL, so the
      # smoke test runs in Chromium here; Firefox is checked against the
      # deployed site afterwards (ADR 0028).
      - run: npm run build:site -- --target "$TARGET"
        env:
          WC_PROD_BROWSERS: chromium
      # The wrangler of package.json (already installed by `npm ci`), not
      # the action's default.
      - id: wrangler
        run: echo "version=$(node -p "require('./package.json').devDependencies.wrangler")" >> "$GITHUB_OUTPUT"
      - id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ steps.wrangler.outputs.version }}
          # Production is the top level of wrangler.jsonc: no `--env` (wrangler
          # then warns that environments exist; that is expected).
          command: ${{ env.TARGET == 'staging' && 'deploy --env staging' || 'deploy' }}
      - name: Summary
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          {
            echo "### Deployed: $TARGET"
            echo
            echo "- Release: \`$(node -p "const r = require('./dist-site/release.json'); r.version + ' ' + r.commit")\`"
            echo "- URL: ${DEPLOYMENT_URL:-(not reported by wrangler)}"
          } >> "$GITHUB_STEP_SUMMARY"
