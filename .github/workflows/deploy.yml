# Cloudflare deployment (ADR 0144): the Worker `webcockpit` with the site
# as its static assets (wrangler.jsonc).
#   - a version tag (`git tag vX.Y.Z && git push origin vX.Y.Z`) deploys
#     production
#   - by hand (Actions → deploy → Run workflow): staging (the default,
#     `webcockpit-staging`) or production
# `npm run build:site` does the checks, the build, the smoke test and the
# carried assets; this workflow only runs `wrangler deploy` on the result.
# By hand there is also `triggers`: no build and no upload, only the
# routes and domains of wrangler.jsonc applied to the Worker that is
# already deployed (`wrangler triggers deploy`). The switch of stage 58
# attaches mumecockpit.com that way, without waiting for a build.
# A deploy applies the target's D1 migrations first (stage 59). `triggers`
# also applies the cron triggers, and attaches staging.mumecockpit.com to
# the staging Worker.
# pages.yml still deploys the old Pages site from the same tag until it is
# retired.
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (the stage file).
name: deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: Which Worker to deploy
        type: choice
        options: [staging, production]
        default: staging
      action:
        description: deploy = build and upload; triggers = only apply routes and domains
        type: choice
        options: [deploy, triggers]
        default: deploy

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'push' && 'production' || inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ github.event_name == 'push' && 'production' || inputs.environment }}
      ACTION: ${{ github.event_name == 'push' && 'deploy' || inputs.action }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - if: env.ACTION == 'deploy'
        run: npx playwright install --with-deps chromium
      # No GPU on the runner: Firefox's map worker gets no WebGL, so the
      # smoke test runs in Chromium here; Firefox is checked against the
      # deployed site afterwards (ADR 0028).
      - if: env.ACTION == 'deploy'
        run: npm run build:site -- --target "$TARGET"
        env:
          WC_PROD_BROWSERS: chromium
      # wrangler wants the assets directory of its configuration to exist,
      # also when nothing is uploaded.
      - if: env.ACTION == 'triggers'
        run: mkdir -p dist-site
      # The wrangler of package.json (already installed by `npm ci`), not
      # the action's default.
      - id: wrangler
        run: echo "version=$(node -p "require('./package.json').devDependencies.wrangler")" >> "$GITHUB_OUTPUT"
      # D1 migrations (worker/migrations, ADR 0144) before the Worker that
      # needs them; a migration is always backward compatible with the
      # Worker still running (spec §7.11). Applied ones are skipped; in CI
      # wrangler does not ask for confirmation. `DB` is the binding of the
      # target's database in wrangler.jsonc.
      - if: env.ACTION == 'deploy'
        name: D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx wrangler d1 migrations apply DB --remote $([ "$TARGET" = staging ] && echo --env staging)
      - id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ steps.wrangler.outputs.version }}
          # Production is the top level of wrangler.jsonc: no `--env` (wrangler
          # then warns that environments exist; that is expected).
          command: ${{ env.ACTION == 'triggers' && 'triggers deploy' || 'deploy' }}${{ env.TARGET == 'staging' && ' --env staging' || '' }}
      - name: Summary
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          {
            echo "### $ACTION: $TARGET"
            echo
            if [ "$ACTION" = deploy ]; then
              echo "- Release: \`$(node -p "const r = require('./dist-site/release.json'); r.version + ' ' + r.commit")\`"
            fi
            echo "- URL: ${DEPLOYMENT_URL:-(not reported by wrangler)}"
          } >> "$GITHUB_STEP_SUMMARY"
