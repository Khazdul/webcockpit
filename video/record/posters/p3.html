<!doctype html>
<html><head><meta charset="utf-8"><title>The stones</title>
<link rel="stylesheet" href="poster.css">
<style>
  @font-face { font-family: 'Cormorant'; font-weight: 500; font-style: italic; src: url('../../../public/fonts/CormorantGaramond-MediumItalic-latin.woff2') format('woff2'); }
  .grp { position: absolute; width: 520px; }
  .grp h2 { margin: 0 0 18px; font-family: 'Cinzel', serif; font-weight: 700; font-size: 21px; letter-spacing: .3em; color: var(--c); opacity: .9;
    padding-bottom: 10px; border-bottom: 1px solid color-mix(in srgb, var(--c) 35%, transparent); }
  .row { display: flex; align-items: center; gap: 20px; height: 62px; margin-bottom: 12px; }
  .sti { flex: none; width: 52px; height: 52px; border-radius: 6px; display: grid; place-items: center; --c: var(--tone);
    background: color-mix(in srgb, var(--c) 22%, rgba(0,0,0,.5));
    box-shadow: inset 0 1.5px 0 color-mix(in srgb, var(--c) 60%, transparent), 0 0 0 1.5px rgba(255,255,255,.04); }
  .sti.untimed { box-shadow: none; outline: 1.5px dashed color-mix(in srgb, var(--c) 70%, transparent); outline-offset: -1.5px; }
  .sti svg { width: 38px; height: 38px; color: var(--c); fill: none; stroke: currentColor; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
  .tx b { display: block; font-family: 'Cinzel', serif; font-weight: 700; font-size: 21px; letter-spacing: .08em; color: #e6d8b6; }
  .tx span { display: block; font-family: 'Cormorant', serif; font-style: italic; font-weight: 500; font-size: 23px; color: rgba(214,202,176,.66); margin-top: 1px; white-space: nowrap; }
</style>
</head><body>
<div class="card" style="left:100px; top:178px; width:1280px; height:648px"><img src="shots/fight-status.png"></div>
<div class="title" style="left:110px; top:84px">The stones</div>
<div id="list"></div>
<script src="shots/stones-all.js"></script>
<script>
  // [stone name as dumped, shown name, the one line]
  const G = [
    ['Herblores', 'herb', 100, 940, [
      ['healing', 'Healing', 'two phases, an hour each'],
      ['travelling', 'Travelling', 'three phases, for the road'],
      ['clearthought', 'Clearthought', 'red in its closing debuff phase'],
      ['walking', 'Walking', 'three phases'],
      ['seeing', 'Seeing', 'three phases'],
      ['shadows', 'Shadows', 'a debuff phase before the buff'],
      ['strength', 'Strength', 'one phase of two hours'],
      ['orcbalm', 'Orc balm', 'three short phases'],
    ], 2],
    ['Buffs', 'buff', 1480, 178, [
      ['battle glory', 'Battle glory', 'a horn blown: the urge to battle'],
      ['second wind', 'Second wind', 'a surge of energy; winded follows'],
      ['haste (active)', 'Haste', 'the tea: muscles quiver and twitch'],
      ['miruvor', 'Miruvor', 'the cordial’s warmth in your limbs'],
      ['heightened senses', 'Heightened senses', 'a potion’s calm, sharp focus'],
      ['orkish draught', 'Orkish draught', 'a fiery draught in your limbs'],
      ['blood of sauron', 'Blood of Sauron', 'a surge of power'],
      ['dark aura', 'Dark aura', 'a murky aura around you'],
      ['shadow-veil', 'Shadow-veil', 'your Master’s strength with yours'],
      ['anger', 'Anger', 'filled with anger, half a minute'],
      ['comfortable', 'Comfortable', 'resting by a fire'],
      ['very comfortable', 'Very comfortable', 'rested longer by the fire'],
      ['some pipe-weed', 'Pipe-weed', 'from the affects list, no timer'],
      ['bloodlust', 'Bloodlust', 'from the affects list, no timer'],
      ['growth', 'Growth', 'from the affects list, no timer'],
    ], 1],
    ['Debuffs', 'debuff', 2040, 178, [
      ['chill touch', 'Chill touch', 'an icy gust: the spell’s chill'],
      ['lethargy', 'Lethargy', 'a sudden loss of energy'],
      ['tiredness', 'Tiredness', 'when lent strength subsides'],
      ['panic', 'Panic', 'after a flee, from the affects list'],
      ['unable to quit', 'Unable to quit', 'from the affects list'],
    ], 1],
    ['Sanctuary', 'sanct', 2040, 680, [
      ['sanctuary', 'Sanctuary', 'your own white aura, timed'],
    ], 1],
    ['GMCP flags', 'debuff', 2040, 900, [
      ['poison', 'Poisoned', 'MUME’s poison flag'],
      ['wound', 'Wounded', 'a bleeding wound; the list in its tip'],
      ['snared', 'Snared', 'MUME’s snared flag'],
      ['hungry', 'Hungry', 'MUME’s hungry flag'],
      ['thirsty', 'Thirsty', 'MUME’s thirsty flag'],
    ], 1],
  ];
  const tones = {};
  for (const s of Object.values(STONES)) tones[s.tone] ??= s.color;
  const list = document.getElementById('list');
  const missing = [];
  for (const [head, tone, x, y, rows, cols] of G) {
    const g = document.createElement('div');
    g.className = 'grp';
    g.style.cssText = `left:${x}px; top:${y}px; width:${cols === 2 ? 1280 : 500}px; --c:${tones[tone]}`;
    let html = `<h2>${head}</h2><div style="display:grid; grid-template-columns:repeat(${cols}, 1fr); column-gap:40px">`;
    for (const [key, name, line] of rows) {
      const s = STONES[key];
      if (!s) { missing.push(key); continue; }
      html += `<div class="row"><div class="sti ${s.state === 'untimed' ? 'untimed' : ''}" style="--tone:${tones[s.tone]}">${s.svg}</div><div class="tx"><b>${name}</b><span>${line}</span></div></div>`;
    }
    g.innerHTML = html + '</div>';
    list.append(g);
  }
  if (missing.length) console.error('missing stones: ' + missing.join(', '));
  Promise.all([...document.images].map((i) => i.decode())).then(() => (window.ready = true));
</script>
</body></html>
