<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A3 Drawer: replying</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
/* ---- shared kit (same block in every artboard) ---- */
.ph{width:390px;height:844px;overflow:hidden;position:relative;box-sizing:border-box;background:#000;color:#c6c6c6;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:15px;line-height:19px;display:flex;flex-direction:column}
.ph *{box-sizing:border-box}
:where(.ph) button{font:inherit;color:inherit;margin:0;padding:0;cursor:pointer}
.gt{margin:0;padding:8px 10px;white-space:pre;font:inherit;flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.gt pre{margin:0;font:inherit;white-space:pre}
.room{color:#5fd7d7;font-weight:700}.ex{color:#5f87d7}.cmd{color:#87afd7}.hit{color:#d75f5f}.tell{color:#5faf5f}.yell{color:#d7d75f}.dim{color:#8a8a8a}.wh{color:#e8e8e8}
.cz{font-family:'Cinzel',serif;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#e8c48a;text-shadow:0 0 8px rgba(232,196,138,.45)}
.iron{background:linear-gradient(#3a342d,#231f1a);border-top:1px solid #5a5148;border-bottom:1px solid #0e0c0a}
.hood{position:absolute;left:50%;transform:translateX(-50%);top:0;padding:1px 16px 3px;background:linear-gradient(#3a342d,#1d1915);border:1px solid #0e0c0a;border-top:0;border-radius:0 0 7px 7px;font-size:11px;line-height:14px;box-shadow:0 2px 5px rgba(0,0,0,.5)}
.win{background:radial-gradient(120% 70% at 50% 0,rgba(232,196,138,.11),rgba(232,196,138,0) 70%),#0b0907;box-shadow:inset 0 0 28px rgba(0,0,0,.7)}
.card{background:rgba(232,196,138,.06);border:1px solid rgba(232,196,138,.24);border-radius:8px;box-shadow:inset 0 1px 0 rgba(232,196,138,.18)}
.key{display:flex;align-items:center;justify-content:center;min-width:46px;height:46px;border-radius:10px;background:rgba(22,19,15,.80);border:1px solid rgba(232,196,138,.34);color:#e8c48a;box-shadow:inset 0 1px 0 rgba(232,196,138,.16),0 2px 6px rgba(0,0,0,.6)}
.key.off{color:#8d7a5c;border-color:rgba(232,196,138,.14);background:rgba(22,19,15,.55)}
.key.flee{border-color:#d75f5f;color:#ff9a8f;background:rgba(48,14,12,.84)}
.bar{height:6px;border-radius:3px;background:#221f1b;overflow:hidden;flex:1}
.bar i{display:block;height:100%;border-radius:3px}
.hp{background:#45b862}.mn{background:#4a80e8}.mv{background:#d79a4a}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#f0b84f;color:#170f03;font-size:12px;font-weight:700;line-height:1}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.inrow{display:flex;align-items:center;gap:8px;padding:6px 8px;background:#0b0907;border-top:1px solid #2a2520}
.field{flex:1;height:44px;border-radius:10px;border:1px solid rgba(232,196,138,.30);background:#050403;display:flex;align-items:center;padding:0 12px;color:#8a8a8a}
.ib{width:44px;height:44px;border-radius:10px;border:1px solid rgba(232,196,138,.24);background:rgba(232,196,138,.06);color:#e8c48a;display:flex;align-items:center;justify-content:center}
/* ---- direction A: Comm sheet ---- */
.sheet{position:relative;flex:none;display:flex;flex-direction:column;box-shadow:0 -8px 18px rgba(0,0,0,.6)}
.edge{position:relative;height:14px;flex:none}
.grab{position:absolute;left:50%;top:4px;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:#8d7a5c}
.rail{width:56px;flex:none;display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 0;border-right:1px solid rgba(232,196,138,.16);background:rgba(0,0,0,.28)}
.rb{position:relative;width:44px;height:44px;border-radius:22px;border:1px solid rgba(232,196,138,.24);background:rgba(232,196,138,.06);color:#e8c48a;display:flex;align-items:center;justify-content:center;font-weight:700}
.rb.on{box-shadow:0 0 0 2px #0b0907,0 0 0 4px #e8c48a,0 0 12px rgba(232,196,138,.45)}
.rb.g{color:#5faf5f;border-color:rgba(95,175,95,.55);background:rgba(95,175,95,.14)}
.rb.e{color:#af87d7;border-color:rgba(175,135,215,.55);background:rgba(175,135,215,.14)}
.dot{position:absolute;top:-1px;right:-1px;width:12px;height:12px;border-radius:6px;background:#f0b84f;border:2px solid #0b0907}
.thread{flex:1;min-width:0;display:flex;flex-direction:column}
.th{display:flex;align-items:center;height:52px;flex:none;padding:0 4px 0 12px;border-bottom:1px solid rgba(232,196,138,.12)}
.msgs{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:10px}
.bub{max-width:86%;padding:7px 10px 8px;align-self:flex-start;color:#e8e8e8}
.bub.me{align-self:flex-end;background:rgba(232,196,138,.15);border-color:rgba(232,196,138,.36)}
.bh{display:flex;justify-content:space-between;gap:16px;font-size:12px;line-height:16px;margin-bottom:2px}
.chip{display:inline-block;flex:none;height:24px;padding:0 7px;border-radius:6px;border:1px solid rgba(95,175,95,.55);background:rgba(95,175,95,.14);color:#5faf5f;font-size:12px;line-height:22px;white-space:nowrap}
/* typing state: the field grows to two lines, buttons stay on the bottom line */
.field.typing{display:block;height:auto;min-height:44px;padding:8px 10px;color:#e8e8e8;line-height:24px;border-color:#e8c48a;box-shadow:0 0 0 1px rgba(232,196,138,.25)}
.field.typing .chip{vertical-align:top;margin-right:6px}
.cur{display:inline-block;width:9px;height:18px;margin-left:1px;background:#e8c48a;vertical-align:-4px}
</style>
</helmet>
<div class="ph">

  <!-- vitals strip: read-only -->
  <div class="iron" style="display:flex;align-items:center;gap:10px;padding:0 10px;height:34px;flex:none;font-size:12px;line-height:14px">
    <span style="display:flex;align-items:center;gap:5px;flex:1"><span class="wh">HP</span><span class="bar"><i class="hp" style="width:74%"></i></span></span>
    <span style="display:flex;align-items:center;gap:5px;flex:1"><span class="wh">MA</span><span class="bar"><i class="mn" style="width:80%"></i></span></span>
    <span style="display:flex;align-items:center;gap:5px;flex:1"><span class="wh">MV</span><span class="bar"><i class="mv" style="width:90%"></i></span></span>
    <span class="hit" style="white-space:nowrap">ruffian: wounded</span>
  </div>

  <!-- game text: three lines of the fight -->
  <div class="gt" style="flex:none;height:73px">
<pre><span class="dim">A half-orc ruffian slashes Dori.</span>
<span class="hit">You pierce a half-orc ruffian hard.</span>
*= HP:Fine R:Bad&gt; </pre>
  </div>

  <!-- Comm sheet -->
  <div class="sheet" style="flex:1;min-height:0">
    <div class="iron edge"><span class="grab"></span></div>
    <span class="hood cz" style="top:13px;z-index:1">Comm</span>

    <div class="win" style="flex:1;min-height:0;display:flex">

      <!-- icon rail -->
      <div class="rail">
        <button class="rb" aria-label="Public"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h3l6 4V6l-6 4H4z"/><path d="M16.5 9.5a4 4 0 0 1 0 5"/><path d="M19 7a7.5 7.5 0 0 1 0 10"/></svg></button>
        <button class="rb" aria-label="Group, unread"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 19c0-3.3 2.7-5 6-5s6 1.7 6 5"/><circle cx="17" cy="9" r="2.4"/><path d="M17 14c2.4 0 4 1.3 4 4"/></svg><span class="dot"></span></button>
        <span style="width:24px;height:1px;background:rgba(232,196,138,.24)"></span>
        <button class="rb g on" aria-label="Gibur, selected">G</button>
        <button class="rb e" aria-label="Elanor">E</button>
      </div>

      <!-- thread with Gibur -->
      <div class="thread">
        <div class="th">
          <span class="tell" style="font-weight:700;flex:1">Gibur</span>
          <button class="ib" aria-label="Lower Comm" style="border-color:transparent;background:none"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
        </div>
        <div class="msgs">
          <div class="card bub">
            <div class="bh"><span class="tell" style="font-weight:700">Gibur</span><span class="dim">14:01</span></div>
            you at hill road?
          </div>
          <div class="card bub">
            <div class="bh"><span class="tell" style="font-weight:700">Gibur</span><span class="dim">14:02</span></div>
            more coming, 2 trolls
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- input row: reply in progress -->
  <div class="inrow" style="flex:none;align-items:flex-end">
    <button class="ib" aria-label="Menu"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="field typing"><span class="chip">tell Gibur</span>on my way,<br>hold the gate<span class="cur"></span></div>
    <button aria-label="Send to Gibur" style="width:64px;height:44px;flex:none;border-radius:10px;border:1px solid #e8c48a;background:#e8c48a;color:#170f03;font-weight:700">Send</button>
  </div>

  <!-- on-screen keyboard placeholder -->
  <div style="height:300px;flex:none;background:#1a1a1a;display:flex;align-items:center;justify-content:center;color:#8a8a8a">keyboard</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
