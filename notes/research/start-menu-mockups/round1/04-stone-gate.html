<!doctype html>
<!--
  04 "Stenporten" (The Stone Gate) - mysterious, magical, carved.

  Idea: you stand on a ledge high in the mountains before a great stone gate
  set between two cliffs; a deep valley with drifting cloud banks and weather
  lies beyond. The keystone carries the new mark (interlaced ring, mountain,
  star, a lantern hanging beneath) and the arch's inner band carries
  "MUME COCKPIT" in an original angular rune-styled lettering. The inlaid
  lines glow moon-silver, and the glow follows MUME's real moon (phase and
  altitude). The menu is inscribed on the closed stone doors; Enter MUME
  opens them and light floods out. Sub-pages are stone tablets set into the
  doors.

  Cost to build for real: medium-high. The scene is ~1500 lines of plain
  Canvas 2D (procedural stone baked once per size/season, then re-lit per
  frame with three composite ops; sky, cloud sprites, pattern rain). The
  real version would split it into modules (scene/sky, scene/stone,
  scene/fx, mark/glyphs), reuse src/gmcp/clock.ts + gametime.ts instead of
  the inline copies, and turn the sub-pages into a Preact "carved page" kit.
  Risks: stone bake time on large/HiDPI screens (~100-300 ms, could move to
  a worker/OffscreenCanvas), and keeping text contrast on day vs. night stone.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stenporten</title>
<link rel="icon" id="favicon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
<style>
:root {
  --glow: .5;          /* moon-silver glow 0..1, set from the moon */
  --door-glow: 0;      /* extra glow while the gate opens */
  --silver: #e6eeff;
  --silver-2: #b9c8ea;
  --ink: rgba(8, 10, 16, .78);
  --sc: 1;             /* layout scale */
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #04060b; overflow: hidden; }
body { font-family: 'Cormorant Garamond', Georgia, serif; color: var(--silver); -webkit-font-smoothing: antialiased; user-select: none; }
#scene { position: fixed; inset: 0; overflow: hidden; }
canvas.layer { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
#scene.boot canvas.layer, #scene.boot #gate, #scene.boot #archsvg { opacity: 0; }
canvas.layer, #gate, #archsvg { transition: opacity 1.2s ease; }

/* ---------- gate: the two door leaves inside the arch */
#gate { position: absolute; perspective: 1300px; perspective-origin: 50% 45%; }
#glowback { position: absolute; inset: 0; opacity: 0; transition: opacity 1.1s ease;
  background: radial-gradient(ellipse 60% 55% at 50% 58%, #ffffff 0%, #f4f2ff 18%, #cfdcff 42%, rgba(150,175,255,.55) 70%, rgba(90,110,200,.0) 100%), #dfe6ff; }
.leaf { position: absolute; top: 0; height: 100%; overflow: hidden; transform-style: preserve-3d; backface-visibility: hidden;
  transition: transform 1.7s cubic-bezier(.55,.02,.22,1), filter 1.7s ease; }
#leafL { left: 0; transform-origin: 0 50%; }
#leafR { transform-origin: 100% 50%; }
.leaf canvas, .leaf svg { position: absolute; top: 0; }
#seam { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; margin-left: -1px; opacity: 0; transform: scaleY(0); transform-origin: 50% 60%;
  background: linear-gradient(180deg, transparent, #fff 12%, #fff 88%, transparent); box-shadow: 0 0 12px 3px rgba(210,225,255,.9), 0 0 40px 8px rgba(160,190,255,.6);
  transition: transform .7s cubic-bezier(.3,.7,.2,1), opacity .3s; }
body.opening #seam { opacity: 1; transform: scaleY(1); }
body.open #seam { opacity: 0; transition: opacity .4s; }
body.open #leafL { transform: rotateY(80deg); filter: brightness(.45); }
body.open #leafR { transform: rotateY(-80deg); filter: brightness(.45); }
body.open #glowback { opacity: 1; }
body.instant .leaf, body.instant #glowback, body.instant #seam { transition: none !important; }

/* door tracery (inside each leaf) */
.tracery .gr { fill: none; stroke: rgba(0,0,0,.55); stroke-linecap: round; stroke-linejoin: round; }
.tracery .hl { fill: none; stroke: rgba(255,255,255,.10); stroke-linecap: round; }
.tracery .in { fill: none; stroke: #c9d5f2; stroke-linecap: round; stroke-linejoin: round; opacity: calc(.18 + .5 * var(--glow) + .8 * var(--door-glow)); }
.tracery .gl { fill: none; stroke: #b8ccff; stroke-linecap: round; filter: url(#bloom); opacity: calc(.75 * var(--glow) + var(--door-glow)); }
.tracery .dot { fill: #dfe8ff; opacity: calc(.25 + .6 * var(--glow) + var(--door-glow)); }

/* ---------- arch overlay svg: inscription + keystone mark */
#archsvg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
#archsvg .groove { fill: none; stroke: rgba(6,8,12,.82); stroke-linecap: square; stroke-linejoin: miter; }
#archsvg .lip { fill: none; stroke: rgba(255,255,255,.16); stroke-linecap: square; stroke-linejoin: miter; }
#archsvg .inlay { fill: none; stroke: #dbe3f6; stroke-linecap: square; stroke-linejoin: miter; opacity: calc(.62 + .38 * var(--glow)); }
#archsvg .halo { fill: none; stroke: #a9c2ff; stroke-linecap: round; stroke-linejoin: round; filter: url(#bloomWide); opacity: calc(var(--glow) * 1.05 + var(--door-glow)); }
#archsvg .core { fill: none; stroke: #f4f8ff; stroke-linecap: square; stroke-linejoin: miter; filter: url(#bloom); opacity: calc(var(--glow) * .9 + var(--door-glow)); }
#archsvg .fillv { fill: #eef3ff; stroke: none; opacity: calc(.5 + .5 * var(--glow)); }
#archsvg .pulse { fill: none; stroke: #ffffff; stroke-linecap: round; stroke-dasharray: 3 97; filter: url(#bloom);
  opacity: calc(var(--glow) * 1.1); animation: run 7s linear infinite; }
#archsvg .pulse.p2 { animation-duration: 9.5s; animation-delay: -3s; }
@keyframes run { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }

/* ---------- inscribed menu on the doors */
#carve { position: absolute; inset: 0; transition: opacity .6s ease, filter .6s ease, transform .6s ease; }
body.open #carve, body.opening #carve { pointer-events: none; }
body.open #carve { opacity: 0; filter: blur(6px); }
#menu { position: absolute; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 0; list-style: none; }
.mi { position: relative; font-family: 'Cinzel', serif; font-weight: 600; letter-spacing: .16em; text-transform: uppercase;
  font-size: calc(17px * var(--sc)); line-height: 1; padding: calc(9px * var(--sc)) calc(30px * var(--sc)); cursor: pointer; white-space: nowrap;
  color: rgba(196, 208, 232, calc(.30 + .16 * var(--glow)));
  text-shadow: 0 -1px 0 rgba(0,0,0,.75), 0 1px 0 rgba(255,255,255,.10);
  transition: color .35s ease, text-shadow .35s ease, letter-spacing .35s ease; }
.mi.primary { font-size: calc(23px * var(--sc)); font-weight: 700; padding-bottom: calc(14px * var(--sc)); letter-spacing: .2em; }
.mi:hover { color: rgba(214, 224, 246, calc(.52 + .2 * var(--glow))); }
.mi.sel { color: #f6f9ff; letter-spacing: .2em;
  text-shadow: 0 0 2px #fff, 0 0 8px rgba(200,220,255,.95), 0 0 22px rgba(140,170,255,.75), 0 0 48px rgba(110,140,255,.45); }
.mi.primary.sel { letter-spacing: .24em; }
.mi::before, .mi::after { content: ''; position: absolute; top: 50%; width: calc(7px * var(--sc)); height: calc(7px * var(--sc)); margin-top: calc(-3.5px * var(--sc));
  transform: rotate(45deg) scale(.4); border: 1px solid rgba(220,232,255,.9); opacity: 0; transition: opacity .3s, transform .35s;
  box-shadow: 0 0 6px rgba(190,210,255,.95), inset 0 0 3px rgba(255,255,255,.8); }
.mi::before { left: calc(8px * var(--sc)); }
.mi::after { right: calc(8px * var(--sc)); }
.mi.primary::before, .mi.primary::after { margin-top: calc(-6px * var(--sc)); }
.mi.sel::before, .mi.sel::after { opacity: 1; transform: rotate(45deg) scale(1); }
.mi .sweep { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.mi.sel .sweep::after { content: ''; position: absolute; top: 0; bottom: 0; width: 40%; left: -40%;
  background: linear-gradient(90deg, transparent, rgba(220,232,255,.10), transparent); animation: sweep 3.6s ease-in-out infinite; }
@keyframes sweep { 0% { left: -40%; } 55%, 100% { left: 110%; } }
body.opening .mi.sel { text-shadow: 0 0 3px #fff, 0 0 14px #fff, 0 0 34px rgba(170,195,255,1), 0 0 80px rgba(130,160,255,.9); }

@media (max-width: 719px) { .mi.primary { font-size: calc(20px * var(--sc)); letter-spacing: .16em; } .mi.primary.sel { letter-spacing: .19em; } }
#flash { position: absolute; left: 0; right: 0; text-align: center; font-family: 'Cinzel', serif; letter-spacing: .14em; font-size: calc(12px * var(--sc));
  color: #eef3ff; opacity: 0; text-shadow: 0 0 10px rgba(170,195,255,.9); transition: opacity .5s; text-transform: uppercase; pointer-events: none; }
#flash.on { opacity: 1; transition: opacity .12s; }

#quote { position: absolute; left: 0; right: 0; text-align: center; padding: 0 calc(34px * var(--sc)); pointer-events: none; }
#quote .q { font-style: italic; font-weight: 500; font-size: calc(17px * var(--sc)); line-height: 1.28;
  color: rgba(205, 214, 236, calc(.50 + .18 * var(--glow))); text-shadow: 0 -1px 0 rgba(0,0,0,.7), 0 1px 0 rgba(255,255,255,.06); }
#quote .by { margin-top: calc(6px * var(--sc)); font-family: 'Cinzel', serif; font-size: calc(10.5px * var(--sc)); letter-spacing: .22em; text-transform: uppercase;
  color: rgba(200, 212, 238, calc(.38 + .2 * var(--glow))); text-shadow: 0 -1px 0 rgba(0,0,0,.7); }

/* ---------- sub-page: stone tablets set into the doors */
#sub { position: absolute; inset: 0; opacity: 0; pointer-events: none; transition: opacity .55s ease .1s, transform .6s ease .1s; transform: translateY(10px); }
body.sub #sub { opacity: 1; pointer-events: auto; transform: none; }
body.sub #menu, body.sub #quote, body.sub #flash.main { opacity: 0; pointer-events: none; }
.tracery .fan { transition: opacity .6s; }
body.sub .tracery .fan { opacity: .12; }
#menu, #quote { transition: opacity .45s ease; }
#sub h2 { position: absolute; left: 0; right: 0; margin: 0; text-align: center; font-family: 'Cinzel', serif; font-weight: 700; text-transform: uppercase;
  font-size: calc(21px * var(--sc)); letter-spacing: .3em; color: #eef3ff;
  text-shadow: 0 0 2px #fff, 0 0 10px rgba(190,210,255,.8), 0 0 30px rgba(130,160,255,.5); }
#sub h2 small { display: block; margin-top: calc(6px * var(--sc)); font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500; text-transform: none;
  letter-spacing: .04em; font-size: calc(14px * var(--sc)); color: rgba(205,214,236,.6); text-shadow: 0 -1px 0 rgba(0,0,0,.7); }
#tablets { position: absolute; left: calc(30px * var(--sc)); right: calc(30px * var(--sc)); display: flex; flex-direction: column; gap: calc(9px * var(--sc)); }
.tab { position: relative; display: grid; grid-template-columns: auto 1fr auto; grid-template-rows: auto auto; column-gap: calc(12px * var(--sc)); align-items: center;
  padding: calc(8px * var(--sc)) calc(16px * var(--sc)) calc(8px * var(--sc)) calc(14px * var(--sc)); cursor: pointer; border-radius: 3px;
  background-color: rgba(150, 156, 170, .16); background-image: var(--noise), linear-gradient(180deg, rgba(255,255,255,.09), rgba(0,0,0,.18));
  background-size: 160px 160px, auto;
  box-shadow: inset 0 2px 3px rgba(0,0,0,.55), inset 0 -1px 0 rgba(255,255,255,.12), 0 1px 0 rgba(255,255,255,.10), 0 -1px 0 rgba(0,0,0,.5);
  transition: box-shadow .3s, background-color .3s; }
.tab .rune { grid-row: 1 / 3; width: calc(26px * var(--sc)); height: calc(26px * var(--sc)); }
.tab .rune path { fill: none; stroke: rgba(205,216,240,.45); stroke-width: 1.6; }
.tab .nm { font-family: 'Cinzel', serif; font-weight: 700; font-size: calc(16px * var(--sc)); letter-spacing: .1em; color: rgba(214,224,244,.78); text-shadow: 0 -1px 0 rgba(0,0,0,.8); }
.tab .ch { grid-column: 2; min-width: 0; font-size: calc(15px * var(--sc)); font-style: italic; color: rgba(200,210,232,.62); text-shadow: 0 -1px 0 rgba(0,0,0,.7); }
.tab .when { grid-row: 1 / 3; grid-column: 3; text-align: right; font-size: calc(13px * var(--sc)); color: rgba(200,210,232,.55); font-family: 'Cormorant Garamond', serif; font-weight: 600; line-height: 1.15; }
.tab .when b { display: block; font-family: 'Cinzel', serif; font-weight: 600; font-size: calc(9px * var(--sc)); letter-spacing: .2em; opacity: .7; text-transform: uppercase; }
.tab:hover { background-color: rgba(170, 178, 196, .22); }
.tab.sel { background-color: rgba(175, 190, 225, .24);
  box-shadow: inset 0 2px 3px rgba(0,0,0,.5), inset 0 0 0 1px rgba(220,232,255,.75), inset 0 0 14px rgba(170,195,255,.35), 0 0 18px rgba(140,170,255,.45), 0 0 2px rgba(220,232,255,.9); }
.tab.sel .nm { color: #f6f9ff; text-shadow: 0 0 8px rgba(190,210,255,.9), 0 0 2px #fff; }
.tab.sel .rune path { stroke: #eef3ff; filter: drop-shadow(0 0 3px rgba(190,210,255,.9)); }
#btns { position: absolute; left: calc(22px * var(--sc)); right: calc(22px * var(--sc)); display: flex; justify-content: center; gap: calc(8px * var(--sc)); flex-wrap: wrap; }
.btn { font-family: 'Cinzel', serif; font-weight: 700; text-transform: uppercase; letter-spacing: .14em; font-size: calc(11.5px * var(--sc));
  padding: calc(8px * var(--sc)) calc(11px * var(--sc)) calc(7px * var(--sc)); color: rgba(206,216,240,.66); cursor: pointer; border-radius: 2px;
  background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(0,0,0,.22)), rgba(120,126,140,.18);
  box-shadow: 0 2px 3px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.18), inset 0 -1px 0 rgba(0,0,0,.4); text-shadow: 0 -1px 0 rgba(0,0,0,.8); transition: all .25s; }
.btn:hover { color: rgba(230,236,250,.9); }
.btn.sel { color: #f6f9ff; text-shadow: 0 0 8px rgba(190,210,255,.95), 0 0 2px #fff;
  box-shadow: 0 2px 3px rgba(0,0,0,.55), inset 0 0 0 1px rgba(220,232,255,.75), 0 0 14px rgba(150,180,255,.5); }
.btn.danger.sel { color: #ffe9e4; text-shadow: 0 0 8px rgba(255,160,140,.9); box-shadow: 0 2px 3px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,190,175,.75), 0 0 14px rgba(255,130,110,.45); }
#subhint { position: absolute; left: 0; right: 0; text-align: center; font-family: 'Cinzel', serif; font-size: calc(10px * var(--sc)); letter-spacing: .22em;
  text-transform: uppercase; color: rgba(200,212,238,.42); text-shadow: 0 -1px 0 rgba(0,0,0,.7); cursor: pointer; }
#subhint:hover { color: rgba(225,234,252,.8); }

/* ---------- gate-opening flood and the demo "connect" */
#rays { position: absolute; inset: -20%; pointer-events: none; opacity: 0; mix-blend-mode: screen; transform: scale(.6); transform-origin: 50% 55%;
  transition: opacity 1.4s ease, transform 2.6s cubic-bezier(.2,.7,.2,1); }
body.open #rays { opacity: 1; transform: scale(1.15); }
#whiteout { position: absolute; inset: 0; background: radial-gradient(circle at 50% 55%, #fff, #e8eeff 45%, #c9d6f6); opacity: 0; pointer-events: none;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; transition: opacity 1s ease; color: #2a3350; }
#whiteout.on { opacity: 1; }
#whiteout .t1 { font-family: 'Cinzel', serif; font-weight: 700; letter-spacing: .3em; font-size: 22px; }
#whiteout .t2 { font-style: italic; font-size: 18px; opacity: .75; }
#whiteout svg { width: 64px; height: 64px; opacity: .8; }

/* ---------- demo panel */
#demo { position: absolute; left: 12px; bottom: 12px; z-index: 50; font: 12px/1.35 ui-monospace, 'SFMono-Regular', Menlo, monospace; color: #c9d3ea; user-select: none; }
#demo .tog { display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 8px; background: rgba(8,11,18,.62); border: 1px solid rgba(160,180,220,.18);
  border-radius: 4px; cursor: pointer; backdrop-filter: blur(6px); opacity: .55; transition: opacity .2s; }
#demo .tog:hover, #demo.openp .tog { opacity: 1; }
#demo .tog img { width: 16px; height: 16px; display: block; }
#demo .body { display: none; margin-bottom: 6px; width: 282px; padding: 10px 12px; background: rgba(8,11,18,.86); border: 1px solid rgba(160,180,220,.22); border-radius: 5px; backdrop-filter: blur(8px); }
#demo.openp .body { display: block; }
#demo label { display: grid; grid-template-columns: 74px 1fr; align-items: center; gap: 8px; margin: 5px 0; }
#demo select, #demo input[type=range] { width: 100%; background: #111725; color: #d9e2f6; border: 1px solid #2c3754; border-radius: 3px; font: inherit; padding: 2px 4px; }
#demo input[type=range] { padding: 0; accent-color: #b9c8ea; }
#demo .row { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
#demo button { background: #18203a; color: #d9e2f6; border: 1px solid #34406a; border-radius: 3px; font: inherit; padding: 2px 8px; cursor: pointer; }
#demo .read { margin: 2px 0 8px; color: #e6edff; }
#demo .read .dim { color: #8e9bbb; }
#demo .favs { display: flex; align-items: flex-end; gap: 10px; margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(160,180,220,.15); }
#demo .favs img { display: block; image-rendering: auto; }
#demo .favs span { color: #8e9bbb; font-size: 11px; }
@media (max-width: 719px) {
  #sub h2 small { display: none; }
  #tablets { left: calc(16px * var(--sc)); right: calc(16px * var(--sc)); gap: calc(8px * var(--sc)); }
  .tab { padding: calc(7px * var(--sc)) calc(10px * var(--sc)); column-gap: calc(9px * var(--sc)); }
  .tab .rune { width: calc(20px * var(--sc)); height: calc(20px * var(--sc)); }
  .tab .nm { font-size: calc(14px * var(--sc)); }
  .tab .ch { font-size: calc(13px * var(--sc)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .tab .when { font-size: calc(12px * var(--sc)); }
  .tab .when b { display: none; }
  #btns { left: calc(8px * var(--sc)); right: calc(8px * var(--sc)); gap: calc(5px * var(--sc)); }
  .btn { font-size: calc(9.5px * var(--sc)); letter-spacing: .1em; padding: calc(7px * var(--sc)) calc(7px * var(--sc)) calc(6px * var(--sc)); }
}
</style>
</head>
<body>
<div id="scene" class="boot">
  <canvas id="sky" class="layer"></canvas>
  <canvas id="stone" class="layer"></canvas>
  <div id="gate">
    <div id="glowback"></div>
    <div id="leafL" class="leaf"><canvas></canvas><svg class="tracery"></svg></div>
    <div id="leafR" class="leaf"><canvas></canvas><svg class="tracery"></svg></div>
    <div id="seam"></div>
    <div id="carve">
      <ul id="menu" role="menu"></ul>
      <div id="flash" class="main"></div>
      <div id="quote"><div class="q"></div><div class="by"></div></div>
      <div id="sub" aria-label="Profiles">
        <h2>Profiles<small>Choose the name you will carry through the gate</small></h2>
        <div id="tablets"></div>
        <div id="btns"></div>
        <div id="subhint">Esc · return to the gate</div>
      </div>
    </div>
  </div>

  <canvas id="fx" class="layer"></canvas>

</div>

<div id="demo">
  <div class="body">
    <div class="read" id="readout"></div>
    <label>Time <input type="range" id="dTime" min="0" max="24" step="0.05"></label>
    <label>Month <select id="dMonth"></select></label>
    <label>Weather <select id="dWeather">
      <option value="auto">auto (cycling)</option><option>clear</option><option>clouds</option><option>rain</option>
      <option>storm</option><option>snow</option><option>fog</option></select></label>
    <label>Moon <select id="dMoon"><option value="auto">auto (model)</option></select></label>
    <div class="row"><label style="display:flex;gap:6px;margin:0"><input type="checkbox" id="dFast"> fast time ×600</label>
      <button id="dReal">real time</button></div>
    <div class="favs"><img id="fv16" width="16" height="16" alt=""><img id="fv24" width="24" height="24" alt=""><img id="fv32" width="32" height="32" alt=""><img id="fv64" width="64" height="64" alt=""><span>favicon 16 · 24 · 32 · 64</span></div>
  </div>
  <div class="tog" id="dTog"><img id="fvTog" alt=""><span>demo</span></div>
</div>

<script>
'use strict';
/* ================================================================ game time (inline copy of clock.ts / gametime.ts essentials) */
const YEAR_S = 518400, MONTH_S = 43200, DAY_S = 1440;
const DAWN = [8, 9, 8, 7, 7, 6, 5, 4, 5, 6, 7, 7];
const DUSK = [18, 17, 18, 19, 20, 20, 21, 22, 21, 20, 20, 19];
const MONTHS = ['Afteryule', 'Solmath', 'Rethe', 'Astron', 'Thrimidge', 'Forelithe', 'Afterlithe', 'Wedmath', 'Halimath', 'Winterfilth', 'Blotmath', 'Foreyule'];
const WEEKDAYS = ['Sterday', 'Sunday', 'Monday', 'Trewsday', 'Hevensday', 'Mersday', 'Highday'];
const SNOW_MONTHS = new Set([11, 0, 1]);
const MOON_CYCLE = (29 * 24 + 12) * 60 + 44, MOON_ORIGIN = 2850 * YEAR_S;
const PHASES = ['new', 'waxing crescent', 'first quarter', 'waxing gibbous', 'full', 'waning gibbous', 'third quarter', 'waning crescent'];
const mod = (a, n) => ((a % n) + n) % n;
function clockEpoch() {
  try { const o = JSON.parse(localStorage.getItem('wc.clock') || 'null'); if (o && Number.isFinite(o.epoch)) return o.epoch; } catch (e) {}
  return 1696118400 - 2850 * YEAR_S;
}
const EPOCH = clockEpoch();
function moonAt(g) {

    else { p.moveTo(W + 20, -20); for (let y = -20; y <= H + 20; y += step) p.lineTo(W - L.cliffX(y, 1), y); p.lineTo(W + 20, H + 20); }
    p.closePath();
    cliffs.push([p, side]);
    g.save(); g.clip(p); tex(T.cliff);
    // depth: darker away from the lit inner edge
    const ex = side < 0 ? L.cliffX(H * .5, 0) : W - L.cliffX(H * .5, 1);
    const gr = g.createLinearGradient(ex, 0, side < 0 ? 0 : W, 0);
    gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(.35, 'rgba(0,0,0,.22)'); gr.addColorStop(1, 'rgba(0,0,0,.6)');
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
    // overhangs: shadows under random ledges
    for (let i = 0; i < 16; i++) {
      const y = R() * H, x = side < 0 ? R() * ex : ex + R() * (W - ex);
      const lg = g.createLinearGradient(0, y, 0, y + 22 * s); lg.addColorStop(0, 'rgba(0,0,0,.5)'); lg.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = lg; g.beginPath(); g.ellipse(x, y + 8 * s, (40 + R() * 90) * s, 14 * s, (R() - .5) * .3, 0, 7); g.fill();
      g.strokeStyle = 'rgba(255,248,236,.14)'; g.lineWidth = 1.2 * s; g.beginPath(); g.ellipse(x, y + 8 * s, (40 + R() * 90) * s, 14 * s, 0, Math.PI * 1.08, Math.PI * 1.92); g.stroke();
      if (snowy) { g.fillStyle = 'rgba(232,240,252,.8)'; const wd = (30 + R() * 60) * s; for (let q = 0; q < 7; q++) { g.beginPath(); g.ellipse(x - wd / 2 + q * wd / 6 + (R() - .5) * 8 * s, y + 2 * s + (R() - .5) * 4 * s + Math.abs(q - 3) * 1.4 * s, (6 + R() * 10) * s, (2 + R() * 2.6) * s, (R() - .5) * .4, 0, 7); g.fill(); } }
    }
    // cracks
    g.lineCap = 'round';
    for (let i = 0; i < 4; i++) {
      let x = side < 0 ? R() * ex : ex + R() * (W - ex), y = R() * H;
      g.beginPath(); g.moveTo(x, y);
      for (let k = 0; k < 9; k++) { x += (R() - .5) * 26 * s; y += (10 + R() * 26) * s; g.lineTo(x, y); }
      g.strokeStyle = 'rgba(8,8,10,.4)'; g.lineWidth = 1.1 * s; g.stroke();
    }
    g.restore();
    // rim light on the inner edge
    g.save(); g.clip(p);
    g.lineWidth = 3 * s; g.strokeStyle = 'rgba(255,250,240,.18)'; g.stroke(p);
    g.restore();
    g.save(); g.lineWidth = 1.4 * s; g.strokeStyle = 'rgba(0,0,0,.6)'; g.stroke(p); g.restore();
  }

  // --- jambs: plinth, quoins, impost
  for (const side of [-1, 1]) {
    const xi = side < 0 ? cx - R1 : cx + R1;          // band outer edge
    const plH = (L.phone ? 26 : 46) * s;
    // inner band vertical strip (continues the arch band)
    const strip = side < 0 ? rect(cx - R1, ys, b1, yg - ys) : rect(cx + a, ys, b1, yg - ys);
    block(strip, .07, .9);
    // quoins
    let y = ys + L.imp + (L.phone ? 2 : 4) * s, k = 0;
    const qh = (L.phone ? 34 : 50) * s;
    while (y < yg - plH - 2) {
      const h = Math.min(qh, yg - plH - y);
      const w = b2 + (k % 2 ? (L.phone ? 6 : 18) * s : 0);
      block(side < 0 ? rect(xi - w, y, w, h) : rect(xi, y, w, h), (R() - .5) * .14);
      y += h; k++;
    }
    // plinth
    const pw = b1 + b2 + (L.phone ? 8 : 16) * s;
    block(side < 0 ? rect(cx - a - pw, yg - plH, pw + 6 * s, plH) : rect(cx + a - 6 * s, yg - plH, pw + 6 * s, plH), .04, 1.2);
    // impost at the springing line
    const iw = b1 + b2 + (L.phone ? 10 : 20) * s;
    const ip = side < 0 ? rect(cx - a - iw + b1 * 0 - 4 * s, ys, iw + 8 * s, L.imp) : rect(cx + a - 4 * s, ys, iw + 8 * s, L.imp);
    block(ip, .1, 1.3);
    if (snowy) { g.fillStyle = 'rgba(236,242,252,.95)'; const x0 = side < 0 ? cx - a - iw - 4 * s : cx + a - 4 * s; g.beginPath(); g.ellipse(x0 + (iw + 8 * s) / 2, ys - .5 * s, (iw + 8 * s) / 2, 3.5 * s, 0, Math.PI, 0); g.fill();
      g.beginPath(); const x1 = side < 0 ? cx - a - pw : cx + a - 6 * s; g.ellipse(x1 + (pw + 6 * s) / 2, yg - plH, (pw + 6 * s) / 2, 4 * s, 0, Math.PI, 0); g.fill(); }
  }

  // --- the arch: inner band (one smooth moulding) and voussoirs
  {
    const band = sector(a, R1, 0, Math.PI);
    block(band, .08, 1);
    // moulding lines along both edges of the band
    g.strokeStyle = 'rgba(0,0,0,.45)'; g.lineWidth = 1.2 * s;
    for (const r of [a + 4 * s, R1 - 4 * s]) { g.beginPath(); g.arc(cx, ys, r, Math.PI, 0); g.stroke(); }
    g.strokeStyle = 'rgba(255,250,240,.12)';
    for (const r of [a + 5.4 * s, R1 - 2.6 * s]) { g.beginPath(); g.arc(cx, ys, r, Math.PI, 0); g.stroke(); }
    for (const side of [-1, 1]) {
      for (const r of [a + 4 * s, R1 - 4 * s]) { const x = cx + side * r; g.strokeStyle = 'rgba(0,0,0,.45)'; g.beginPath(); g.moveTo(x, ys + L.imp); g.lineTo(x, yg); g.stroke(); }
    }
    const n = L.phone ? 5 : 7;
    const span = Math.PI / 2 - L.thK;
    for (const side of [-1, 1]) {
      for (let i = 0; i < n; i++) {
        let t0 = (i / n) * span, t1 = ((i + 1) / n) * span;
        if (side > 0) { /* right: 0 .. span */ } else { const u0 = Math.PI - t1, u1 = Math.PI - t0; t0 = u0; t1 = u1; }
        const ext = (i % 2) ? 0 : (L.phone ? 4 : 9) * s;
        block(sector(R1, R2 + ext, t0, t1), (R() - .5) * .16, 1.05);
      }
    }
    // keystone
    const kp = new Path2D(); const P = L.key.pts;
    kp.moveTo(P[0][0], P[0][1]); kp.lineTo(P[1][0], P[1][1]); kp.lineTo(P[2][0], P[2][1]); kp.lineTo(P[3][0], P[3][1]); kp.closePath();
    block(kp, .1, 1.5);
    // keystone cap
    const capH = 8 * s; const cap = rect(L.cx - L.key.wTop / 2 - 6 * s, L.key.yTop - capH, L.key.wTop + 12 * s, capH);
    block(cap, .12, 1.3);
    // a recessed roundel for the mark
    const e = L.emb;
    g.save();
    const rg = g.createRadialGradient(e.x, e.y - e.r * .25, e.r * .2, e.x, e.y, e.r * 1.12);
    rg.addColorStop(0, 'rgba(0,0,0,.1)'); rg.addColorStop(.85, 'rgba(0,0,0,.32)'); rg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = rg; g.beginPath(); g.arc(e.x, e.y, e.r * 1.12, 0, 7); g.fill();
    g.restore();
    if (snowy) {
      g.fillStyle = 'rgba(238,244,253,.96)';
      g.beginPath(); g.ellipse(L.cx, L.key.yTop - capH, L.key.wTop / 2 + 8 * s, 6 * s, 0, Math.PI, 0); g.fill();
      // snow on the extrados where it faces up
      g.beginPath();
      for (let t = .30; t <= Math.PI - .30; t += .02) {
        if (Math.abs(t - Math.PI / 2) < L.thK + .02) continue;
        const ext = R2 + 6 * s;
        const th = 6 * s * Math.pow(Math.sin(t), 2) + 1;
        g.moveTo(cx + Math.cos(t) * ext, ys - Math.sin(t) * ext);
        g.ellipse(cx + Math.cos(t) * (ext + th * .2), ys - Math.sin(t) * (ext + th * .2), 7 * s, th, -t + Math.PI / 2, 0, 7);
      }
      g.fill();
    }
  }

  // --- threshold step
  {
    const st = rect(cx - a - 14 * s, yg - 3 * s, 2 * a + 28 * s, (L.phone ? 10 : 15) * s);
    block(st, .09, 1.2);
  }

  // --- moss / lichen / frost
  g.save(); g.clip(stonePath); g.globalAlpha = season === 'winter' ? .9 : .6; tex(T.moss); g.restore();
  for (const [p] of cliffs) { g.save(); g.clip(p); g.globalAlpha = season === 'winter' ? .8 : 1; tex(T.moss); g.restore(); }

  // --- door recess (covered by the leaves; seen while they open)
  {
    const p = doorShape(0, 0);
    g.save(); g.translate(cx - a, L.doorTop); g.fillStyle = '#05060a'; g.fill(p); g.restore();
  }
  ARCH_PATHS = { stonePath };
  stoneBase.main = base;

  // --- door leaves
  const dw = 2 * a, dh = yg - L.doorTop;
  const door = mk(dw * DPR_STONE, dh * DPR_STONE), d = door.getContext('2d');
  d.scale(DPR_STONE, DPR_STONE);
  const dp = doorShape(0, 0);
  d.save(); d.clip(dp);
  d.drawImage(T.door, -(cx - a), -L.doorTop, W, H);
  // recess shadow from the arch above and the jambs at the sides
  const tg = d.createLinearGradient(0, 0, 0, dh); tg.addColorStop(0, 'rgba(0,0,0,.42)'); tg.addColorStop(.25, 'rgba(0,0,0,.12)'); tg.addColorStop(.8, 'rgba(0,0,0,.05)'); tg.addColorStop(1, 'rgba(0,0,0,.35)');
  d.fillStyle = tg; d.fillRect(0, 0, dw, dh);
  const sg = d.createLinearGradient(0, 0, dw, 0); sg.addColorStop(0, 'rgba(0,0,0,.45)'); sg.addColorStop(.12, 'rgba(0,0,0,0)'); sg.addColorStop(.88, 'rgba(0,0,0,0)'); sg.addColorStop(1, 'rgba(0,0,0,.45)');
  d.fillStyle = sg; d.fillRect(0, 0, dw, dh);
  d.lineWidth = 10 * s; d.strokeStyle = 'rgba(0,0,0,.35)'; d.stroke(dp);
  // faint centre seam
  d.fillStyle = 'rgba(0,0,0,.28)'; d.fillRect(a - .6 * s, 0, 1.2 * s, dh);
  d.restore();
  for (const [key, x] of [['leafL', 0], ['leafR', a]]) {
    const c = mk(a * DPR_STONE, dh * DPR_STONE);
    c.getContext('2d').drawImage(door, -x * DPR_STONE, 0);
    stoneBase[key] = c;
  }
}
// The door outline in door-box coordinates (round top + rectangle).
function doorShape(ox, oy) {
  const { a } = L, dh = L.yg - L.doorTop, p = new Path2D();
  p.moveTo(ox, oy + a); p.arc(ox + a, oy + a, a, Math.PI, 0); p.lineTo(ox + 2 * a, oy + dh); p.lineTo(ox, oy + dh); p.closePath();
  return p;
}

/* ================================================================ relight: multiply by ambient, add directional + flood + lightning */
const lit = { key: '', leafL: null, leafR: null };
function relight(base, out, P) {
  const c = out.getContext('2d'), w = out.width, h = out.height;
  c.globalCompositeOperation = 'copy'; c.drawImage(base, 0, 0);
  c.globalCompositeOperation = 'multiply'; c.fillStyle = rgb(P.amb); c.fillRect(0, 0, w, h);
  c.globalCompositeOperation = 'screen';
  if (P.dir > 0.01) {
    const gr = c.createLinearGradient(P.lx * w, 0, (1 - P.lx) * w, h * .3);
    gr.addColorStop(0, rgb(P.dirCol, P.dir)); gr.addColorStop(.6, rgb(P.dirCol, P.dir * .25)); gr.addColorStop(1, rgb(P.dirCol, 0));
    c.fillStyle = gr; c.fillRect(0, 0, w, h);
  }
  if (P.flash > 0.01) {
    const gr = c.createLinearGradient(P.fx * w, 0, (1 - P.fx) * w, h);
    gr.addColorStop(0, `rgba(205,218,255,${P.flash * .75})`); gr.addColorStop(1, `rgba(170,190,255,${P.flash * .2})`);
    c.fillStyle = gr; c.fillRect(0, 0, w, h);
  }
  if (P.flood > 0.01 && P.ox !== undefined) {
    const gr = c.createRadialGradient(P.ox * w, P.oy * h, 0, P.ox * w, P.oy * h, Math.max(w, h) * .75);
    gr.addColorStop(0, `rgba(235,240,255,${P.flood})`); gr.addColorStop(.35, `rgba(200,215,255,${P.flood * .55})`); gr.addColorStop(1, 'rgba(160,180,255,0)');
    c.fillStyle = gr; c.fillRect(0, 0, w, h);
  }
  c.globalCompositeOperation = 'destination-in'; c.drawImage(base, 0, 0);
  c.globalCompositeOperation = 'source-over';
}

/* ================================================================ SVG: inscription, keystone mark, door tracery */
const SVGNS = 'http://www.w3.org/2000/svg';
function buildArchSVG() {

  const rm = a + b1 / 2;

  let pos = -total / 2;
  const sw = Math.max(1.1, gh * .085);
  let ins = '';
  for (const ch of word) {
    if (ch === ' ') { pos += space; continue; }
    const mid = pos + gw / 2;
    const phi = Math.PI / 2 - mid / rm;                   // angle on the arch (math, y up)
    const x = cx + rm * Math.cos(phi), y = ys - rm * Math.sin(phi);
    const rot = 90 - phi * 180 / Math.PI;
    const sc = gh / 16;
    ins += `<g transform="translate(${x.toFixed(2)},${y.toFixed(2)}) rotate(${rot.toFixed(2)}) scale(${sc.toFixed(4)}) translate(-5,-8)">${GLYPHS[ch].map((d) => `<path d="${d}"/>`).join('')}</g>`;
    pos += adv;
  }

  const dia = (off) => { const phi = Math.PI / 2 - off / rm; const x = cx + rm * Math.cos(phi), y = ys - rm * Math.sin(phi); const r = gh * .16; return `<path d="M${x},${y - r} L${x + r},${y} L${x},${y + r} L${x - r},${y} Z"/>`; };
  ins += dia(-total / 2 - gh * .7) + dia(total / 2 + gh * .7);

function buildDoorTracery() {
  const { a, s } = L, dh = L.yg - L.doorTop, m = (L.phone ? 10 : 15) * s;
  const r1 = a - m, r2 = a - m - 5 * s;
  const borderD = (r, inset) => `M${a - r},${dh - inset} L${a - r},${a} A${r},${r} 0 0 1 ${a + r},${a} L${a + r},${dh - inset}`;
  let d = borderD(r1, m) + ' ' + borderD(r2, m + 5 * s) + ` M${a - r2},${dh - m - 5 * s} L${a + r2},${dh - m - 5 * s}`;
  // lunette fan of rays from a small star
  const fy = a - (L.phone ? 6 : 14) * s;
  const rIn = (L.phone ? 18 : 30) * s, rOut = r2 - 12 * s;
  let f = '';
  for (let i = 1; i < 12; i++) {
    const t = Math.PI * i / 12, long = i % 2 === 0;
    const r0 = rIn + (long ? 0 : 10 * s), r = long ? rOut : rOut - 22 * s;
    f += ` M${a + Math.cos(t) * r0},${fy - Math.sin(t) * r0} L${a + Math.cos(t) * r},${fy - Math.sin(t) * r}`;
  }
  f += ` M${a - rIn * .55},${fy} L${a + rIn * .55},${fy} M${a},${fy - rIn * .6} L${a},${fy + rIn * .1}`;
  f += ` M${a + rIn * .72},${fy} A${rIn * .72},${rIn * .72} 0 0 0 ${a - rIn * .72},${fy}`;
  // springing divider
  d += ` M${a - r2 + 10 * s},${fy + 12 * s} L${a - 14 * s},${fy + 12 * s} M${a + 14 * s},${fy + 12 * s} L${a + r2 - 10 * s},${fy + 12 * s}`;
  const dots = `<path class="dot" d="M${a},${fy + 6 * s} l${6 * s},${6 * s} l${-6 * s},${6 * s} l${-6 * s},${-6 * s} Z"/>`;
  const qy = L.qDivY;
  const q = ` M${a - r2 + 26 * s},${qy} L${a - 10 * s},${qy} M${a + 10 * s},${qy} L${a + r2 - 26 * s},${qy}`;
  const dots2 = `<path class="dot" d="M${a},${qy - 4 * s} l${4 * s},${4 * s} l${-4 * s},${4 * s} l${-4 * s},${-4 * s} Z"/>`;
  const layer = (dd) => `<path class="hl" d="${dd}" stroke-width="${2.6 * s}" transform="translate(${.8 * s},${1 * s})"/>
<path class="gr" d="${dd}" stroke-width="${2.6 * s}"/>
<path class="gl" d="${dd}" stroke-width="${3 * s}" style="filter:url(#bloomD)"/>
<path class="in" d="${dd}" stroke-width="${1 * s}"/>`;
  const html = `<defs><filter id="bloomD" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="${2 * s}"/></filter></defs>
${layer(d)}<g class="fan">${layer(f)}<g class="qd">${layer(q)}${dots2}</g></g>${dots}`;
  for (const [id, x] of [['leafL', 0], ['leafR', -a]]) {
    const svg = document.querySelector(`#${id} svg`);
    svg.setAttribute('width', 2 * a); svg.setAttribute('height', dh); svg.style.left = x + 'px';
    svg.innerHTML = html;
  }
}

/* ---- keyboard */
addEventListener('keydown', (e) => {
  const tag = (e.target && e.target.tagName) || '';
  if ((tag === 'INPUT' || tag === 'SELECT') && e.key !== 'Escape') return;
  if (st.busy) return;
  const k = e.key;
  if (st.mode === 'main') {
    if (k === 'ArrowDown') setSel(st.sel + 1);
    else if (k === 'ArrowUp') setSel(st.sel - 1);
    else if (k === 'Home') setSel(0);
    else if (k === 'End') setSel(ITEMS.length - 1);
    else if (k === 'Enter' || k === ' ') activate(st.sel);
    else return;
  } else {
    if (k === 'ArrowDown') st.tab = (st.tab + 1) % PROFILES.length;
    else if (k === 'ArrowUp') st.tab = (st.tab + PROFILES.length - 1) % PROFILES.length;
    else if (k === 'ArrowRight') st.btn = (st.btn + 1) % BTNS.length;
    else if (k === 'ArrowLeft') st.btn = (st.btn + BTNS.length - 1) % BTNS.length;
    else if (k === 'Enter' || k === ' ') subAction();
    else if (k === 'Escape' || k === 'Backspace') back();
    else return;
    renderSub();
  }
  e.preventDefault();
});

  for (let y = 0, i = 0; y < mw.height; y++) for (let x = 0; x < mw.width; x++, i += 4) {

    snowHigh: snowCap(far, top + (horizon - 40 * s - top) * .4), snowLow: snowCap(far, top + (horizon - 40 * s - top) * .85),
    clouds: Array.from({ length: 30 }, (_, i) => ({ x: R() * W * 1.4 - W * .2, y: R() * (horizon - 140 * s) + 10 * s, w: (220 + R() * 380) * s, h: 0, k: Math.floor(R() * 6), v: .4 + R() * .8, o: R() })),
    sea: Array.from({ length: L.phone ? 14 : 30 }, () => ({ x: R() * W * 1.3 - W * .15, y: horizon - 62 * s + R() * 74 * s, w: (260 + R() * 420) * s, k: Math.floor(R() * 6), v: .15 + R() * .3 })),

/* ---- cloud / fog sprites, cached per colour */
const SPR = new Map();
const CLOUD_SHAPES = (() => {
  const R = rng(7); const out = [];
  for (let k = 0; k < 6; k++) {
    const puffs = []; const n = 26 + Math.floor(R() * 12);
    for (let i = 0; i < n; i++) {
      const t = R(); const hump = Math.sin(t * Math.PI);
      const r = (.05 + R() * .07) * (.6 + hump * .8);
      puffs.push([.16 + t * .68, .66 - hump * (.1 + R() * .22) + (R() - .5) * .06, r]);
    }
    out.push(puffs);
  }
  return out;
})();
// White puffs, then the colour as a vertical gradient (lit top, shadowed base) kept inside the alpha.
function cloudSprite(k, lit, shadow, flat) {
  const key = `${k}|${lit.map((v) => v >> 3)}|${shadow.map((v) => v >> 3)}|${flat ? 1 : 0}`;
  let c = SPR.get(key); if (c) return c;
  if (SPR.size > 160) SPR.clear();
  const w = 384, h = flat ? 110 : 192; c = mk(w, h); const g = c.getContext('2d');
  for (const [px, py, pr] of CLOUD_SHAPES[k]) {
    const x = px * w, y = py * h, r = pr * w;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, 'rgba(255,255,255,.62)'); gr.addColorStop(.55, 'rgba(255,255,255,.4)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.beginPath(); g.ellipse(x, y, r, r * (flat ? .42 : .82), 0, 0, 7); g.fill();
  }
  g.globalCompositeOperation = 'source-in';
  const lg = g.createLinearGradient(0, h * .2, 0, h * .85);
  lg.addColorStop(0, rgb(lit)); lg.addColorStop(.5, rgb(mix(lit, shadow, .45))); lg.addColorStop(1, rgb(shadow));
  g.fillStyle = lg; g.fillRect(0, 0, w, h);
  SPR.set(key, c); return c;
}
function fogSprite(col) {
  const key = 'fog' + col.map((v) => v >> 3);
  let c = SPR.get(key); if (c) return c;
  c = mk(256, 96); const g = c.getContext('2d');
  const gr = g.createRadialGradient(128, 48, 4, 128, 48, 128); gr.addColorStop(0, rgb(col, .55)); gr.addColorStop(.5, rgb(col, .22)); gr.addColorStop(1, rgb(col, 0));
  g.setTransform(1, 0, 0, .375, 0, 30); g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
  SPR.set(key, c); return c;
}
const RAIN_PAT = (() => {
  const c = mk(256, 256), g = c.getContext('2d'), R = rng(3);
  for (let i = 0; i < 150; i++) { const x = R() * 256, y = R() * 256, l = 10 + R() * 24; g.strokeStyle = `rgba(210,222,245,${.18 + R() * .35})`; g.lineWidth = .7 + R() * .7; g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + l); g.stroke(); if (y + l > 256) { g.beginPath(); g.moveTo(x, y - 256); g.lineTo(x, y + l - 256); g.stroke(); } }

/* ================================================================ state: time, light, weather */
const demo = { offset: 0, fast: false, weather: 'auto', moon: 'auto', dragging: false };
const WX = {
  clear: { cover: .05, rain: 0, snow: 0, storm: 0, fog: .08 },
  clouds: { cover: .6, rain: 0, snow: 0, storm: 0, fog: .15 },
  rain: { cover: .86, rain: .8, snow: 0, storm: 0, fog: .25 },
  storm: { cover: 1, rain: 1, snow: 0, storm: 1, fog: .2 },
  snow: { cover: .66, rain: 0, snow: .85, storm: 0, fog: .2 },
  blizzard: { cover: .9, rain: 0, snow: 1.25, storm: 0, fog: .45 },
  lightsnow: { cover: .35, rain: 0, snow: .45, storm: 0, fog: .12 },
  fog: { cover: .3, rain: 0, snow: 0, storm: 0, fog: 1 },

const AUTO = ['clear', 'clouds', 'rain', 'storm', 'clouds', 'fog'];
const AUTO_WINTER = ['lightsnow', 'snow', 'blizzard', 'snow'];
const wx = { cover: .1, rain: 0, snow: 0, storm: 0, fog: .1 };
let autoStart = performance.now();
function gameNow() { return Date.now() / 1000 - EPOCH + demo.offset; }
function lightAt(g) {
  const month = mod(Math.floor(g / MONTH_S), 12);
  const hf = mod(g, DAY_S) / 60;
  const dawn = DAWN[month], set = DUSK[month] + 1;
  let e, p;
  if (hf >= dawn && hf <= set) { p = (hf - dawn) / (set - dawn); e = Math.sin(Math.PI * p); }
  else {
    const nightLen = 24 - (set - dawn);
    const since = mod(hf - set, 24);
    p = since / nightLen;
    e = -Math.sin(Math.PI * p);
  }
  // soften around the horizon so twilight lingers a little
  const day = hf >= dawn && hf <= set;
  return { month, hf, e, p, day, dawn, set };
}
const SKYK = [
  // e, top, horizon, ambient
  [-1.0, '#02040a', '#091224', '#28334c'],
  [-.35, '#040916', '#11203c', '#2c3854'],
  [-.12, '#141a3c', '#4c3a62', '#3e3c5c'],
  [-.02, '#283463', '#c2675a', '#80606a'],
  [.08, '#3e66a6', '#f2a878', '#c69a86'],
  [.25, '#3d7bc9', '#bcd6ee', '#e0d9cf'],
  [1.0, '#2c6cc6', '#c3e1f6', '#f2efe8'],

function skyAt(e) {
  for (let i = 1; i < SKYK.length; i++) if (e <= SKYK[i][0]) { const [e0, a0, b0, c0] = SKYK[i - 1], [e1, a1, b1, c1] = SKYK[i]; const t = (e - e0) / (e1 - e0); return [mix(a0, a1, t), mix(b0, b1, t), mix(c0, c1, t)]; }
  const l = SKYK[SKYK.length - 1]; return [l[1], l[2], l[3]];
}

/* ================================================================ frame */
const sky = cSky.getContext('2d'), fx = cFx.getContext('2d'), stoneCtx = cStone.getContext('2d');
let stoneMonth = -1, lastT = performance.now(), T0 = performance.now();
const P = { amb: [0, 0, 0], dir: 0, dirCol: [255, 255, 255], lx: 0, flash: 0, fx: .5, flood: 0, ox: .5, oy: .55 };
let HOLD_BOLT = false;
let bolt = null, nextBolt = 3, shoot = null, nextShoot = 2, birds = null, nextBirds = 4;
let flakes = [], drops = [], leaves = [], flies = [], motes = [];
let currentInfo = null;

function frame(now) {
  raf = requestAnimationFrame(frame);
  const dt = clamp((now - lastT) / 1000, 0, .05); lastT = now;
  const t = (now - T0) / 1000;
  if (demo.fast) demo.offset += dt * 599;
  const g = gameNow();
  const Lt = lightAt(g);
  const month = Lt.month;
  if (month !== stoneMonth) { stoneMonth = month; buildStone(month); lit.key = ''; }

  // ---- weather
  let target;
  if (demo.weather !== 'auto') target = WX[demo.weather];
  else {
    const list = SNOW_MONTHS.has(month) ? AUTO_WINTER : AUTO;
    const idx = Math.floor((now - autoStart) / 26000) % list.length;
    target = WX[list[idx]];
  }
  if (SNOW_MONTHS.has(month) && demo.weather === 'auto') target = { ...target, rain: 0 };
  const rate = 1 - Math.exp(-dt * .35);
  for (const k in wx) wx[k] = lerp(wx[k], target[k], rate);

  // ---- moon
  let moon = moonAt(g);
  if (demo.moon !== 'auto') { const [lv, wax] = PHASE_LEVEL[demo.moon]; moon = { ...moon, level: lv, waxing: wax, phase: demo.moon }; if (!moon.up) moon = { ...moon, up: true, u: .3 }; }

  const moonAlt = moon.up ? Math.sin(Math.PI * moon.u) : 0;
  const moonLight = moon.up ? (moon.level / 12) * (.4 + .6 * moonAlt) * (1 - .55 * wx.cover) : 0;
  const glow = clamp(.12 + night * (.2 + .7 * moonLight) + (1 - night) * .05 * moon.level / 12 + FX.flood * .5);

  setVar('--door-glow', FX.doorGlow ? Math.min(1, (FX.dg = (FX.dg || 0) + dt * 2)) : (FX.dg = 0));

  // ---- light & colours
  let [skyTop, skyHor, amb] = skyAt(Lt.e);
  amb = mix(amb, [92, 108, 150], night * moonLight * .7);
  const ovc = mix([118, 126, 138], [14, 17, 24], night);
  const cover = wx.cover;
  skyTop = mix(skyTop, mul(ovc, .82), cover * .82);
  skyHor = mix(skyHor, ovc, cover * .7);
  amb = mul(mix(amb, mix(amb, [150, 156, 168], .5), cover * .6), 1 - cover * .28 - wx.storm * .1);

  let flash = 0;
  if (wx.storm > .4 && !REDUCED) {
    nextBolt -= dt;
    if (nextBolt <= 0 && !bolt) { bolt = makeBolt(); nextBolt = 2.5 + Math.random() * 6; }
  }
  if (bolt) {
    bolt.t += dt; if (HOLD_BOLT) bolt.t = Math.min(bolt.t, .04);

    flash = (k < .08 ? 1 : k < .16 ? .25 : k < .26 ? .85 : k < .5 ? .85 * Math.exp(-(k - .26) * 9) : 0) * bolt.power;

  }
  c.globalCompositeOperation = 'source-over';
  // falling leaves in autumn
  const autumn = E.month >= 8 && E.month <= 10;
  ensure(leaves, autumn && wx.snow < .3 ? (REDUCED ? 5 : 16) : 0, () => ({ x: -20 - Math.random() * W * .5, y: Math.random() * H * .7, r: Math.random() * 7, v: .6 + Math.random() * .8, c: Math.floor(Math.random() * 3) }));
  for (const l of leaves) {
    l.x += (40 + wx.storm * 120 + wx.rain * 30) * l.v * dt * s; l.y += (22 + Math.sin(t * 2 + l.r) * 20) * dt * s; l.r += dt * 3 * l.v;
    if (l.x > W + 30 || l.y > H + 20) { l.x = -20; l.y = Math.random() * H * .6; }
    c.save(); c.translate(l.x, l.y); c.rotate(l.r); c.scale(1, Math.sin(l.r * 1.7));
    c.fillStyle = rgb(mul([[196, 98, 34], [214, 156, 48], [150, 60, 30]][l.c], Math.min(1, E.amb[1] / 200 + .15)));
    c.beginPath(); c.ellipse(0, 0, 6 * s, 3 * s, 0, 0, 7); c.fill(); c.restore();
  }
  // near rain: two pattern layers
  if (wx.rain > .02) {
    const slant = .16 + wx.storm * .14;
    c.save();
    c.transform(1, 0, -slant, 1, 0, 0);
    for (const [sc, sp, al] of [[1, 900, .5], [1.9, 1500, .55]]) {
      const pat = c.createPattern(RAIN_PAT, 'repeat');
      const off = (t * sp * s) % (256 * sc);
      pat.setTransform(new DOMMatrix().scale(sc, sc * 1.5).translate(0, off / sc));
      c.fillStyle = pat; c.globalAlpha = wx.rain * al * (REDUCED ? .5 : 1) * clamp(E.amb[1] / 160 + .35);
      c.fillRect(-200, 0, W + H * slant + 400, H);
    }
    c.restore(); c.globalAlpha = 1;
    // splashes on the ledge
    ensure(drops, Math.round(40 * wx.rain), () => ({ x: Math.random() * W, y: yg + Math.random() * (H - yg), t: Math.random() }));
    c.strokeStyle = rgb(mix(E.amb, [255, 255, 255], .5), .5);
    c.lineWidth = 1;
    for (const d of drops) { d.t += dt * 3; if (d.t > 1) { d.t = 0; d.x = Math.random() * W; d.y = yg + 6 * s + Math.random() * (H - yg); } const r = d.t * 6 * s; c.globalAlpha = (1 - d.t) * .7 * wx.rain; c.beginPath(); c.ellipse(d.x, d.y, r, r * .3, 0, Math.PI, 0); c.stroke(); }
    c.globalAlpha = 1;
  }
  // near snow
  if (wx.snow > .02) { drawFlakes(c, dt, 1, wx.snow, E.amb); c.globalAlpha = 1; }
  // ground fog curling along the base
  const fogAmt = .3 + wx.fog * .9;
  const fcol = mix(mix(E.amb, E.skyHor, .3), [255, 255, 255], .08);
  const fs = fogSprite(fcol);
  const n = L.phone ? 9 : 16;
  for (let i = 0; i < n; i++) {
    const w = (L.phone ? 260 : 520) * s * (1 + (i % 3) * .3);
    const span = W + w;
    const x = mod(i * span / n + t * (8 + (i % 4) * 5) * s * (i % 2 ? 1 : -.7), span) - w * .7;
    const y = yg - (20 + (i % 5) * 9 + wx.fog * 70) * s + Math.sin(t * .3 + i) * 8 * s;
    c.globalAlpha = fogAmt * (.55 + .45 * Math.sin(t * .2 + i * 2.1));
    c.drawImage(fs, x, y, w, w * .3);
  }
  // heavy fog veil over the whole scene
  if (wx.fog > .3) { c.globalAlpha = (wx.fog - .3) * .45; c.fillStyle = rgb(fcol); c.fillRect(0, 0, W, H); }
  c.globalAlpha = 1;
}

/* ================================================================ boot, resize, demo panel */
let raf = 0;
function rebuild() {
  const W = innerWidth, H = innerHeight;
  L = layout(W, H);
  for (const cv of [cSky, cFx]) sizeCanvas(cv, W, H, DPR);
  sizeCanvas(cStone, W, H, DPR_STONE);
  FIELDS = buildFields(W, H, L.s);
  buildSkyAssets();
  placeDOM();
  buildArchSVG();
  stoneMonth = -1; lit.key = '';
  flakes = []; farFlakes.length = 0; motes = []; flies = []; leaves = []; drops = [];
}
let rsT = 0;
addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(rebuild, 180); });
document.addEventListener('visibilitychange', () => { if (document.hidden) { cancelAnimationFrame(raf); raf = 0; } else if (!raf) { lastT = performance.now(); raf = requestAnimationFrame(frame); } });

// favicon + previews
{
  const u = svgURL(faviconSVG(64));
  document.getElementById('favicon').href = u;
  for (const id of ['fv16', 'fv24', 'fv32', 'fv64', 'fvTog']) document.getElementById(id).src = u;
  const wo = document.querySelector('#whiteout'); wo.insertAdjacentHTML('afterbegin', faviconSVG(64).replace('<svg ', '<svg style="width:64px;height:64px" '));
}
// noise texture for the tablets
{
  const c = mk(160, 160), g = c.getContext('2d'), im = g.createImageData(160, 160);
  for (let y = 0, i = 0; y < 160; y++) for (let x = 0; x < 160; x++, i += 4) { const n = fbm(x / 14, y / 14, 3, 4) * .7 + hash2(x, y, 3) * .3; const light = n > .5; im.data[i] = im.data[i + 1] = im.data[i + 2] = light ? 255 : 0; im.data[i + 3] = Math.abs(n - .5) * 2 * 46; }
  g.putImageData(im, 0, 0);
  document.documentElement.style.setProperty('--noise', `url(${c.toDataURL()})`);
}
// demo panel
{
  const D = document.getElementById('demo');
  document.getElementById('dTog').addEventListener('click', () => D.classList.toggle('openp'));
  const mSel = document.getElementById('dMonth'); MONTHS.forEach((m, i) => mSel.add(new Option(`${m}${SNOW_MONTHS.has(i) ? ' ❄' : ''}`, i)));
  const moonSel = document.getElementById('dMoon'); PHASES.forEach((p) => moonSel.add(new Option(p, p)));
  const tIn = document.getElementById('dTime');
  tIn.addEventListener('pointerdown', () => (demo.dragging = true));
  addEventListener('pointerup', () => (demo.dragging = false));
  tIn.addEventListener('input', () => { const g = gameNow(); const target = g - mod(g, DAY_S) + parseFloat(tIn.value) * 60; demo.offset += target - g; });
  mSel.addEventListener('change', () => { const g = gameNow(); const cur = mod(Math.floor(g / MONTH_S), 12); demo.offset += (parseInt(mSel.value) - cur) * MONTH_S; });
  document.getElementById('dWeather').addEventListener('change', (e) => { demo.weather = e.target.value; autoStart = performance.now(); });
  moonSel.addEventListener('change', (e) => (demo.moon = e.target.value));
  document.getElementById('dFast').addEventListener('change', (e) => (demo.fast = e.target.checked));
  document.getElementById('dReal').addEventListener('click', () => { demo.offset = 0; demo.fast = false; document.getElementById('dFast').checked = false; });
  // URL hooks for screenshots: ?h=22&m=5&w=storm&moon=full&demo=1&sub=1
  const q = new URLSearchParams(location.search);
  const g0 = gameNow();
  if (q.has('m')) { const cur = mod(Math.floor(g0 / MONTH_S), 12); demo.offset += (parseInt(q.get('m')) - cur) * MONTH_S; }
  if (q.has('h')) { const g = gameNow(); demo.offset += g - mod(g, DAY_S) + parseFloat(q.get('h')) * 60 - g; }
  if (q.has('w')) { demo.weather = q.get('w'); document.getElementById('dWeather').value = demo.weather; for (const k in wx) wx[k] = WX[demo.weather][k]; }
  if (q.has('moon')) { demo.moon = q.get('moon'); moonSel.value = demo.moon; }
  if (q.has('demo')) D.classList.add('openp');
  if (q.has('sel')) setSel(parseInt(q.get('sel')));
  if (q.has('sub')) setTimeout(() => activate(1), 50);
  if (q.has('bolt')) { nextBolt = parseFloat(q.get('bolt')); HOLD_BOLT = q.has('hold'); }
}
rebuild();
requestAnimationFrame(() => { scene.classList.remove('boot'); });
raf = requestAnimationFrame(frame);
</script>
