<!doctype html>
<!--
  01 "Lyktans väg" — The Lantern Road
  Idea: a cinematic title screen. A forged MUME wordmark with molten light running
  through its strokes hangs over layered mountain ranges (6 parallax planes, valley mist)
  lit by MUME's real sun and moon. A road of lanterns winds up to a lit inn on the ridge;
  the menu is a Lykta-pane lantern, and choosing "Enter MUME" kindles the road lantern by
  lantern up to the inn. Weather, stars, lightning, birds, fireflies, leaves cycle freely.
  Cost to build for real: medium-high. One Canvas 2D scene module (~1200 lines: ridge
  generator, cached layer renderer with rim light, sky/weather/particle systems), the
  wordmark renderer (~150), and a Preact start page + sub-page frame in the Lykta CSS
  (~400). The game-time model already exists (clock.ts, gametime.ts). Main risks:
  battery/GPU on low-end phones (needs a quality tier) and the first-paint banner.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MUME Cockpit</title>
<link rel="icon" id="favicon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cormorant+Garamond:ital,wght@1,400;1,500&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --lamp: #ffcf8f; --lamp-hot: #ffe8c2; --ember: #ff7a1a;
  --iron: #2a2622; --iron-hi: #5d544a; --iron-lo: #110f0e;
  --text: #eadcc3; --dim: #9a8b76; --faint: #6d6252;
  --display: 'Cinzel', 'Times New Roman', serif;
  --serif: 'Cormorant Garamond', Georgia, serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
  --grain: none;
  --ly: 60px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #020306; color: var(--text); overflow: hidden; }
body { font-family: var(--serif); -webkit-font-smoothing: antialiased; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block;
  transform-origin: var(--ox, 80%) var(--oy, 70%); transition: transform 1.6s cubic-bezier(.6,0,.25,1), filter 1.6s;
  opacity: 0; animation: fadein 2.2s .1s ease-out forwards; }
body.journey #scene { transform: scale(1.22); filter: brightness(1.1); }
@keyframes fadein { to { opacity: 1; } }
.vignette { position: fixed; inset: 0; pointer-events: none;
  background: radial-gradient(130% 95% at 50% 42%, transparent 52%, rgba(0,0,0,.6) 100%),
              linear-gradient(180deg, rgba(0,0,0,.25), transparent 18%); }
.grain { position: fixed; inset: -60px; pointer-events: none; background-image: var(--grain); opacity: .07;
  mix-blend-mode: overlay; animation: grain 1s steps(5) infinite; }
@keyframes grain { 0%{transform:translate(0,0)} 20%{transform:translate(-23px,11px)} 40%{transform:translate(17px,-29px)} 60%{transform:translate(-9px,31px)} 80%{transform:translate(29px,7px)} }

/* ---------------------------------------------------------------- layout */
#stage { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
  padding: clamp(18px, 5.2vh, 70px) 16px 0; pointer-events: none; transition: opacity 1s; }
#stage > * { pointer-events: auto; }
body.journey #stage { opacity: 0; }

#brand { display: flex; flex-direction: column; align-items: center; transform-origin: 50% 0;
  transition: transform .8s cubic-bezier(.3,.9,.25,1); opacity: 0; animation: appear 1.6s .5s ease-out forwards; }
@keyframes appear { to { opacity: 1; } }
body.sub #brand { transform: scale(.62) translateY(-14px); }
#wordmark { display: block; width: clamp(290px, 40vw, 660px); }
.cockpit { display: flex; align-items: center; gap: .9em; margin-top: calc(clamp(290px, 40vw, 660px) * -.035);
  font: 600 clamp(11px, 1.05vw, 16px)/1 var(--display); letter-spacing: .95em; padding-left: .95em; color: #f0dcb8;
  text-shadow: 0 0 10px rgba(255,150,60,.55), 0 1px 2px #000, 0 0 18px rgba(0,0,0,.9); }
.cockpit .rule { width: clamp(36px, 6vw, 110px); height: 3px; position: relative;
  background: linear-gradient(90deg, transparent, #4d433a 30%, #6b5d50); border-radius: 2px; box-shadow: 0 1px 0 #000; }
.cockpit .rule.r { transform: scaleX(-1); }
.cockpit .rule::after { content: ""; position: absolute; right: -3px; top: -2px; width: 7px; height: 7px; border-radius: 50%;
  background: radial-gradient(circle at 45% 40%, #ffe3b0, #ff8a2a 45%, #6b2a08 75%); box-shadow: 0 0 8px #ff8a2a; }

@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* ---------------------------------------------------------------- the lantern panel (Lykta family) */
.lp { position: relative; padding: 7px; border-radius: 5px; border: 1px solid #000;
  background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,0) 30%, rgba(0,0,0,.22)), var(--grain), var(--iron);
  background-size: auto, 160px 160px, auto;
  box-shadow: inset 1px 1px 0 rgba(130,116,100,.55), inset -1px -1px 0 var(--iron-lo),
              0 0 50px -6px rgba(255,170,90,.30), 0 30px 80px -12px rgba(0,0,0,.85); }
.lp .br { position: absolute; width: 24px; height: 24px; z-index: 4;
  background: radial-gradient(circle at 3.5px 3.5px, #fff1d6 0 1px, #ffb35c 1.3px, #1a1412 1.9px 2.6px, transparent 3.1px) 0 0 / 7px 7px no-repeat,
              radial-gradient(circle at 3.5px 3.5px, #1a1412 0 1.2px, transparent 1.8px) 17px 0 / 7px 7px no-repeat,
              radial-gradient(circle at 3.5px 3.5px, #1a1412 0 1.2px, transparent 1.8px) 0 17px / 7px 7px no-repeat,
              linear-gradient(135deg, #6f655a, var(--iron) 75%);
  clip-path: polygon(0 0, 100% 0, 100% 7px, 7px 7px, 7px 100%, 0 100%);
  box-shadow: inset 1px 1px 0 rgba(255,255,255,.2); }
.lp .b1 { top: -1px; left: -1px; } .lp .b2 { top: -1px; right: -1px; transform: scaleX(-1); }
.lp .b3 { bottom: -1px; left: -1px; transform: scaleY(-1); } .lp .b4 { bottom: -1px; right: -1px; transform: scale(-1,-1); }
.lp .hood { position: absolute; z-index: 5; top: -1px; left: 50%; transform: translateX(-50%); height: 27px; padding: 0 26px;
  display: flex; align-items: center; gap: 8px; border-radius: 0 0 13px 13px; white-space: nowrap;
  background: linear-gradient(180deg, rgba(255,255,255,.09), rgba(0,0,0,.18)), var(--grain), var(--iron); background-size: auto, 160px 160px, auto;
  box-shadow: inset 0 -1px 0 var(--iron-hi), 0 0 0 1px #000, 0 3px 10px rgba(0,0,0,.6); }
.lp .hood::before, .lp .hood::after { content: ""; position: absolute; top: 10px; width: 5px; height: 5px; border-radius: 50%;
  background: #1a1513; box-shadow: inset 0 1px 0 rgba(0,0,0,.7), 0 1px 0 var(--iron-hi); }
.lp .hood::before { left: 9px; } .lp .hood::after { right: 9px; }
.lp .hood .t { font: 700 14px/1 var(--display); letter-spacing: .14em; padding-top: 2px; color: #ffe6bf;
  text-shadow: 0 0 5px rgba(255,200,120,.9), 0 0 14px rgba(255,150,60,.5); }
.lp .hood svg { width: 20px; height: 20px; filter: drop-shadow(0 0 4px rgba(255,160,60,.8)); }
.lp .win { position: relative; border: 1px solid #000; border-radius: 2px; padding: 34px 14px 12px; overflow: hidden;
  background:
    radial-gradient(55% 70px at 50% 0, rgba(255,207,143,.17), transparent),
    radial-gradient(85% 120px at 50% var(--ly), rgba(255,190,110,.22), rgba(255,190,110,.05) 60%, transparent 100%),
    radial-gradient(130% 90% at 50% 30%, rgba(255,207,143,.10), rgba(255,207,143,.03) 60%, transparent 90%),
    rgba(14,11,9,.58);
  -webkit-backdrop-filter: blur(9px) saturate(1.1); backdrop-filter: blur(9px) saturate(1.1);
  box-shadow: inset 0 0 0 1px rgba(255,207,143,.10), inset 0 0 40px rgba(0,0,0,.65);
  transition: --ly .4s; }

/* ---------------------------------------------------------------- main menu */
#menuPanel { width: min(384px, calc(100vw - 32px)); margin-top: clamp(14px, 2.6vh, 30px);
  opacity: 0; animation: rise 1.4s .9s cubic-bezier(.2,.8,.2,1) forwards;
  transition: opacity .45s, transform .55s cubic-bezier(.3,.9,.25,1), filter .45s; }
body.sub #menuPanel { opacity: 0 !important; transform: scale(.94) translateY(20px); filter: blur(6px); pointer-events: none; animation: none; }
.menu { list-style: none; margin: 0; padding: 0; position: relative; z-index: 1; }
.item { position: relative; z-index: 2; display: flex; align-items: center; gap: 14px; height: 42px; padding: 0 18px;
  font: 600 15.5px/1 var(--display); letter-spacing: .17em; color: #b6a68c; cursor: pointer; user-select: none;
  transition: color .35s, letter-spacing .45s cubic-bezier(.2,.9,.2,1), text-shadow .35s; }
.item .ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; opacity: .7; transition: opacity .3s, filter .3s; }
.item.on { color: #fff1da; letter-spacing: .21em; text-shadow: 0 0 8px rgba(255,190,110,.8), 0 0 24px rgba(255,140,50,.35); }
.item.on .ic { opacity: 1; filter: drop-shadow(0 0 4px rgba(255,170,80,.9)); }
.item .key { margin-left: auto; font: 400 10px/1 var(--mono); letter-spacing: 0; color: var(--faint); opacity: 0; transition: opacity .3s; }
.item.on .key { opacity: .9; }
.item.prime { height: 74px; gap: 16px; font-size: 21px; font-weight: 700; letter-spacing: .1em; color: #dcc59c; }
.item.prime.on { letter-spacing: .13em; color: #fff3df; }
.item.prime .lbl { display: flex; flex-direction: column; gap: 7px; }
.item.prime small { font: 400 11.5px/1 var(--mono); letter-spacing: .02em; color: var(--dim); text-shadow: none; }
.item.prime.on small { color: #c9a77a; }
.sep { height: 13px; margin: 2px 8px 4px; position: relative; }
.sep::before { content: ""; position: absolute; left: 0; right: 0; top: 6px; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,200,130,.28) 30%, rgba(255,200,130,.28) 70%, transparent); }
.sep::after { content: ""; position: absolute; left: 50%; top: 3px; width: 7px; height: 7px; margin-left: -3.5px; transform: rotate(45deg);
  background: linear-gradient(135deg, #7a6a58, #2a2420); box-shadow: 0 0 0 1px #000, 0 0 8px rgba(255,160,70,.4); }

/* the warm light that is the selection */
.sel, .trail { position: absolute; left: 0; right: 0; top: 0; height: 42px; border-radius: 5px; pointer-events: none; }
.sel { z-index: 1; transition: transform .46s cubic-bezier(.2,.95,.2,1), height .46s cubic-bezier(.2,.95,.2,1);
  background: linear-gradient(180deg, rgba(255,205,140,.17), rgba(255,190,120,.05)),
              radial-gradient(60% 140% at 12% 50%, rgba(255,170,80,.20), transparent 70%);
  box-shadow: inset 0 1px 0 rgba(255,220,170,.38), inset 0 0 0 1px rgba(255,200,130,.13), 0 2px 8px rgba(0,0,0,.55); overflow: hidden; }
.sel::after { content: ""; position: absolute; inset: 0;
  background: linear-gradient(100deg, transparent 35%, rgba(255,236,200,.42) 50%, transparent 65%) no-repeat;
  background-size: 260% 100%; background-position: 160% 0; opacity: 0; }
.sel.sweep::after { animation: sweep .95s cubic-bezier(.25,.7,.3,1); }
@keyframes sweep { 0% { background-position: 160% 0; opacity: 1; } 100% { background-position: -60% 0; opacity: .0; } }
.trail { z-index: 0; transition: transform .95s cubic-bezier(.2,.8,.2,1), height .95s; filter: blur(14px);
  background: radial-gradient(70% 70% at 30% 50%, rgba(255,150,60,.35), transparent 75%); }

/* the kindling lantern on Enter MUME */
.klant { width: 40px; height: 48px; flex: none; overflow: visible; --lit: 0; }
.klant .halo { opacity: calc(var(--lit) * .95); transition: opacity .6s; }
.klant .glass-lit { opacity: var(--lit); transition: opacity .7s cubic-bezier(.3,0,.2,1); }
.klant .flame { transform-origin: 20px 33px; transform: scale(calc(.15 + var(--lit) * .85)); opacity: calc(.25 + var(--lit) * .75);
  transition: transform .7s cubic-bezier(.3,1.6,.4,1), opacity .5s; }
.klant .flick { transform-origin: 20px 33px; animation: flick 1.7s infinite ease-in-out; }
@keyframes flick { 0%,100%{transform:scale(1,1) skewX(0)} 22%{transform:scale(.94,1.06) skewX(2deg)} 45%{transform:scale(1.04,.95) skewX(-1.5deg)} 70%{transform:scale(.97,1.04) skewX(1deg)} }
.item.prime.on .klant { --lit: 1; }

.foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 8px 4px 0; min-height: 18px;
  font: 400 10.5px/1 var(--mono); color: var(--faint); }
.foot kbd { font: inherit; color: var(--dim); }
.flash { font: italic 500 15px/1 var(--serif); color: #ffb870; text-shadow: 0 0 10px rgba(255,140,50,.6); opacity: 0; transition: opacity .3s; white-space: nowrap; }
.flash.show { opacity: 1; }

/* ---------------------------------------------------------------- quote */
#quote { margin: clamp(8px, 2vh, 24px) 0 0; max-width: 620px; padding: 10px 30px 14px; background: radial-gradient(closest-side, rgba(4,3,2,.55), rgba(4,3,2,.25) 60%, transparent); text-align: center; opacity: 0; animation: rise 1.6s 1.3s ease-out forwards; transition: opacity .5s; }
body.sub #quote { opacity: 0 !important; animation: none; }
#quote p { margin: 0; font: italic 400 clamp(17px, 1.45vw, 22px)/1.35 var(--serif); color: rgba(244,232,210,.92);
  text-shadow: 0 1px 2px #000, 0 0 16px rgba(0,0,0,.95), 0 0 30px rgba(0,0,0,.6); }
#quote cite { display: block; margin-top: 8px; font: 600 10.5px/1 var(--display); letter-spacing: .3em; font-style: normal; color: #b49a75;
  text-shadow: 0 1px 2px #000, 0 0 12px #000; }

/* ---------------------------------------------------------------- profile sub-page */
#profilePanel { position: fixed; left: 50%; top: clamp(150px, 26vh, 270px); width: min(820px, calc(100vw - 32px));
  transform: translate(-50%, 24px) scale(.96); opacity: 0; pointer-events: none; filter: blur(4px);
  transition: opacity .5s .12s, transform .6s .12s cubic-bezier(.2,.9,.2,1), filter .5s .12s; }
body.sub #profilePanel { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; filter: none; }
#profilePanel .win { padding: 40px 22px 14px; }
.ph, .prow { display: grid; grid-template-columns: 34px 1.1fr 1.5fr 1.3fr 1fr; align-items: center; gap: 12px; padding: 0 14px; }
.ph { font: 600 10.5px/1 var(--display); letter-spacing: .24em; color: var(--dim); margin-bottom: 8px; }
.ph span:first-child { grid-column: 2; }
.plist { position: relative; display: flex; flex-direction: column; gap: 7px; }
.prow { position: relative; height: 58px; border-radius: 5px; cursor: pointer; color: #c8b89d;
  background: linear-gradient(180deg, rgba(255,207,143,.07), rgba(255,207,143,.025));
  box-shadow: inset 0 1px 0 rgba(255,207,143,.16), inset 0 0 0 1px rgba(255,207,143,.05), 0 1px 3px rgba(0,0,0,.5);
  transition: background .35s, box-shadow .35s, color .3s; }
.prow.on { color: #fff1da; background: linear-gradient(180deg, rgba(255,205,140,.20), rgba(255,190,120,.07)), radial-gradient(50% 160% at 4% 50%, rgba(255,170,80,.28), transparent 70%);
  box-shadow: inset 0 1px 0 rgba(255,225,175,.45), inset 0 0 0 1px rgba(255,200,130,.22), 0 2px 10px rgba(0,0,0,.6), 0 0 26px -6px rgba(255,150,60,.45); }
.prow.on::after { content: ""; position: absolute; inset: 0; border-radius: 5px; pointer-events: none;
  background: linear-gradient(100deg, transparent 35%, rgba(255,236,200,.3) 50%, transparent 65%) no-repeat; background-size: 260% 100%; background-position: -60% 0;
  animation: sweep .95s cubic-bezier(.25,.7,.3,1); }
.prow .pl { width: 26px; height: 32px; justify-self: center; --lit: 0; }
.prow.on .pl { --lit: 1; }
.prow .pn { font: 700 17px/1.1 var(--display); letter-spacing: .08em; }
.prow.on .pn { text-shadow: 0 0 8px rgba(255,190,110,.7); }
.prow .pn small { display: block; margin-top: 5px; font: 600 9.5px/1 var(--display); letter-spacing: .2em; color: #d99a50; }
.prow .pc { font: italic 500 16px/1.2 var(--serif); color: inherit; opacity: .9; }
.prow .pc b { font-style: normal; font-weight: 500; font-family: var(--display); font-size: 13.5px; letter-spacing: .06em; }
.prow .ps, .prow .pt { font: 400 12px/1.3 var(--mono); color: var(--dim); }
.prow.on .ps, .prow.on .pt { color: #c9ad86; }
.pbtns { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 18px 0 6px; }
.ibtn { position: relative; display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 18px 0 14px; border: 1px solid #000; border-radius: 4px; cursor: pointer;
  font: 700 12px/1 var(--display); letter-spacing: .16em; color: #d8c29c;
  background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(0,0,0,.2)), var(--grain), var(--iron); background-size: auto, 160px 160px, auto;
  box-shadow: inset 0 1px 0 rgba(140,124,106,.55), inset 0 -1px 0 var(--iron-lo), 0 2px 6px rgba(0,0,0,.55);
  transition: color .25s, text-shadow .25s, box-shadow .25s, transform .12s; }
.ibtn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.ibtn:hover, .ibtn:focus-visible { outline: none; color: #fff1da; text-shadow: 0 0 7px rgba(255,190,110,.9);
  box-shadow: inset 0 1px 0 rgba(255,220,170,.5), inset 0 -1px 0 var(--iron-lo), 0 0 18px -2px rgba(255,150,60,.55), 0 2px 6px rgba(0,0,0,.55); }
.ibtn:active { transform: translateY(1px); }
.ibtn.danger { color: #e3a08a; } .ibtn.danger:hover { color: #ffd2c2; text-shadow: 0 0 7px rgba(255,90,60,.9); box-shadow: inset 0 1px 0 rgba(255,170,150,.5), 0 0 18px -2px rgba(255,70,40,.55), 0 2px 6px rgba(0,0,0,.55); }
.back { position: absolute; left: 12px; top: 6px; z-index: 6; font: 600 10.5px/1 var(--display); letter-spacing: .2em; color: var(--dim); cursor: pointer; padding: 6px; background: none; border: 0; }
.back:hover { color: #ffe1b5; text-shadow: 0 0 8px rgba(255,170,80,.8); }

/* ---------------------------------------------------------------- corners: almanac + demo */
#almanac { position: fixed; right: 0; bottom: 0; padding: 26px 16px 12px 60px; text-align: right; background: radial-gradient(farthest-side at 100% 100%, rgba(4,3,2,.78), rgba(4,3,2,.45) 60%, transparent); pointer-events: none; opacity: 0; animation: rise 1.4s 1.6s forwards;
  text-shadow: 0 1px 2px #000, 0 0 10px #000; }
#almanac .d { font: 600 11px/1.5 var(--display); letter-spacing: .16em; color: #c4ad88; }
#almanac .m { font: 400 10.5px/1.6 var(--mono); color: var(--dim); }
#almanac .v { display: inline-flex; align-items: center; gap: 6px; font: 400 10.5px/1.6 var(--mono); color: var(--faint); }
#almanac .v svg { width: 16px; height: 16px; }

#demo { position: fixed; left: 12px; bottom: 12px; z-index: 20; font: 400 11px/1.4 var(--mono); color: #b8ab98; }
#demo > button { font: 600 10.5px/1 var(--mono); letter-spacing: .08em; color: #a8987f; background: rgba(12,10,9,.72); border: 1px solid #3a332c;
  border-radius: 4px; padding: 6px 10px; cursor: pointer; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
#demo > button:hover { color: #ffdcab; border-color: #6b5a48; }
#demo .body { display: none; margin-bottom: 6px; width: 268px; padding: 10px 12px; background: rgba(12,10,9,.86); border: 1px solid #3a332c; border-radius: 5px;
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); box-shadow: 0 10px 30px rgba(0,0,0,.6); }
#demo.open .body { display: block; }
#demo label { display: grid; grid-template-columns: 62px 1fr 44px; align-items: center; gap: 6px; margin: 5px 0; }
#demo select, #demo input[type=range] { width: 100%; font: inherit; color: #e0d2bc; background: #1c1916; border: 1px solid #3a332c; border-radius: 3px; padding: 2px; accent-color: #e08a3a; }
#demo .row { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
#demo .row button { font: inherit; color: #e0d2bc; background: #1c1916; border: 1px solid #3a332c; border-radius: 3px; padding: 3px 8px; cursor: pointer; }
#demo .ro { margin-top: 8px; padding-top: 6px; border-top: 1px solid #2c2722; color: #8e8170; white-space: pre-line; }
#demo .marks { display: flex; align-items: flex-end; gap: 10px; margin-top: 8px; padding-top: 8px; border-top: 1px solid #2c2722; }
#demo .marks span { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 9px; color: #6d6252; }

#toast { position: fixed; left: 50%; top: 46%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; opacity: 0; transition: opacity .8s;
  font: italic 500 24px/1.4 var(--serif); color: #ffe7c4; text-shadow: 0 0 14px rgba(255,140,50,.7), 0 1px 3px #000; }
#toast small { display: block; margin-top: 6px; font: 400 12px/1.6 var(--mono); font-style: normal; color: #ffe2b8; text-shadow: 0 1px 2px #000, 0 0 12px #000, 0 0 24px rgba(0,0,0,.8); }
#toast.show { opacity: 1; }

@media (max-width: 600px) {
  #stage { padding-top: 26px; }
  .item { height: 37px; font-size: 14.5px; }
  .item.prime { height: 62px; font-size: 19px; }
  #menuPanel .win { padding-top: 30px; }
  .item .key { display: none; }
  #quote { max-width: 340px; }
  #almanac { padding: 20px 12px 10px 40px; }
  #almanac .m { display: none; }
  #profilePanel { top: 112px; }
  #profilePanel .win { padding: 38px 10px 10px; }
  .ph { display: none; }
  .prow { grid-template-columns: 30px 1fr auto; grid-template-rows: auto auto; height: auto; padding: 10px 12px; row-gap: 5px; column-gap: 10px; }
  .prow .pl { grid-row: 1 / span 2; }
  .prow .pn { grid-column: 2; }
  .prow .pc { grid-column: 2; font-size: 14.5px; }
  .prow .ps { display: none; }

<script>
(() => {
'use strict';
const $ = (s) => document.querySelector(s);
const qs = new URLSearchParams(location.search);
const RM = qs.has('rm') || matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const mod = (a, n) => ((a % n) + n) % n;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

const mix = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const mul = (c, k) => [c[0] * k, c[1] * k, c[2] * k];

function ramp(stops, x) { // stops: [[x, colorArr], ...] ascending
  if (x <= stops[0][0]) return stops[0][1];
  for (let i = 1; i < stops.length; i++) if (x <= stops[i][0]) { const [x0, c0] = stops[i - 1], [x1, c1] = stops[i]; return mix(c0, c1, (x - x0) / (x1 - x0)); }
  return stops[stops.length - 1][1];
}

/* ===================================================================== game time (offline) */
const YEAR = 518400, MONTH = 43200, DAY = 1440;
const DAWN = [8, 9, 8, 7, 7, 6, 5, 4, 5, 6, 7, 7], DUSK = [18, 17, 18, 19, 20, 20, 21, 22, 21, 20, 20, 19];
const MONTHS = ['Afteryule', 'Solmath', 'Rethe', 'Astron', 'Thrimidge', 'Forelithe', 'Afterlithe', 'Wedmath', 'Halimath', 'Winterfilth', 'Blotmath', 'Foreyule'];
const WEEKDAYS = ['Sterday', 'Sunday', 'Monday', 'Trewsday', 'Hevensday', 'Mersday', 'Highday'];
const SEED_EPOCH = 1696118400 - 2850 * YEAR;

const PHASES = ['new', 'waxing crescent', 'first quarter', 'waxing gibbous', 'full', 'waning gibbous', 'third quarter', 'waning crescent'];

  try { const s = JSON.parse(localStorage.getItem('wc.clock') || 'null'); if (s && typeof s.epoch === 'number' && isFinite(s.epoch)) return s.epoch; } catch (e) { /* none */ }

}
function moonModel(g) {
  const zc = Math.floor(((g - MOON_ORIGIN) * DAY) / MOON_CYCLE), z = mod(zc, DAY);
  const level = Math.abs(12 - Math.floor((z + 30) / 60)), waxing = z >= 720, i = Math.min(4, Math.floor(level / 3));

  return { level, waxing, phase, up: ha < 720, frac: ha / 720 };
}
const clk = { epoch: savedEpoch(), g0: 0, r0: 0, speed: 1, phase: 'auto', weather: 'auto' };
const realG = () => Date.now() / 1000 - clk.epoch;
function rebase(g) { clk.g0 = g; clk.r0 = performance.now() / 1000; }
const gameG = () => clk.g0 + (performance.now() / 1000 - clk.r0) * clk.speed;
rebase(realG());
function setHour(h) { const g = gameG(); rebase(Math.floor(g / DAY) * DAY + h * 60); }

if (qs.has('m')) setMonth(+qs.get('m'));
if (qs.has('t')) setHour(+qs.get('t'));
if (qs.has('w')) clk.weather = qs.get('w');
if (qs.has('p')) clk.phase = qs.get('p');
if (qs.has('fast')) clk.speed = 600;

/* ===================================================================== environment (light, sky) */
const SKY = [
  [-1.0, ['#020309', '#050816', '#0a1022']],
  [-0.5, ['#03050f', '#0a0f24', '#1a1c36']],
  [-0.2, ['#0b1130', '#2a2650', '#6b3a4a']],
  [-0.04, ['#1b2550', '#5a3e66', '#e0703c']],
  [0.06, ['#2b4579', '#8f6a83', '#ffaa5a']],
  [0.2, ['#3a64a0', '#8fa4c4', '#ffd2a0']],
  [0.42, ['#3a70b6', '#7eaad6', '#d6e4ec']],
  [1.0, ['#2a62ae', '#6a9fd6', '#bfd8ec']],

const skyAt = (e) => { const out = []; for (let k = 0; k < 3; k++) out.push(ramp(SKY.map(([x, cs]) => [x, cs[k]]), e)); return out; };

const WTARGET = {
  clear: { cloud: .06, rain: 0, snow: 0, storm: 0, fog: .08 },
  clouds: { cloud: .7, rain: 0, snow: 0, storm: 0, fog: .2 },
  rain: { cloud: .92, rain: .85, snow: 0, storm: 0, fog: .35 },
  storm: { cloud: 1, rain: 1, snow: 0, storm: 1, fog: .25 },
  snow: { cloud: .72, rain: 0, snow: 1, storm: 0, fog: .16 },
  fog: { cloud: .3, rain: 0, snow: 0, storm: 0, fog: 1 },

const AUTO = ['clear', 'clouds', 'rain', 'storm', 'clear', 'fog', 'clouds'];
const AUTO_WINTER = ['snow', 'clear', 'clouds', 'snow', 'fog', 'storm'];
const wx = { cloud: .06, rain: 0, snow: 0, storm: 0, fog: .1, label: 'clear', autoT: 0, autoI: 0 };
let E = null; // current environment

function computeEnv(g) {
  const month = mod(Math.floor(g / MONTH), 12), h = mod(g, DAY) / 60, season = Math.floor(month / 3);
  const rise = DAWN[month], set = DUSK[month] + 1, t = (h - rise) / (set - rise);
  const summer = 1 - Math.abs(month - 6.5) / 6;
  const maxAlt = .5 + .5 * summer;
  let e;
  if (t >= 0 && t <= 1) e = Math.sin(Math.PI * t) * maxAlt;
  else { const d = h < rise ? Math.min(rise - h, h + 24 - set) : Math.min(h - set, rise + 24 - h); e = -Math.min(1, d / 2.4); }
  const horizonY = .66 * H;
  const tc = clamp(t, -.08, 1.08);
  const sun = { x: lerp(.05, .95, tc) * W, y: horizonY - Math.sin(Math.PI * clamp(t)) * maxAlt * H * .6 + (t < 0 || t > 1 ? H * .08 : 0), up: t > -.02 && t < 1.02, e };

  let mm = moonModel(g);
  if (clk.phase !== 'auto') {
    const i = +clk.phase, lv = [0, 3, 6, 9, 12, 9, 6, 3][i];
    let frac = .5;
    if (e < 0) { const night = (rise + 24 - set), since = mod(h - set, 24); frac = clamp(since / night, .08, .92); }

    mm = { level: lv, waxing: i > 0 && i < 4, phase: PHASES[i], up: true, frac };
  }
  const moon = { ...mm, x: lerp(.05, .95, mm.frac) * W, y: horizonY - Math.sin(Math.PI * mm.frac) * H * .5, r: Math.max(13, Math.min(W, H) * .028) };
  const daylight = sstep(-.22, .2, e);
  const dark = 1 - sstep(-.45, -.05, e);

  const grey = mix(hex('#07090d'), hex('#7c838c'), daylight), greyH = mix(hex('#0d1016'), hex('#9ba3ab'), daylight);

}

/* ===================================================================== noise + scene build */
function vnoise(r) { const v = new Float32Array(1024); for (let i = 0; i < 1024; i++) v[i] = r(); return (x) => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(v[i & 1023], v[(i + 1) & 1023], u); }; }

const LAYERS = [
  { base: .640, amp: .50, freq: 2.2, oct: 6, ridge: .9, par: .06, rimW: 1.3, haze: .60, rock: 1, snowline: .40, step: 3 },

  { base: .884, amp: .06, freq: 1.6, oct: 4, ridge: 0, par: .7, rimW: 2.2, haze: .08, rock: 0, trees: .55, tmax: .06, step: 5 },
  { frame: true, par: 1, rimW: 2.6, haze: .02, rock: 0, trees: 1, tmax: .16, step: 5 },
];
const DARKEN = [1, .96, .9, .8, .66, .48], DARKEN_W = [1, .98, .97, .93, .88, .78];

const cv = $('#scene'), ctx = cv.getContext('2d');

function build() {

  const tall = W / H < .75, by = (b) => (tall ? b * .78 + .22 : b);

    const L = { ...cfg, i };
    if (L.base) L.base = by(L.base);
    const r = rng(4242 + i * 977), nA = vnoise(r), nB = vnoise(r);
    L.M = Math.ceil(46 * L.par + 6);

  });

  for (const p of L2.pts) { const w = Math.exp(-(((p[0] - innX) / (W * .045)) ** 2)); p[1] = lerp(p[1], iy, w); }

  // road: screen-space spline from the bottom to the inn door, assigned to the visible layer
  const C = [[.585, 1.04], [.66, .955], [.76, .915], [.70, .876], [.80, .846], [.855, .82], [.81, .796], [.835, .772]].map(([a, b]) => [a, by(b)]);

    const p0 = C[Math.max(0, s - 1)], p1 = C[s], p2 = C[s + 1], p3 = C[Math.min(C.length - 1, s + 2)];

const SPR = {};

  g.addColorStop(0, rgb(col, 1)); g.addColorStop(.18, rgb(col, .55)); g.addColorStop(.45, rgb(col, .14)); g.addColorStop(1, rgb(col, 0)); x.fillStyle = g; x.fillRect(0, 0, size, size); return c; }
SPR.warm = glowSprite(hex('#ffb35a'));

  for (let i = 0; i < 220; i++) { const px = r() * w, py = h / 2 + (r() + r() - 1) * h * .22, rad = 4 + r() * 16;
    const g = x.createRadialGradient(px, py, 0, px, py, rad); g.addColorStop(0, `rgba(205,210,255,${.03 + r() * .05})`); g.addColorStop(1, 'rgba(200,205,255,0)'); x.fillStyle = g; x.fillRect(px - rad, py - rad, rad * 2, rad * 2); }

/* ----------------------------------------------------------- layer colours + render */
const ROCK_DAY = hex('#5a6170'), VEG = [hex('#c9d3e0'), hex('#34553a'), hex('#2a4a30'), hex('#5a4728')];
function layerColors(L, env) {
  const w = env.winter, dl = env.daylight;
  const vegDay = VEG[env.season], rockDay = w ? hex('#5d697e') : ROCK_DAY;
  const day = mix(vegDay, rockDay, L.rock);
  const night = w ? hex('#1a2232') : hex('#080a10');
  let c = mix(night, day, dl);
  c = mix(c, w ? hex('#2c3850') : hex('#141b2a'), env.moonI * .5 * (1 - dl));
  c = mul(c, (w ? DARKEN_W : DARKEN)[L.i]);
  const haze = clamp(L.haze * (1 + wx.fog * .9 + wx.rain * .4 + wx.snow * .15));
  const hz = mix(env.hor, env.mid, .35);
  const base = mix(c, hz, haze);
  const tree = mix(w ? mix(hex('#0b1013'), hex('#1e2a2a'), dl) : mul(c, .62), hz, haze * .9);
  const snow = mix(mix(hex('#2a3448'), hex('#f0f4fa'), dl), env.light.col, .15 * env.light.I);
  return { base, tree, snow: mix(snow, hz, haze * .8), haze };
}

function treePath(x, t) { // pine silhouette into current path
  const { x: tx, y, h, w } = t, bw = h * w;
  x.moveTo(tx, y - h);
  for (let k = 1; k <= 4; k++) { const ty = y - h + (h * k) / 4.3, ww = bw * (k / 4) * 1.05; x.lineTo(tx + ww, ty); x.lineTo(tx + ww * .45, ty - h * .05); }
  x.lineTo(tx + bw * .12, y); x.lineTo(tx - bw * .12, y);
  for (let k = 4; k >= 1; k--) { const ty = y - h + (h * k) / 4.3, ww = bw * (k / 4) * 1.05; x.lineTo(tx - ww * .45, ty - h * .05); x.lineTo(tx - ww, ty); }
  x.closePath();
}

function renderLayer(L, env) {
  const x = L.c.getContext('2d'), ox = L.M, oy = -L.top;
  x.setTransform(DPR, 0, 0, DPR, 0, 0); x.clearRect(0, 0, L.cw, L.ch);
  x.translate(ox, oy);
  const col = layerColors(L, env), p = L.pts;
  const shape = new Path2D(); shape.moveTo(p[0][0], H + 20); for (const q of p) shape.lineTo(q[0], q[1]); shape.lineTo(p[p.length - 1][0], H + 20); shape.closePath();
  let minY = Infinity; for (const q of p) minY = Math.min(minY, q[1]);
  const g = x.createLinearGradient(0, minY, 0, H);
  g.addColorStop(0, rgb(mix(col.base, env.hor, .12 * (1 - L.i / 6)))); g.addColorStop(1, rgb(mul(col.base, env.winter ? .8 : .55)));
  x.fillStyle = g; x.fill(shape);
  x.save(); x.clip(shape);
  // light falling on the facing slopes
  const li = env.light, lg = x.createRadialGradient(li.x, li.y, 0, li.x, li.y, Math.max(W, H) * .9);
  lg.addColorStop(0, rgb(li.col, .16 * li.I)); lg.addColorStop(1, rgb(li.col, 0)); x.fillStyle = lg; x.fillRect(-ox, minY - 20, L.cw, H);

  // snow caps
  if (L.snowline !== undefined) {
    const sl = H * (env.winter ? L.snowline + .14 : L.snowline - (env.season === 2 ? .04 : 0)) + (L.base - LAYERS[L.i].base) * H;
    const sn = new Path2D(); let on = false; const nr = vnoise(rng(L.i + 5));
    for (const q of p) { const d = sl - q[1]; if (d > 0) { if (!on) { sn.moveTo(q[0], q[1]); on = true; } sn.lineTo(q[0], q[1]); } else if (on) { on = false; } }

    x.save(); const band = new Path2D(); band.moveTo(-ox, -2000);
    for (const q of p) { const d = Math.max(0, sl - q[1]); band.lineTo(q[0], q[1] + d * (1.15 + .5 * nr(q[0] * .05)) + (d > 0 ? 3 : 0) * nr(q[0] * .3)); }

  }

  const myRoad = [];
  for (let i = 0; i < seg.length; i++) if (seg[i].li === L.i || (seg[i + 1] && seg[i + 1].li === L.i) || (seg[i - 1] && seg[i - 1].li === L.i)) myRoad.push(i);
  if (myRoad.length > 1) {
    const roadC = mix(mix(col.base, env.winter ? hex('#9a8c7c') : hex('#8f7a5a'), .3 + .2 * env.daylight), env.light.col, .08 * env.light.I);

function facets(x, L, env, col) {
  const p = L.pts, li = env.light, n = p.length, sm = 6, NB = 4;

    const f = clamp(-slope * toLight * 1.4, -1, 1);
    const bi = Math.round(f * NB);
    if (bi) { bins[bi + NB].moveTo(a[0], a[1]); bins[bi + NB].lineTo(b[0], b[1]); }

/* ===================================================================== per-frame */
const mouse = { x: .5, y: .5, sx: .5, sy: .5 };

let enterSel = false, journey = false;

function weatherTargets(env, dt, t) {
  let name = clk.weather;

let lastRender = 0;

/* ----------------------------------------------------------- draw */
function draw(t) {
  const env = E, x = ctx;
  x.setTransform(DPR, 0, 0, DPR, 0, 0);
  const px = (mouse.sx - .5) * 2 + (RM ? 0 : Math.sin(t * .05) * .25), py = (mouse.sy - .5) * 2;
  // sky
  const sg = x.createLinearGradient(0, 0, 0, env.horizonY + H * .1);
  sg.addColorStop(0, rgb(env.top)); sg.addColorStop(.55, rgb(env.mid)); sg.addColorStop(1, rgb(env.hor));
  x.fillStyle = sg; x.fillRect(0, 0, W, H);
  // horizon glow around the low sun
  const low = (1 - sstep(.05, .3, Math.abs(env.e))) * (1 - wx.cloud * .7);
  if (low > .01) { const hx = env.sun.x, hy = env.horizonY; const hg = x.createRadialGradient(hx, hy, 0, hx, hy, W * .55); hg.addColorStop(0, `rgba(255,150,70,${.55 * low})`); hg.addColorStop(.4, `rgba(255,110,60,${.18 * low})`); hg.addColorStop(1, 'rgba(255,110,60,0)'); x.fillStyle = hg; x.fillRect(0, 0, W, H); }

    x.drawImage(S.milky, -S.Rmax * .2, S.Rmax * .45 - S.milky.height * 1.5, S.milky.width * 3, S.milky.height * 3); x.restore();
    x.globalCompositeOperation = 'lighter';
    const cs = ['#ffffff', '#bcd0ff', '#ffe2c0'];
    for (const s of S.stars) {
      const a = s.a + rot, sx = S.pole.x + Math.cos(a) * s.r - px * 4, sy = S.pole.y + Math.sin(a) * s.r - py * 2;
      if (sx < -2 || sx > W + 2 || sy < -2 || sy > H * .78) continue;

      const al = s.b * tw * starV * (1 - sstep(H * .45, H * .72, sy) * .7);

      if (s.s > 1.6 && al > .5) { x.globalAlpha = al * .25; x.drawImage(SPR.white, sx - 6, sy - 6, 12, 12); }
    }
    x.globalAlpha = 1;
    for (const s of S.shoot) { const k = 1 - s.life / s.max, d = Math.hypot(s.vx, s.vy), tx = s.x - s.vx / d * s.len, ty = s.y - s.vy / d * s.len; const g = x.createLinearGradient(s.x, s.y, tx, ty); g.addColorStop(0, `rgba(255,255,255,${k * starV})`); g.addColorStop(1, 'rgba(180,200,255,0)'); x.strokeStyle = g; x.lineWidth = 1.6; x.beginPath(); x.moveTo(s.x, s.y); x.lineTo(tx, ty); x.stroke(); x.globalAlpha = k * starV; x.drawImage(SPR.white, s.x - 5, s.y - 5, 10, 10); x.globalAlpha = 1; }

const moonC = mk(128, 128);

function drawClouds(x, env, t) {

function drawBirds(x, env, px, py) {

}

function drawWeather(x, env, t, px, py) {

      for (let i = 0; i < n; i++) { const d = S.drops[i]; if ((d.z > .6) !== !!pass) continue; const sp = (RM ? 300 : 900) * (.6 + d.z * .7), len = 10 + d.z * 22;
        d.y += sp * dt; d.x += sp * wind * dt * .35; if (d.y > H) { d.y = -20; d.x = R() * (W + 200) - 200; } if (d.x > W + 20) d.x -= W + 40;

      f.y += sp * dt; f.p += dt * (.6 + f.z); f.x += (Math.sin(f.p) * 14 + 22 * wind) * dt * (.4 + f.z);
      if (f.y > H + 6) { f.y = -6; f.x = R() * W; } if (f.x > W + 6) f.x = -6;
      const r = .7 + f.z * 2.4, fx = f.x - px * 12 * f.z, fy = f.y - py * 4 * f.z;
      if (f.z > .75) { x.globalAlpha = .55; x.drawImage(SPR.white, fx - r * 2.2, fy - r * 2.2, r * 4.4, r * 4.4); x.globalAlpha = 1; }
      else { x.globalAlpha = .4 + f.z * .5; x.fillRect(fx - r / 2, fy - r / 2, r, r); }
    }

  }

  const ff = (env.month >= 5 && env.month <= 8 ? 1 : 0) * env.dark * (1 - wx.rain) ;
  if (ff > .05) { x.globalCompositeOperation = 'lighter'; for (const f of S.flies) { f.p += dt * f.f; f.x += Math.sin(f.p * 1.3) * 12 * dt; f.y += Math.cos(f.p) * 7 * dt; if (f.x > W) f.x = 0; if (f.x < 0) f.x = W;
    const b = Math.max(0, Math.sin(f.p * 2.2 + t)) ** 3 * ff; if (b < .03) continue; const r = 10 * f.z; x.globalAlpha = b; x.drawImage(SPR.fly, f.x - px * 20 * f.z - r, f.y - r, r * 2, r * 2); } x.globalAlpha = 1; x.globalCompositeOperation = 'source-over'; }
  // leaves: autumn
  if (env.season === 3 && !env.winter) { const lc = 1 - env.dark * .7; for (const l of S.leaves) { const sp = 40 + l.z * 60; l.p += dt * 2; l.rot += l.vr * dt; l.x += (sp * (.8 + wind) + Math.sin(l.p) * 30) * dt * (RM ? .3 : 1); l.y += (20 + Math.sin(l.p * .7) * 25) * dt * (RM ? .3 : 1);
    if (l.x > W + 20) { l.x = -20; l.y = R() * H * .9; } if (l.y > H + 20) { l.y = -10; l.x = R() * W; }
    const s = 3 + l.z * 5; x.save(); x.translate(l.x - px * 18 * l.z, l.y); x.rotate(l.rot); x.scale(1, Math.sin(l.p * 1.7)); x.fillStyle = rgb(mul(hex(l.c), lc)); x.beginPath(); x.ellipse(0, 0, s, s * .45, 0, 0, 7); x.fill(); x.restore(); } }
}

/* ===================================================================== wordmark */
const wm = $('#wordmark'), wx2 = wm.getContext('2d');
const WM = { ready: false, ign: 0, sparks: [] };
function buildWordmark() {
  const cssW = wm.clientWidth || 600, cssH = Math.round(cssW * .34), d = Math.min(devicePixelRatio || 1, 2);
  wm.style.height = cssH + 'px'; wm.width = Math.round(cssW * d); wm.height = Math.round(cssH * d);
  const fs = cssW * .215;
  wx2.font = `900 ${fs}px Cinzel`;
  const chars = ['M', 'U', 'M', 'E'], sp = fs * .045, ws = chars.map((c) => wx2.measureText(c).width);
  const total = ws.reduce((a, b) => a + b, 0) + sp * 3;
  let cx = (cssW - total) / 2; const pos = chars.map((c, i) => { const p = cx; cx += ws[i] + sp; return p; });
  Object.assign(WM, { cssW, cssH, d, fs, chars, pos, base: cssH * .84, x0: (cssW - total) / 2, x1: (cssW + total) / 2, core: mk(cssW * d, cssH * d) });
  // molten texture
  const lw = Math.ceil(cssW * .8), lh = Math.ceil(cssH), lc = mk(lw, lh), l = lc.getContext('2d'), r = rng(31);
  l.fillStyle = '#c23a06'; l.fillRect(0, 0, lw, lh);
  const cols = ['#ff3a00', '#ff6a0a', '#ff9420', '#ffc050', '#ffe6a0', '#fff6dc'];
  for (let i = 0; i < 160; i++) { const px = r() * lw, py = r() * lh, rad = (6 + r() * 34) * cssW / 600, ci = Math.min(5, Math.floor(r() ** 1.7 * 6)); const g = l.createRadialGradient(px, py, 0, px, py, rad); g.addColorStop(0, cols[ci]); g.addColorStop(1, 'rgba(255,60,0,0)');
    for (const ox of [-lw, 0, lw]) { l.fillStyle = g; l.save(); l.translate(ox, 0); l.fillRect(px - rad, py - rad, rad * 2, rad * 2); l.restore(); } }
  WM.lava = lc; WM.lava2 = mk(lw * 2, lh); WM.lava2.getContext('2d').drawImage(lc, 0, 0); WM.lava2.getContext('2d').drawImage(lc, lw, 0); WM.ready = true;
}
function wmText(c, method) { c.font = `900 ${WM.fs}px Cinzel`; WM.chars.forEach((ch, i) => c[method](ch, WM.pos[i], WM.base)); }
function drawWordmark(t, dt) {
  if (!WM.ready) return;
  const c = wx2, { d, cssW, cssH, fs } = WM;
  WM.ign = Math.min(1, WM.ign + dt / (RM ? .5 : 2.2));
  const ign = sstep(0, 1, WM.ign) * (enterSel ? 1.12 : 1) * (RM ? 1 : .88 + .12 * Math.sin(t * 1.3) * Math.sin(t * .71 + 1));
  c.setTransform(d, 0, 0, d, 0, 0); c.clearRect(0, 0, cssW, cssH);
  c.textBaseline = 'alphabetic';
  // carved depth + contact shadow
  c.save(); c.shadowColor = 'rgba(0,0,0,.85)'; c.shadowBlur = fs * .18; c.shadowOffsetY = fs * .05; c.fillStyle = '#0b0807'; wmText(c, 'fillText'); c.restore();
  for (let k = 4; k >= 1; k--) { c.fillStyle = `rgb(${14 + k * 3},${11 + k * 2},${9 + k * 2})`; c.save(); c.translate(0, k * fs * .009); wmText(c, 'fillText'); c.restore(); }
  // forged iron face
  const top = WM.base - fs * .72, g = c.createLinearGradient(0, top, 0, WM.base);
  g.addColorStop(0, '#6a5c4e'); g.addColorStop(.18, '#3c332b'); g.addColorStop(.6, '#241e19'); g.addColorStop(1, '#16110e');
  c.save(); c.translate(0, -Math.max(1, fs * .011)); c.fillStyle = 'rgba(255,222,180,.55)'; wmText(c, 'fillText'); c.restore();
  c.fillStyle = g; wmText(c, 'fillText');
  // hammered sheen
  c.save(); c.globalCompositeOperation = 'source-atop'; const sh = c.createLinearGradient(WM.x0, 0, WM.x1, 0); const sp = (t * .05) % 1;
  sh.addColorStop(0, 'rgba(255,220,180,0)'); sh.addColorStop(clamp(sp - .08), 'rgba(255,220,180,0)'); sh.addColorStop(clamp(sp), 'rgba(255,220,180,.07)'); sh.addColorStop(clamp(sp + .08), 'rgba(255,220,180,0)'); sh.addColorStop(1, 'rgba(255,220,180,0)');
  c.fillStyle = sh; c.fillRect(0, 0, cssW, cssH); c.restore();

  const k = WM.core.getContext('2d'); k.setTransform(d, 0, 0, d, 0, 0); k.globalCompositeOperation = 'source-over'; k.clearRect(0, 0, cssW, cssH);

  k.fillStyle = '#fff'; wmText(k, 'fillText');
  k.globalCompositeOperation = 'source-in'; k.drawImage(WM.lava2, WM.x0 - 20 - off, oy - cssH * .05, lw * 2, cssH * 1.1);
  k.globalCompositeOperation = 'destination-out'; k.lineJoin = 'round'; k.lineWidth = fs * .098; k.strokeStyle = '#000'; wmText(k, 'strokeText');

    if (R() < dt * 7 * ign) WM.sparks.push({ x: lerp(WM.x0 + fs * .1, WM.x1 - fs * .1, R()), y: top + fs * .1 * R(), vx: (R() - .5) * 14, vy: -(16 + R() * 30), life: 0, max: 1.2 + R() * 2, s: .6 + R() * 1.2 });
    c.save(); c.globalCompositeOperation = 'lighter';
    for (const s of WM.sparks) { s.life += dt; s.x += (s.vx + Math.sin(s.life * 3 + s.y) * 8) * dt; s.y += s.vy * dt; s.vy *= .995; const a = (1 - s.life / s.max); c.fillStyle = `rgba(255,${150 + a * 90 | 0},${60 + a * 80 | 0},${a})`; c.beginPath(); c.arc(s.x, s.y, s.s * (.5 + a * .5), 0, 7); c.fill(); }
    c.restore(); WM.sparks = WM.sparks.filter((s) => s.life < s.max && s.y > 0);
  }
}

/* ===================================================================== menu */
const items = [...document.querySelectorAll('#menu .item')];
const selEl = $('#sel'), trailEl = $('#trail'), menuWin = $('#menuWin'), menuEl = $('#menu');
let cur = 0;
function placeSel() {
  const el = items[cur];
  for (const e of [selEl, trailEl]) { e.style.transform = `translateY(${el.offsetTop}px)`; e.style.height = el.offsetHeight + 'px'; }
  menuWin.style.setProperty('--ly', (menuEl.offsetTop + el.offsetTop + el.offsetHeight / 2) + 'px');
}
function select(i, sweep = true) {
  cur = mod(i, items.length);
  items.forEach((el, k) => el.classList.toggle('on', k === cur));
  placeSel();
  enterSel = cur === 0;
  if (sweep && !RM) { selEl.classList.remove('sweep'); void selEl.offsetWidth; selEl.classList.add('sweep'); }
}
items.forEach((el, k) => { el.addEventListener('pointerenter', () => { if (k !== cur) select(k); }); el.addEventListener('click', () => { select(k, false); activate(k); }); });
let flashT;
function flash(el, msg) { el.textContent = msg; el.classList.add('show'); clearTimeout(flashT); flashT = setTimeout(() => el.classList.remove('show'), 1800); }
function activate(k) {
  const key = items[k].dataset.k;
  if (key === 'enter') return journeyStart();
  if (key === 'profile') return openProfile();
  flash($('#flash'), `${items[k].textContent.replace(/[A-Z]$/, '').trim()} — not in this mockup`);
}
function journeyStart() {
  if (journey) return; journey = true;
  const inn = S.inn; document.documentElement.style.setProperty('--ox', (inn.x / W * 100) + '%'); document.documentElement.style.setProperty('--oy', (inn.y / H * 100) + '%');
  setTimeout(() => document.body.classList.add('journey'), 700);
  const toast = $('#toast');
  setTimeout(() => { toast.innerHTML = 'The road is lit.<small>connecting to MUME would start here — not in this mockup</small>'; toast.classList.add('show'); }, 2000);
  setTimeout(() => { toast.classList.remove('show'); document.body.classList.remove('journey'); }, 4300);
  setTimeout(() => { journey = false; }, 5200);
}

const QUOTES = [
  ['Not all those who wander are lost.', 'Bilbo Baggins'], ["It's a dangerous business, Frodo, going out of your door.", 'Bilbo Baggins'],
  ['The Road goes ever on and on.', 'Bilbo Baggins'], ['Faithless is he that says farewell when the road darkens.', 'Gimli'],
  ['All we have to decide is what to do with the time that is given us.', 'Gandalf'], ['Despair is only for those who see the end beyond all doubt.', 'Gandalf'],
  ['The world is indeed full of peril, and in it there are many dark places.', 'Haldir'], ['Courage is found in unlikely places.', 'Gildor Inglorion'],
];
const q = QUOTES[qs.has('q') ? +qs.get('q') : Math.floor(Math.random() * QUOTES.length)];
$('#qtext').textContent = q[0]; $('#qby').textContent = '— ' + q[1];

/* ===================================================================== demo panel + almanac */
const demo = $('#demo');
$('#dToggle').addEventListener('click', () => { demo.classList.toggle('open'); $('#dToggle').textContent = demo.classList.contains('open') ? 'DEMO ▾' : 'DEMO ▸'; });
if (qs.has('demo')) $('#dToggle').click();
$('#dMonth').innerHTML = MONTHS.map((m, i) => `<option value="${i}">${m}${i === 11 || i < 2 ? ' (snow)' : ''}</option>`).join('');
$('#dMoon').innerHTML += PHASES.map((p, i) => `<option value="${i}">${p}</option>`).join('');
$('#dTime').addEventListener('input', (e) => setHour(+e.target.value));
$('#dMonth').addEventListener('change', (e) => setMonth(+e.target.value));
$('#dWeather').addEventListener('change', (e) => { clk.weather = e.target.value; wx.autoT = 0; });
$('#dMoon').addEventListener('change', (e) => { clk.phase = e.target.value; });
$('#dFast').addEventListener('change', (e) => { const g = gameG(); clk.speed = e.target.checked ? 600 : 1; rebase(g); });
$('#dReal').addEventListener('click', () => { clk.speed = 1; $('#dFast').checked = false; clk.weather = 'auto'; clk.phase = 'auto'; $('#dWeather').value = 'auto'; $('#dMoon').value = 'auto'; rebase(realG()); });
$('#dWeather').value = clk.weather; $('#dMoon').value = clk.phase; $('#dFast').checked = clk.speed > 1;
const ord = (n) => n + (n % 10 === 1 && n !== 11 ? 'st' : n % 10 === 2 && n !== 12 ? 'nd' : n % 10 === 3 && n !== 13 ? 'rd' : 'th');
let lastUi = 0;
function ui() {
  const env = E, g = env.g, e = Math.max(0, Math.floor(g)), yr = Math.floor(e / YEAR), mo = env.month, day = (Math.floor(e / DAY) % 30) + 1;
  const hh = Math.floor(env.h), mm = Math.floor((env.h - hh) * 60), wd = WEEKDAYS[(mo * 30 + day - 1) % 7];
  const period = env.h >= DAWN[mo] && env.h < DAWN[mo] + 1 ? 'dawn' : env.h >= DUSK[mo] && env.h < DUSK[mo] + 1 ? 'dusk' : env.h > DAWN[mo] && env.h < DUSK[mo] ? 'day' : 'night';
  const moon = env.moon;
  const h12 = `${hh % 12 || 12}:${String(mm).padStart(2, '0')}${hh < 12 ? 'am' : 'pm'}`;
  $('#almD').textContent = `${wd}, the ${ord(day)} of ${MONTHS[mo]}`;
  $('#almM').textContent = `${h12} · ${period} · ${moon.phase} moon${moon.up ? '' : ' (set)'} · T.A. ${yr}`;
  if (demo.classList.contains('open')) {
    if (document.activeElement !== $('#dTime')) $('#dTime').value = env.h.toFixed(2);
    $('#dTimeV').textContent = `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
    if (document.activeElement !== $('#dMonth')) $('#dMonth').value = mo;
    $('#dRo').textContent = `${period}, sun elev ${env.e.toFixed(2)}\nmoon ${moon.phase} (${moon.level}/12) ${moon.up ? 'up ' + Math.round(moon.frac * 100) + '%' : 'below'}\nweather ${wx.label} · light: ${env.light.kind}\nepoch ${clk.epoch === SEED_EPOCH ? 'seed' : 'wc.clock'}${clk.speed > 1 ? ' · ×600' : ''}`;
  }
}

/* ===================================================================== favicon, grain, loop */
(function favicon() {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><defs><radialGradient id="g" cx="50%" cy="62%" r="62%"><stop offset="0" stop-color="#fff5d0"/><stop offset=".35" stop-color="#ffc25a"/><stop offset=".78" stop-color="#e2661a"/><stop offset="1" stop-color="#7a2806"/></radialGradient><linearGradient id="i" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9a8a74"/><stop offset="1" stop-color="#3a3028"/></linearGradient></defs><path d="M16 .9a2.7 2.7 0 1 1 0 5.4a2.7 2.7 0 1 1 0-5.4zm0 1.6a1.1 1.1 0 1 0 0 2.2a1.1 1.1 0 1 0 0-2.2z" fill="url(#i)"/><path d="M16 5.2 25 10.6H7z" fill="url(#i)"/><rect x="6" y="10" width="20" height="2.8" rx="1.1" fill="url(#i)"/><path d="M9.3 12.6h13.4l-1.3 12.2h-10.8z" fill="url(#g)" stroke="#2a221c" stroke-width="1.5"/><path d="M16 14.6c2.3 3 3 4.8 3 6.1a3 3 0 0 1-6 0c0-1.3.7-3.1 3-6.1z" fill="#fff6dc"/><rect x="7.6" y="24.2" width="16.8" height="2.9" rx="1.1" fill="url(#i)"/><rect x="10.2" y="27" width="11.6" height="2.4" rx=".9" fill="url(#i)"/></svg>`;
  $('#favicon').href = 'data:image/svg+xml,' + encodeURIComponent(svg);
})();
(function grain() {
  const c = mk(160, 160), x = c.getContext('2d'), id = x.createImageData(160, 160);
  for (let i = 0; i < id.data.length; i += 4) { const v = Math.random() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 40; }
  x.putImageData(id, 0, 0); document.documentElement.style.setProperty('--grain', `url(${c.toDataURL()})`);
})();

let last = performance.now(), running = false;
function frame(now) {
  if (document.hidden) { running = false; return; }
  const dt = clamp((now - last) / 1000, 0, .05); last = now;
  const t = now / 1000;
  update(dt, t); draw(t); drawWordmark(t, dt);
  if (now - lastUi > 250) { lastUi = now; ui(); }
  requestAnimationFrame(frame);
}
function start() { if (running) return; running = true; last = performance.now(); requestAnimationFrame(frame); }
document.addEventListener('visibilitychange', () => { if (!document.hidden) start(); });
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { build(); buildWordmark(); placeSel(); }, 120); });

build();
E = computeEnv(gameG());
for (const L of S.layers) renderLayer(L, E);
select(qs.has('sel') ? +qs.get('sel') : 0, false);
document.fonts.load('900 100px Cinzel').then(() => document.fonts.ready).then(() => { buildWordmark(); placeSel(); });
if (qs.get('page') === 'profile') openProfile();
start();
})();
</script>
</body>
</html>
