<!doctype html>
<!--
  03 — STJÄRNVALVET (The Vault of Stars)

  Idea: the start menu is almost all sky. A huge, exact sky over a low
  horizon of misty ridges: the sun and moon ride their real arcs by MUME's
  game clock (correct moon phase), the stars wheel slowly around the pole
  with Tolkien's constellations (Valacirca, Menelvagor, Wilwarin …) drawing
  in one at a time. The mark — a lone watchtower crowned by a star, drawn in
  hairlines — stands on the real horizon of the scene, so logo and landscape
  are one. The menu is free, thin typography floating on the sky; sub-pages
  are frosted-glass sheets over the same sky.

  Cost to build for real: medium. One Canvas 2D renderer (~900 lines TS:
  sky model, stars + Milky Way, sun/moon, clouds, weather particles, ridges)
  that reuses clock.ts / gametime.ts directly; DOM menu + sheets are plain
  CSS. Main work: perf budget on low-end laptops (half-res cloud layer,
  draw throttling when hidden), a calmer reduced-motion path, and tuning the
  sky palette per season. No assets, no WebGL; fonts are two Google Fonts.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WebCockpit — Stjärnvalvet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Josefin+Sans:wght@300;400&display=swap" rel="stylesheet">

<style>
:root {
  --ink: #eef2fa;
  --ink-dim: rgba(232, 238, 250, calc(.5 + var(--day, 0) * .2));
  --ink-faint: rgba(232, 238, 250, 0.32);
  --hair: rgba(240, 245, 255, 0.85);
  --warm: #ffe9bf;
  --glass: rgba(12, 18, 34, 0.34);
  --glass-line: rgba(255, 255, 255, 0.16);
  --serif: 'Cormorant Garamond', 'Cormorant', Georgia, serif;
  --sans: 'Josefin Sans', 'Futura', 'Gill Sans', sans-serif;
  --ease: cubic-bezier(.2, .7, .1, 1);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #03050c; overflow: hidden; }
body {
  color: var(--ink); font-family: var(--sans); font-weight: 300;
  -webkit-font-smoothing: antialiased; user-select: none;
}
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.vignette {
  position: fixed; inset: 0; pointer-events: none;
  background: radial-gradient(120% 90% at 50% 40%, transparent 55%, rgba(0, 2, 8, 0.45) 100%);
}

/* ---------------------------------------------------------------- stage */
.stage {
  position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
  padding-top: 8.5vh; text-shadow: 0 0 22px rgba(2, 8, 26, calc(.45 + var(--day, 0) * .3)), 0 1px 2px rgba(4, 14, 40, calc(var(--day, 0) * .35));
  transition: opacity .9s var(--ease), transform .9s var(--ease), filter .9s var(--ease);
}
body.sub .stage { opacity: 0; transform: translateY(-14px); filter: blur(6px); pointer-events: none; }

.stage::before {
  content: ''; position: absolute; left: 50%; top: 2vh; width: min(1300px, 100vw); height: 80vh; transform: translateX(-50%);
  background: radial-gradient(closest-side, rgba(12, 22, 48, .34), rgba(12, 22, 48, .16) 50%, transparent);
  opacity: var(--veil, 0); pointer-events: none; z-index: -1; transition: opacity 2s;
}
.brand { text-align: center; }
.word {
  font-family: var(--serif); font-weight: 300; font-size: clamp(30px, 4.4vw, 74px);
  letter-spacing: .4em; margin-right: -.4em; line-height: 1; white-space: nowrap;
}
.word .lite { opacity: .55; }
.tag {
  margin-top: 1.1em; display: inline-flex; align-items: center; gap: 1.1em;
  font-size: 11px; letter-spacing: .55em; margin-right: -.55em; text-transform: uppercase; color: var(--ink-dim);
}
.tag::before, .tag::after { content: ''; width: 46px; height: 1px; background: linear-gradient(90deg, transparent, var(--ink-faint)); }
.tag::after { transform: scaleX(-1); }

#menu { margin-top: 6.2vh; }
#menu ul { list-style: none; margin: 0; padding: 0; text-align: center; }
#menu button {
  position: relative; background: none; border: 0; cursor: pointer; padding: .02em .35em .1em;
  font: 300 clamp(23px, 2.35vw, 38px)/1.36 var(--serif); letter-spacing: .09em; color: var(--ink-dim);
  text-shadow: inherit; transition: color .6s var(--ease), text-shadow .8s var(--ease), letter-spacing .8s var(--ease);
  outline: none;
}
#menu button::after {
  content: ''; position: absolute; left: 14%; right: 14%; bottom: .14em; height: 1px;
  background: linear-gradient(90deg, transparent, var(--hair) 30%, var(--hair) 70%, transparent);
  transform: scaleX(0); transition: transform .8s var(--ease), opacity .8s; opacity: 0;
}
#menu button.sel { color: #fdfeff; letter-spacing: .12em; text-shadow: 0 0 26px rgba(170, 195, 255, 0.45), 0 0 2px rgba(255,255,255,.3); }
#menu button.sel::after { transform: scaleX(1); opacity: 1; }
#menu button.primary { color: rgba(255, 246, 228, 0.78); }
#menu button.primary.sel { color: #fffaf0; text-shadow: 0 0 30px rgba(255, 220, 160, 0.45); }
#menu .star {
  position: absolute; left: -.55em; top: 50%; width: .5em; height: .5em; margin-top: -.25em;
  color: var(--warm); filter: drop-shadow(0 0 6px rgba(255, 220, 150, .8));
  animation: glint 6s ease-in-out infinite;
}
@keyframes glint { 0%,100% { transform: scale(.8); opacity: .7; } 50% { transform: scale(1.08); opacity: 1; } }

.quote {
  margin: 4.2vh 24px 0; max-width: 33em; text-align: center;
  font: italic 300 clamp(15px, 1.15vw, 19px)/1.5 var(--serif); color: rgba(240, 244, 252, calc(.66 + var(--day, 0) * .26));
  transition: opacity 1.2s var(--ease);
}
.quote cite {
  display: block; margin-top: .6em; font: 300 10px/1 var(--sans); font-style: normal;
  letter-spacing: .38em; text-transform: uppercase; color: rgba(232, 238, 250, calc(.32 + var(--day, 0) * .4));
}

.clock {
  position: fixed; top: 24px; right: 30px; text-align: right; pointer-events: none;
  text-shadow: 0 0 16px rgba(0, 6, 20, .6);
}
.clock .d { font-size: 10.5px; letter-spacing: .3em; text-transform: uppercase; color: var(--ink-dim); }
.clock .t { margin-top: 6px; font: italic 300 16px/1 var(--serif); color: rgba(235, 240, 250, .72); letter-spacing: .04em; }
.clock .t b { font-weight: 300; font-style: normal; letter-spacing: .12em; color: var(--ink); }

.hint {
  position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); white-space: nowrap;
  font-size: 10px; letter-spacing: .34em; text-transform: uppercase; color: rgba(232, 238, 250, .38);
  pointer-events: none; text-shadow: 0 0 10px rgba(0,0,0,.6);
}
.hint kbd { font: inherit; color: rgba(240, 245, 255, .7); }

#toast {
  position: fixed; left: 50%; bottom: 64px; transform: translate(-50%, 8px); opacity: 0;
  padding: 10px 22px; border-radius: 999px; background: var(--glass); border: 1px solid var(--glass-line);
  backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%);
  font: italic 300 16px/1 var(--serif); letter-spacing: .04em; pointer-events: none;
  transition: opacity .5s var(--ease), transform .5s var(--ease); z-index: 30;
}
#toast.on { opacity: 1; transform: translate(-50%, 0); }

/* --------------------------------------------------------- profile sheet */
.sheet {
  position: fixed; left: 50%; top: 50%; width: min(760px, calc(100vw - 32px));
  transform: translate(-50%, -46%) scale(.98); opacity: 0; pointer-events: none; filter: blur(4px);
  transition: opacity .8s var(--ease), transform .8s var(--ease), filter .8s var(--ease);
  padding: 34px 40px 30px; border-radius: 16px;
  background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.015) 40%), var(--glass);
  border: 1px solid var(--glass-line);
  box-shadow: 0 40px 90px -30px rgba(0, 0, 0, .65), inset 0 1px 0 rgba(255, 255, 255, .12);
  backdrop-filter: blur(22px) saturate(150%); -webkit-backdrop-filter: blur(22px) saturate(150%);
  z-index: 10;
}
body.sub .sheet { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; filter: none; }
.sheet header { display: flex; align-items: center; gap: 16px; }
.sheet header svg { width: 34px; height: 34px; color: var(--ink); flex: none; }
.sheet h2 { margin: 0; font: 300 36px/1 var(--serif); letter-spacing: .14em; }
.sheet .back {
  margin-left: auto; background: none; border: 0; cursor: pointer; color: var(--ink-dim);
  font: 300 10.5px/1 var(--sans); letter-spacing: .32em; text-transform: uppercase; padding: 8px 0;
}
.sheet .back:hover { color: var(--ink); }
.sheet .lede { margin: 10px 0 24px 50px; font: italic 300 16px/1.4 var(--serif); color: var(--ink-dim); }
.rows { border-top: 1px solid rgba(255,255,255,.1); }
.colhead, .row {
  display: grid; grid-template-columns: 22px 1.35fr 1fr .9fr; align-items: baseline; gap: 12px; padding: 0 14px;
}
.colhead { padding-top: 12px; padding-bottom: 8px; font-size: 9.5px; letter-spacing: .32em; text-transform: uppercase; color: var(--ink-faint); }
.row {
  position: relative; padding-top: 14px; padding-bottom: 14px; cursor: pointer;
  border-bottom: 1px solid rgba(255,255,255,.07); transition: background .5s var(--ease);
}
.row::after {
  content: ''; position: absolute; left: 14px; right: 14px; bottom: -1px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--hair) 20%, var(--hair) 80%, transparent);
  transform: scaleX(0); transition: transform .7s var(--ease);
}
.row.sel { background: linear-gradient(90deg, transparent, rgba(255,255,255,.055), transparent); }
.row.sel::after { transform: scaleX(1); }
.row .nm { font: 300 23px/1.1 var(--serif); letter-spacing: .05em; color: var(--ink-dim); transition: color .5s; }
.row.sel .nm { color: #fff; }

.row .ch small { display: block; margin-top: 5px; font-size: 10px; letter-spacing: .2em; color: var(--ink-faint); text-transform: uppercase; }
.row .lu { font: italic 300 15px/1 var(--serif); color: var(--ink-dim); text-align: right; }
.row .act { width: 11px; height: 11px; color: var(--warm); opacity: 0; transition: opacity .5s; align-self: center; }
.row.active .act { opacity: 1; filter: drop-shadow(0 0 5px rgba(255,220,150,.8)); }
.actions { display: flex; gap: 10px; margin-top: 26px; flex-wrap: wrap; }
.actions button {
  background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.16); color: var(--ink);
  border-radius: 999px; padding: 10px 20px 9px; cursor: pointer;
  font: 300 11px/1 var(--sans); letter-spacing: .3em; text-transform: uppercase;
  transition: background .4s, border-color .4s;
}
.actions button:hover { background: rgba(255,255,255,.09); border-color: rgba(255,255,255,.4); }
.actions button u { text-decoration: none; border-bottom: 1px solid currentColor; }
.actions .new { background: rgba(255, 236, 200, .1); border-color: rgba(255, 228, 180, .38); color: #fff4e0; }
.actions .del { margin-left: auto; color: #f2b8c0; border-color: rgba(242, 160, 175, .3); }

/* ------------------------------------------------------------ demo panel */
#demo {
  position: fixed; left: 16px; bottom: 16px; z-index: 20; font-size: 11px; letter-spacing: .08em;
}
#demo .toggle {

}
#demo .toggle img { width: 16px; height: 16px; }
#demo .body {
  display: none; margin-bottom: 8px; width: 248px; padding: 14px 14px 12px; border-radius: 12px;
  background: rgba(8, 12, 24, .62); border: 1px solid rgba(255,255,255,.12);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
}
#demo.open .body { display: block; }
#demo label { display: grid; grid-template-columns: 62px 1fr; align-items: center; gap: 8px; margin: 7px 0; color: var(--ink-dim); }
#demo select, #demo input[type=range] { width: 100%; }
#demo select { background: rgba(255,255,255,.06); color: var(--ink); border: 1px solid rgba(255,255,255,.15); border-radius: 6px; padding: 3px 4px; font: 12px var(--sans); }
#demo select option { background: #101626; }
#demo input[type=range] { accent-color: #cfd9f0; }
#demo .row2 { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
#demo .row2 button { background: none; border: 1px solid rgba(255,255,255,.2); color: var(--ink); border-radius: 999px; padding: 4px 10px; font: 10px var(--sans); letter-spacing: .2em; text-transform: uppercase; cursor: pointer; }
#demo .marks { display: flex; align-items: flex-end; gap: 10px; margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.1); color: var(--ink-faint); font-size: 9px; letter-spacing: .2em; text-transform: uppercase; }
#demo .marks img { display: block; }
#demo .readout { color: var(--ink); font-variant-numeric: tabular-nums; }

/* ----------------------------------------------------------------- phone */
@media (max-width: 600px) {
  .stage { padding-top: 12.5vh; }
  .word { font-size: 30px; letter-spacing: .34em; margin-right: -.34em; }
  .tag { font-size: 9px; letter-spacing: .42em; margin-right: -.42em; gap: .8em; }
  .tag::before, .tag::after { width: 22px; }
  #menu { margin-top: 4.6vh; }
  #menu button { font-size: 26px; line-height: 1.42; }
  .quote { font-size: 15px; margin-top: 2.8vh; max-width: 21em; }
  .clock { top: 18px; left: 0; right: 0; text-align: center; }
  .clock .d { font-size: 9px; letter-spacing: .24em; }
  .clock .t { font-size: 14px; margin-top: 4px; }
  .hint { display: none; }
  .sheet { padding: 24px 18px 20px; top: 47%; }
  .sheet h2 { font-size: 30px; }
  .sheet .lede { margin-left: 0; font-size: 15px; }
  .colhead { display: none; }
  .row { grid-template-columns: 16px 1fr auto; padding: 12px 8px; }
  .row .ch { grid-column: 2; grid-row: 2; margin-top: 4px; }
  .row .lu { grid-column: 3; grid-row: 1 / span 2; align-self: center; font-size: 13px; }
  .actions { gap: 8px; }
  .actions button { padding: 9px 13px 8px; letter-spacing: .2em; font-size: 10px; }
  .actions .del { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition-duration: .2s !important; animation: none !important; }
}
</style>
</head>

<script>
'use strict';
const $ = (s) => document.querySelector(s);
const Q = new URLSearchParams(location.search);
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches || Q.get('reduced') === '1';
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const md = (a, n) => ((a % n) + n) % n;
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const mul = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
const rgba = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const lum = (c) => 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];

// ------------------------------------------------------------- game clock
// Re-implemented from src/gmcp/clock.ts + gametime.ts (throwaway mockup).
const DAY = 1440, MONTH = 43200, YEAR = 518400;
const SEED_EPOCH = 1696118400 - 2850 * YEAR;
const DAWN = [8, 9, 8, 7, 7, 6, 5, 4, 5, 6, 7, 7];
const DUSK = [18, 17, 18, 19, 20, 20, 21, 22, 21, 20, 20, 19];
const MONTHS = ['Afteryule', 'Solmath', 'Rethe', 'Astron', 'Thrimidge', 'Forelithe', 'Afterlithe', 'Wedmath', 'Halimath', 'Winterfilth', 'Blotmath', 'Foreyule'];
const WEEKDAYS = ['Sterday', 'Sunday', 'Monday', 'Trewsday', 'Hevensday', 'Mersday', 'Highday'];
const PHASES = ['new', 'waxing crescent', 'first quarter', 'waxing gibbous', 'full', 'waning gibbous', 'third quarter', 'waning crescent'];
const WINTER = new Set([11, 0, 1]);
const MOON_CYCLE = (29 * 24 + 12) * 60 + 44, MOON_ORIGIN = 2850 * YEAR;
const EPOCH = (() => {
  try { const s = JSON.parse(localStorage.getItem('wc.clock') || 'null'); if (s && Number.isFinite(s.epoch)) return s.epoch; } catch (e) { /* none */ }
  return SEED_EPOCH;
})();
let offset = 0, fast = Q.get('fast') === '1', moonOverride = Q.has('moon') ? +Q.get('moon') : null;
const gNow = () => Date.now() / 1000 - EPOCH + offset;
const monthOf = (g) => md(Math.floor(g / MONTH), 12);
function setHour(h) { const g = gNow(); offset += h * 60 - md(g, DAY); }
function setMonth(m) { offset += (m - monthOf(gNow())) * MONTH; }
if (Q.has('month')) setMonth(+Q.get('month'));
if (Q.has('hour')) setHour(+Q.get('hour'));

function sunAt(g) {
  const mo = monthOf(g), m = md(g, DAY);

const mistCache = { key: '', c: null };
function tintedMist(col) {

function drawMoon(x, y, r, moon, vis, sunLight) {

  }

  $('#dTimeOut').textContent = `${hh}:${mm} · ${sun.up ? 'sun up' : 'night'}`;
  $('#dMonth').value = String(mo);
  $('#dWx').textContent = `wx: ${wxName}`;
}

// ------------------------------------------------------------- menu
const items = [...document.querySelectorAll('#menu button')];
let sel = 0, page = 'menu';
function select(i) { sel = (i + items.length) % items.length; items.forEach((b, j) => b.classList.toggle('sel', j === sel)); }
select(0);
items.forEach((b, i) => { b.addEventListener('pointerenter', () => select(i)); b.addEventListener('click', () => { select(i); activate(); }); });
let toastT = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1800); }
function activate() {
  const id = items[sel].dataset.id;
  if (id === 'profile') openProfiles();
  else if (id === 'enter') toast('Enter MUME — would connect (not in mockup)');
  else toast(`${items[sel].textContent.trim()} — not in mockup`);
}

const PROFILES = [
  { nm: 'Gibur', ch: 'Gibur', sub: 'warrior · 41 scripts', lu: 'tonight, 21:14' },
  { nm: 'Taube — healer', ch: 'Taube', sub: 'cleric · 18 scripts', lu: 'yesterday' },
  { nm: 'Morwen', ch: 'Morwen', sub: 'ranger · 27 scripts', lu: '4 days ago' },
  { nm: 'Clean slate', ch: '—', sub: 'no scripts', lu: '3 weeks ago' },
];
let psel = 0, pactive = 0;
const rowsEl = $('#rows');
PROFILES.forEach((p, i) => {
  const r = document.createElement('div'); r.className = 'row';
  r.innerHTML = `<svg class="act"><use href="#star4"/></svg><span class="nm">${p.nm}</span><span class="ch">${p.ch}<small>${p.sub}</small></span><span class="lu">${p.lu}</span>`;
  r.addEventListener('pointerenter', () => pSelect(i)); r.addEventListener('click', () => pSelect(i));
  r.addEventListener('dblclick', () => setActive(i));
  rowsEl.appendChild(r);
});
const rowEls = [...rowsEl.querySelectorAll('.row')];
function pSelect(i) { psel = (i + rowEls.length) % rowEls.length; rowEls.forEach((r, j) => r.classList.toggle('sel', j === psel)); }
function setActive(i) { pactive = i; rowEls.forEach((r, j) => r.classList.toggle('active', j === pactive)); toast(`${PROFILES[i].nm} is now the active profile`); }
pSelect(0); rowEls[0].classList.add('active');
document.querySelectorAll('.actions button').forEach((b) => b.addEventListener('click', () => toast(`${b.dataset.a} — not in mockup`)));
function openProfiles() { page = 'profile'; document.body.classList.add('sub'); }
function closeSub() { page = 'menu'; document.body.classList.remove('sub'); items[sel].focus({ preventScroll: true }); }
$('#back').addEventListener('click', closeSub);

addEventListener('keydown', (e) => {
  if (e.target instanceof HTMLSelectElement || e.target instanceof HTMLInputElement) return;
  const k = e.key;
  if (page === 'menu') {
    if (k === 'ArrowDown') { select(sel + 1); e.preventDefault(); }
    else if (k === 'ArrowUp') { select(sel - 1); e.preventDefault(); }
    else if (k === 'Enter' || k === ' ') { activate(); e.preventDefault(); }
  } else {
    if (k === 'Escape' || k === 'Backspace') { closeSub(); e.preventDefault(); }
    else if (k === 'ArrowDown') { pSelect(psel + 1); e.preventDefault(); }
    else if (k === 'ArrowUp') { pSelect(psel - 1); e.preventDefault(); }
    else if (k === 'Enter' || k === ' ') { setActive(psel); e.preventDefault(); }
    else { const m = { n: 'New', e: 'Edit', i: 'Import', x: 'Export', d: 'Delete' }[k.toLowerCase()]; if (m) toast(`${m} — not in mockup`); }
  }
});

// ------------------------------------------------------------- demo panel
let demoDragging = false;
MONTHS.forEach((m, i) => { const o = document.createElement('option'); o.value = String(i); o.textContent = `${m}${WINTER.has(i) ? ' ❄' : ''}`; $('#dMonth').appendChild(o); });
PHASES.forEach((p, i) => { const o = document.createElement('option'); o.value = String(i); o.textContent = p; $('#dMoon').appendChild(o); });
$('#dWeather').value = wxMode; $('#dFast').checked = fast;
if (moonOverride !== null) $('#dMoon').value = String(moonOverride);
$('#dTime').addEventListener('input', (e) => { demoDragging = true; setHour(+e.target.value); });
$('#dTime').addEventListener('change', () => { demoDragging = false; });
$('#dMonth').addEventListener('change', (e) => setMonth(+e.target.value));
$('#dWeather').addEventListener('change', (e) => { wxMode = e.target.value; });
$('#dMoon').addEventListener('change', (e) => { moonOverride = e.target.value === 'auto' ? null : +e.target.value; });
$('#dFast').addEventListener('change', (e) => { fast = e.target.checked; });
$('#dNow').addEventListener('click', () => { offset = 0; fast = false; $('#dFast').checked = false; wxMode = 'auto'; $('#dWeather').value = 'auto'; moonOverride = null; $('#dMoon').value = 'auto'; });
$('#dToggle').addEventListener('click', () => $('#demo').classList.toggle('open'));
if (Q.get('panel') === '1') $('#demo').classList.add('open');

// favicon: the mark, heavier strokes on a night-blue tile
function markSvg(size) {
  const sw = size <= 16 ? 3.4 : size <= 32 ? 2.4 : 1.4;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="${size}" height="${size}"><rect width="64" height="64" rx="14" fill="#0b1328"/><g fill="none" stroke="#dfe7f7" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"><path d="M8 58 Q32 47 56 58"/><path d="M27.4 53 L29.4 24 M36.6 53 L34.6 24"/><path d="M26.6 24 H37.4 V18.5 H34.8 V21 H29.2 V18.5 H26.6 Z"/></g><path fill="#ffe7b8" d="M32 1 L33.7 8.3 L41 10 L33.7 11.7 L32 18 L30.3 11.7 L23 10 L30.3 8.3 Z"/></svg>`;
}
const favUrl = (s) => 'data:image/svg+xml,' + encodeURIComponent(markSvg(s));
$('#favicon').href = favUrl(32); $('#fav16').src = favUrl(16); $('#fav16b').src = favUrl(16); $('#fav32').src = favUrl(32);

if (Q.get('page') === 'profile') openProfiles();
addEventListener('resize', resize);
document.addEventListener('visibilitychange', () => { last = performance.now(); });
resize();
requestAnimationFrame((t) => { last = t; frame(t); });
</script>
</body>
</html>
