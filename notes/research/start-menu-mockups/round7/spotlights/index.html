<title>Spotlights · runda 7</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap">
<style>
/* Round 7 Spotlights review: tabs over the live mockups (spotlights-a/b/c.html) plus their key states. Same frame as round 6's review page: a slim switcher bar over a full-bleed live mockup. */
:root {
  --night: #0d1014;
  --iron: #1b2026;
  --rule: #2e353e;
  --text: #dfe3e8;
  --dim: #8d97a3;
  --lamp: #f0b45c;
  --display: "Cinzel", Georgia, serif;
  --body: "Cormorant Garamond", Georgia, serif;
  --ui: system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
body { background: var(--night); color: var(--text); font-family: var(--ui); display: flex; flex-direction: column; }
header {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--iron); border-bottom: 1px solid var(--rule);
}
h1 { font: 700 15px/1 var(--display); letter-spacing: .12em; margin: 0; color: var(--lamp); white-space: nowrap; }
nav { display: flex; flex-wrap: wrap; gap: 6px; }
nav button {
  font: 500 14px/1 var(--display); letter-spacing: .06em; color: var(--dim);
  background: transparent; border: 1px solid var(--rule); border-radius: 3px;
  padding: 8px 12px; cursor: pointer;
}
nav button:hover { color: var(--text); }
nav button[aria-selected="true"] { color: var(--night); background: var(--lamp); border-color: var(--lamp); }
nav button:focus-visible, a:focus-visible, select:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
.states { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--dim); }
.states select { font: 500 13px/1 var(--ui); color: var(--text); background: var(--night); border: 1px solid var(--rule); border-radius: 3px; padding: 6px 8px; }
.note { flex: 1 1 100%; order: 5; min-width: 0; margin: 0; font: italic 500 15.5px/1.3 var(--body); color: var(--dim); }
.note b { font-style: normal; color: var(--text); font-weight: 500; }
a.full { font-size: 13px; color: var(--lamp); white-space: nowrap; }
main { flex: 1; min-height: 0; position: relative; }
iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
</style>

<header>
  <h1>Spotlights · runda 7</h1>
  <nav role="tablist" id="tabs"></nav>
  <label class="states">Läge <select id="state" aria-label="Läge"></select></label>
  <p class="note" id="note"></p>
  <a class="full" id="full" target="_blank" rel="noopener">Öppna i helfönster ↗</a>
</header>
<main><iframe id="frame" title="Mockup"></iframe></main>

<script>
const COMMON = ' Tangenterna som i dag (← → föregående/nästa, Skift+← → ±10 s, Mellanslag, 1–6, ↑↓ i paus, Esc). Läge-listan visar tillstånden direkt.';
const STATES = [
  ['', 'Från startmenyn (välj Spotlights)'],
  ['open', 'Spelar (som vid start)'],
  ['open&at=3&pause', 'Pausad med markörrad'],
  ['open&at=2&filter', 'Filtret öppet'],
  ['open&at=6&display', 'Display öppen'],
  ['open&none', 'Inget passerar filtret'],
  ['open&end', 'Slut på rullen'],
  ['filtered', 'Filtrerad startsida'],
  ['empty', 'Inga data'],
  ['error', 'Laddningsfel (välj Spotlights)'],
];
const DIRS = [
  { id: 'a', file: 'spotlights-a.html', name: 'A Biografduken',
    note: '<b>A · Biografduken.</b> Rullen spelar nästan i helfönster över himlen. Lådan är bara en tunn järnram; fönstret är klart upptill så himlen syns bakom ett stort titelkort (typ, etikett, karaktär och datum, nedräkningen som en ornamentlinje som krymper in mot en romb vid ögonblicket) och mörknar nedåt där speltexten går. Kontrollerna (ett vågrätt spår med en ikon per spotlight och kontrollraden) göms medan den spelar, som i dag; Filter är en glaslåda, Display en popover. Filtrerad/tom = en normal låda under ordmärket med inställningarna i rad. Prova: Spotlights i menyn, rör musen, F och D, Esc.' },
  { id: 'b', file: 'spotlights-b.html', name: 'B Galleriet',
    note: '<b>B · Galleriet.</b> Spotlights öppnar på en vägg av kort i stora lådan i stället för att spela direkt: ett kort per spotlight i rullens ordning med typ, etikett, karaktär och en "stillbild" av speltexten vid ögonblicket i riktiga färger. Inställningarna är filterraden ovanför (typ-chips med ikoner, karaktärer, period), så filtrerad och tom är bara väggen som säger det. Enter eller dubbelklick på ett kort (eller P Spela alla) öppnar rullen i en visare som växer ut ur kortet och fortsätter genom resten; Esc tillbaka till väggen. Prova piltangenterna på väggen, chipsen, Enter.' },
  { id: 'c', file: 'spotlights-c.html', name: 'C Scen och programblad',
    note: '<b>C · Scen och programblad.</b> Mellanvägen: rullen spelar direkt som i dag men allt syns i stora lådan. Till vänster scenen: titelraden med nedräkningen under och speltexten i en mörk brunn med dagens lodräta spår vid högerkanten. Till höger programbladet: inställningarna hopfällda som i dagens kort (Kinds, Characters, Period) och rullens körordning där aktuell rad lyser med sin framdrift; klick hoppar dit. Inget passerar = samma sida med tom scen och inställningarna utfällda (den filtrerade startsidan går upp i den). Mobil: programbladet blir ett ark (Programme).' },
];
const tabs = document.getElementById('tabs');
const frame = document.getElementById('frame');
const note = document.getElementById('note');
const full = document.getElementById('full');
const state = document.getElementById('state');
state.innerHTML = STATES.map(([q, l], i) => `<option value="${i}">${l}</option>`).join('');
let cur = DIRS[0];
function load() {
  const [q] = STATES[+state.value];
  const extra = q === 'error' ? '?error&sel=4' : q === '' ? '?sel=4' : '?' + q;
  const url = cur.file + extra;
  frame.src = url; full.href = url;
}
function show(id) {
  cur = DIRS.find((x) => x.id === id) || DIRS[0];
  note.innerHTML = cur.note + COMMON;
  for (const b of tabs.children) b.setAttribute('aria-selected', String(b.dataset.id === cur.id));
  if (location.hash.slice(1) !== cur.id) history.replaceState(null, '', '#' + cur.id);
  load();
  frame.focus();
}
for (const d of DIRS) {
  const b = document.createElement('button');
  b.role = 'tab'; b.dataset.id = d.id; b.textContent = d.name;
  b.onclick = () => show(d.id);
  tabs.append(b);
}
state.addEventListener('change', () => { load(); frame.focus(); });
addEventListener('hashchange', () => show(location.hash.slice(1)));
show(location.hash.slice(1));
</script>
