<!doctype html>
<!--
  Round 7 · About · B "Flikarna" (a reference with tabs).
  The large box. The wordmark glides into the box's head, left (with COCKPIT, a little larger than the
  corner mark), the tabs beside it, and the "M" seal with the version at the right. The real text is
  sorted into four tabs that use the width of the big box instead of one long column:
    About            the intro, MUME, Built for PvP (the two links as glass plates)
    Getting started  Getting started, What is inside (six cards), Settings, Lua scripts
    Credits          the seven credits as cards
    Licence          the licence text and the third-party notices (new)
  Keys: ←/→ or the letters A G C L switch tabs; ↑↓ PgUp PgDn Space Home End scroll (as today); Esc back.
  Phone: the mark sits small above the tabs, which scroll sideways; cards in one column.
  URL: ?page · ?tab=0..3
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Round 7 · About B Flikarna</title>
<link rel="stylesheet" href="../base/base.css">
<link rel="stylesheet" href="common.css">
<style>
:root { --box-top: var(--box-m); }
#page > .win { padding: 44px 26px 12px; }
.bh { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 18px; padding: 4px 4px 0; border-bottom: 1px solid var(--c-rule); }
.bh .wm { --wm-w: 190px; justify-self: start; margin-bottom: 10px; opacity: 0; }
body.landed .bh .wm { opacity: 1; }
.bh .tabs { border-bottom: 0; gap: 30px; }
.bh .tabs button { padding-bottom: 13px; font-size: 12.5px; white-space: nowrap; }
.bh .stamp { justify-self: end; display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.bh .stamp .seal { width: 30px; height: 30px; }
#body { padding: 26px 8px 30px; -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 20px); mask-image: linear-gradient(180deg, transparent 0, #000 20px); }
.tab { display: none; max-width: 1180px; margin: 0 auto; }
.tab.on { display: block; animation: tabin calc(.35s * var(--ts)) cubic-bezier(.2,.8,.2,1); }
@keyframes tabin { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.cols2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 56px; }
.tab h2 { margin: 0 0 14px; font: 700 14px/1.3 var(--display); letter-spacing: .2em; color: var(--c-head); text-shadow: 0 -1px 0 rgba(0,0,0,.9), 0 1px 0 rgba(255,226,180,.18); }
.tab h2:not(:first-child) { margin-top: 34px; }
.lead-in { font: italic 500 21px/1.55 var(--serif); color: #ecdcbc; margin: 0 0 30px; text-wrap: pretty; }
/* link plates (the Website / Discord rows of Built for PvP) */
.plates { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 6px; }
.plate { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; height: auto; padding: 12px 18px 12px 16px; text-decoration: none; }
.plate .k { font: 700 10.5px/1 var(--display); letter-spacing: .2em; color: var(--c-dim); }
.plate .v { font: 500 17px/1 var(--serif); letter-spacing: .01em; text-transform: none; color: #ecd6ab; }
.plate:hover .v, .plate:focus-visible .v { color: #fff1d8; }
/* cards (What is inside, Credits) */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.card { padding: 16px 18px 14px; border-radius: 6px; background: var(--row); box-shadow: var(--row-sh); }
.card dt { font: 700 12px/1 var(--display); letter-spacing: .2em; text-transform: uppercase; color: var(--c-accent); margin-bottom: 9px; }
.card dd { margin: 0; font: 500 17px/1.5 var(--serif); color: var(--c-text); text-wrap: pretty; }
.lic { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 26px; align-items: start; max-width: 860px; }
.lic .seal { width: 78px; height: 78px; margin-top: 4px; }
.notices { max-width: 980px; margin-top: 30px; }
@media (max-width: 1100px) { .bh .tabs { gap: 20px; } .bh .wm { --wm-w: 150px; } }
@media (max-width: 900px) {
  .bh { grid-template-columns: auto 1fr; }
  .bh .tabs { grid-column: 1 / -1; grid-row: 2; }
  .bh .wm { margin-bottom: 4px; }
  .cols2 { grid-template-columns: 1fr; }
}
@media (max-width: 600px) {
  #page > .win { padding: 42px 10px 8px; }
  .bh { gap: 6px 10px; }
  .bh .wm { --wm-w: 128px; }
  .bh .stamp { margin-bottom: 6px; }
  .bh .stamp .seal { width: 24px; height: 24px; }
  .bh .tabs { gap: 18px; }
  .bh .tabs button { font-size: 11.5px; letter-spacing: .14em; }
  #body { padding: 18px 4px 20px; }
  .lead-in { font-size: 19px; }
  .cards { grid-template-columns: 1fr; }
  .lic { grid-template-columns: 1fr; }
  .lic .seal { width: 56px; height: 56px; }
}
</style>
</head>
<body>
<section class="lp box-large pgbox" id="page" data-hood="About" data-back aria-label="About">
  <div class="win">
    <div class="box-head bh">
      <div class="wm" id="wmIn" aria-label="MUME Cockpit"></div>
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="stamp"><img class="seal" alt="The M mark" id="seal"><span class="ver">${v}</span></div>
    </div>
    <div class="box-body" id="body"></div>
  </div>
</section>
<script src="about-text.js"></script>
<script src="notices.js"></script>
<script src="../base/base.js"></script>
<script src="common.js"></script>
<script>
const S = Object.fromEntries(PG.about().map((s) => [s.id, s])), esc = PG.esc, body = document.getElementById('body'), tabsEl = document.getElementById('tabs');
document.getElementById('seal').src = PG.SEAL;
document.querySelector('.stamp .ver').textContent = `${PG.VERSION} (${PG.COMMIT})`;
const h2 = (s) => `<h2>${esc(s.title)}</h2>`;
const paras = (s) => s.blocks.filter((b) => b.p).map((b) => `<p class="ab-p">${PG.linked(b.p)}</p>`).join('');
const kv = (s) => s.blocks.filter((b) => b.kv).flatMap((b) => b.kv);
const cards = (rows) => `<dl class="cards">${rows.map(([k, v]) => `<div class="card"><dt>${esc(k)}</dt><dd>${PG.linked(v)}</dd></div>`).join('')}</dl>`;
const plates = (rows) => `<div class="plates">${rows.map(([k, v]) => `<a class="ibtn plate" href="https://${v}" target="_blank" rel="noopener noreferrer"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></a>`).join('')}</div>`;
const TABS = [
  { name: 'About', sk: 'A', html: `<p class="lead-in">${PG.linked(S.intro.blocks[0].p)}</p>
      <div class="cols2"><div>${h2(S.mume)}${paras(S.mume)}</div><div>${h2(S.pvp)}${paras(S.pvp)}${plates(kv(S.pvp))}</div></div>` },
  { name: 'Getting started', sk: 'G', html: `<div class="cols2"><div>${h2(S.start)}${paras(S.start)}</div><div>${h2(S.settings)}${paras(S.settings)}${h2(S.lua)}${paras(S.lua)}</div></div>
      <h2 style="margin-top:34px">${esc(S.inside.title)}</h2>${cards(kv(S.inside))}` },
  { name: 'Credits', sk: 'C', html: `${h2(S.credits)}${cards(kv(S.credits))}` },
  { name: 'Licence', sk: 'L', html: `<div class="lic"><img class="seal" src="${PG.SEAL}" alt=""><div>${h2(S.licence)}${paras(S.licence)}</div></div>
      <section class="notices"><h2 style="margin-top:34px">${PG.NOTICES_META.title}</h2>${PG.notices()}</section>` },
];
tabsEl.innerHTML = TABS.map((t, i) => `<button role="tab" data-i="${i}" aria-selected="false">${PG.sk(t.name, t.sk)}</button>`).join('');
body.innerHTML = TABS.map((t, i) => `<div class="tab" role="tabpanel" data-i="${i}">${t.html}</div>`).join('');
let cur = -1;
function tab(i) {
  i = (i + TABS.length) % TABS.length; if (i === cur) return; cur = i;
  tabsEl.querySelectorAll('button').forEach((b, k) => b.setAttribute('aria-selected', String(k === i)));
  body.querySelectorAll('.tab').forEach((t, k) => t.classList.toggle('on', k === i));
  body.scrollTop = 0;
  const b = tabsEl.children[i]; b && b.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}
tabsEl.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) tab(+b.dataset.i); });
tab(+(PG.qs.get('tab') || 0));
const app = PG.boot({
  key: 'about', box: document.getElementById('page'), mode: 'into', into: document.getElementById('wmIn'),
  layer: {
    key(e) {
      if (e.key === 'ArrowRight') { tab(cur + 1); return true; }
      if (e.key === 'ArrowLeft') { tab(cur - 1); return true; }
      const page = body.clientHeight * .85;
      const step = { ArrowDown: 40, ArrowUp: -40, PageDown: page, PageUp: -page, ' ': page, Enter: page }[e.key];
      if (step) { body.scrollBy({ top: step, behavior: WC.RM ? 'auto' : 'smooth' }); return true; }
      if (e.key === 'Home') { body.scrollTo({ top: 0, behavior: 'smooth' }); return true; }
      if (e.key === 'End') { body.scrollTo({ top: body.scrollHeight, behavior: 'smooth' }); return true; }
      return WC.shortcut(e, Object.fromEntries(TABS.map((t, i) => [t.sk.toLowerCase(), () => tab(i)])));
    },
  },
});
</script>
</body>
</html>
