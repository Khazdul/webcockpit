<title>Ordmärke runda 6</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap">
<style>
/* Round 6 wordmark review: tabs over logo-1/2/3.html (round 5 quote A with only the MUME wordmark changed). Layout: a slim switcher bar over a full-bleed live mockup frame. Single dark look on purpose. */
:root {
  --night: #0d1014;
  --iron: #1b2026;
  --rule: #2e353e;
  --text: #dfe3e8;
  --dim: #8d97a3;
  --lamp: #f0b45c;
  --display: "Cinzel", Georgia, serif;
  --body: "Cormorant Garamond", Georgia, serif;
  --ui: system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--night); color: var(--text); font-family: var(--ui); display: flex; flex-direction: column; }
header {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--iron); border-bottom: 1px solid var(--rule);
}
h1 { font: 700 15px/1 var(--display); letter-spacing: .12em; margin: 0; color: var(--lamp); white-space: nowrap; }
nav { display: flex; flex-wrap: wrap; gap: 6px; }
nav button {
  font: 500 14px/1 var(--display); letter-spacing: .06em; color: var(--dim);
  background: transparent; border: 1px solid var(--rule); border-radius: 3px;
  padding: 8px 12px; cursor: pointer;
}
nav button:hover { color: var(--text); }
nav button[aria-selected="true"] { color: var(--night); background: var(--lamp); border-color: var(--lamp); }
nav button:focus-visible, a:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
.note { flex: 1 1 320px; min-width: 0; font: italic 500 16px/1.3 var(--body); color: var(--dim); }
.note b { font-style: normal; color: var(--text); font-weight: 500; }
a.full { font-size: 13px; color: var(--lamp); white-space: nowrap; }
main { flex: 1; min-height: 0; position: relative; }
iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
</style>

<header>
  <h1>Ordmärket · runda 6</h1>
  <nav role="tablist" id="tabs"></nav>
  <p class="note" id="note"></p>
  <a class="full" id="full" target="_blank" rel="noopener">Öppna i helfönster ↗</a>
</header>
<main><iframe id="frame" title="Mockup"></iframe></main>

<script>
const DIRS = [
  { id: '1', file: 'logo-1.html', name: '1 Graverad fåra', note: '<b>1 · Graverad fåra.</b> Samma smidda järn, kanalerna kvar men tomma: en mörk nedsänkt fåra där kanten som vetter mot solen eller månen fångar en tunn ljuslinje. Ingen glöd, inga gnistor. Nitarna är vanligt järn.' },
  { id: '2', file: 'logo-2.html', name: '2 Blankt järn', note: '<b>2 · Blankt järn.</b> Massivt polerat järn utan kanaler. En fin fasad kant som lyses från solen eller månen, en mjuk glans som vandrar med ljuset (och lite med musen), en svag spegling av himlen och en svag varm kant underifrån. Nitarna behåller en liten varm glöd.' },
  { id: '3', file: 'logo-3.html', name: '3 Inlagd metall', note: '<b>3 · Inlagd metall.</b> Lavan ersatt av inlagd metall i samma kanaler: borstad mässing på dagen, månsilver på natten (glider över i skymningen). Speglar ljuset med en glans som följer solen eller månen, men lyser aldrig själv. Nitarna är av samma metall.' },
];
const tabs = document.getElementById('tabs');
const frame = document.getElementById('frame');
const note = document.getElementById('note');
const full = document.getElementById('full');
function show(id) {
  const d = DIRS.find(x => x.id === id) || DIRS[0];
  frame.src = d.file;
  note.innerHTML = d.note + ' Allt annat är som citat A i runda 5. Demo-panelen nere till vänster styr tid, månad och väder; prova dag, skymning, natt och snö.';
  full.href = d.file;
  for (const b of tabs.children) b.setAttribute('aria-selected', String(b.dataset.id === d.id));
  if (location.hash.slice(1) !== d.id) history.replaceState(null, '', '#' + d.id);
  frame.focus();
}
for (const d of DIRS) {
  const b = document.createElement('button');
  b.role = 'tab'; b.dataset.id = d.id; b.textContent = d.name;
  b.onclick = () => show(d.id);
  tabs.append(b);
}
addEventListener('hashchange', () => show(location.hash.slice(1)));
show(location.hash.slice(1));
</script>
