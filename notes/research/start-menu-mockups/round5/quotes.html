<title>Citat runda 5</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap">
<style>
/* Round 5 quote review: tabs over quote-a/b/c.html. Layout: a slim switcher bar over a full-bleed live mockup frame. Single dark look on purpose. */
:root {
  --night: #0d1014;
  --iron: #1b2026;
  --rule: #2e353e;
  --text: #dfe3e8;
  --dim: #8d97a3;
  --lamp: #f0b45c;
  --display: "Cinzel", Georgia, serif;
  --body: "Cormorant Garamond", Georgia, serif;
  --ui: system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--night); color: var(--text); font-family: var(--ui); display: flex; flex-direction: column; }
header {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--iron); border-bottom: 1px solid var(--rule);
}
h1 { font: 700 15px/1 var(--display); letter-spacing: .12em; margin: 0; color: var(--lamp); white-space: nowrap; }
nav { display: flex; flex-wrap: wrap; gap: 6px; }
nav button {
  font: 500 14px/1 var(--display); letter-spacing: .06em; color: var(--dim);
  background: transparent; border: 1px solid var(--rule); border-radius: 3px;
  padding: 8px 12px; cursor: pointer;
}
nav button:hover { color: var(--text); }
nav button[aria-selected="true"] { color: var(--night); background: var(--lamp); border-color: var(--lamp); }
nav button:focus-visible, a:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
.note { flex: 1 1 320px; min-width: 0; font: italic 500 16px/1.3 var(--body); color: var(--dim); }
.note b { font-style: normal; color: var(--text); font-weight: 500; }
a.full { font-size: 13px; color: var(--lamp); white-space: nowrap; }
main { flex: 1; min-height: 0; position: relative; }
iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
</style>

<header>
  <h1>Citatet · runda 5</h1>
  <nav role="tablist" id="tabs"></nav>
  <p class="note" id="note"></p>
  <a class="full" id="full" target="_blank" rel="noopener">Öppna i helfönster ↗</a>
</header>
<main><iframe id="frame" title="Mockup"></iframe></main>

<script>
const DIRS = [
  { id: 'a', file: 'quote-a.html', name: 'A Fri skrift', note: '<b>A · Fri skrift.</b> Ingen bakgrund alls. Större kursiv text med en fin kontur, en tunn linje med en romb och namnet i kapitäler. Bläcket följer himlen: mörkt mot ljus dag, ljust mot skymning och natt.' },
  { id: 'b', file: 'quote-b.html', name: 'B Fotplåten', note: '<b>B · Fotplåten.</b> Citatet graverat i en smal järnplåt som hänger under panelens nederkant, med nitar och graverad kant. Glider fram under panelen. Samma i alla väder.' },
  { id: 'c', file: 'quote-c.html', name: 'C Himlaskrift', note: '<b>C · Himlaskrift.</b> Citatet lämnar menyn och ligger lågt i himlen, glest spärrat. Orden tonar fram ett i taget, står kvar några minuter och byts sedan (?qt=20 för kortare cykel).' },
];
const tabs = document.getElementById('tabs');
const frame = document.getElementById('frame');
const note = document.getElementById('note');
const full = document.getElementById('full');
function show(id) {
  const d = DIRS.find(x => x.id === id) || DIRS[0];
  frame.src = d.file;
  note.innerHTML = d.note + ' Almanackan ligger nu nere till höger. Demo-panelen nere till vänster styr tid, månad och väder.';
  full.href = d.file;
  for (const b of tabs.children) b.setAttribute('aria-selected', String(b.dataset.id === d.id));
  if (location.hash.slice(1) !== d.id) history.replaceState(null, '', '#' + d.id);
  frame.focus();
}
for (const d of DIRS) {
  const b = document.createElement('button');
  b.role = 'tab'; b.dataset.id = d.id; b.textContent = d.name;
  b.onclick = () => show(d.id);
  tabs.append(b);
}
addEventListener('hashchange', () => show(location.hash.slice(1)));
show(location.hash.slice(1));
</script>
