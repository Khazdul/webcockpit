<!doctype html>
<!--
  Round 2 · 04 "Forest edge" (Skogsbrynet) — looking out from under the trees

  Idea: the base page (menu, wordmark, sky, weather director, profile, demo) seen from the
  edge of a dark wood. Great maple trunks and a deep forest frame the left and right; their
  canopies hang over the top corners and move in the wind, cluster by cluster, each painted
  from small maple leaves in four tones (lit outer leaves, shaded interior). Between them the
  valley opens over meadows and far groves to one great mountain, marched as a heightfield and
  wrapped in blue distance. At its foot, right of the menu, the gate: a small round arch of
  moon-silver lines under a crown of five faint stars; invisible by day, softly lit at night,
  and under a bright moon a thin seam of light climbs the rock above it. Maple leaves in
  autumn, in reds (scarlet, crimson, vermilion, wine, amber), drop from the canopies and
  tumble or spin down. Winter: bare maples with snow, the spruces behind them stay dark.
  Selection: a small ember glides softly to the chosen row, a fainter afterglow trailing it.
  Cost to build for real: medium-high (scene ~600 lines incl. the march, forest frame ~200,
  canopy painter ~120, leaves ~120; the rest is the shared base). Risks: canopy repaint on
  relight (~6 ms) and the march time on resize; both cacheable.

  ============================================================================================
  HOW TO MAKE A VARIANT
  1. Copy this file to round2/NN-name.html. Change <title> and this comment (name, idea, cost).
  2. Replace the SCENE module (JS, between "SCENE ▼" and "SCENE ▲"). Its contract:
       SCENE.build(env)      on load and on resize (env.W / env.H / env.DPR are set). Generate
                             geometry and allocate caches here.
       SCENE.relight(env)    when light, season or weather changed noticeably (throttled by the
                             loop, ~2.5×/s, faster in fast time). Re-render cached layers here.
       SCENE.draw(ctx, env)  every frame, after SKY, LIFE.drawSky and WEATHER.drawBack, before
                             LIFE.drawNear and WEATHER.drawFront. ctx is in CSS px. Apply mouse
                             parallax yourself: offset = -env.par.x * 28 * depth (0 far … 1 near).
       SCENE.skylineAt(x)    y of the far skyline at x (lightning strikes it). Optional.
       SCENE.groundAt(x)     y of the near ground at x (fireflies hover above it). Optional.
       SCENE.focus()         {x, y}: where the camera zooms on "Enter MUME". Optional.
     Read the world only from `env` (see ENV below): time, sun/moon, light, sky colours,
     season, weather intensities, wind (env.wind, env.swayAt(x, phase)), parallax, flash.
  3. Optionally replace LIFE (birds, fireflies, leaves, blossom): build / update / drawSky /
     drawNear, same env contract. Keep "never several loud effects at once" (use env.busy).
  4. Replace the selection style: the CSS block "SELECTION STYLE ▼…▲" and the JS object
     SELECTION (called on every move; the base style needs no JS).
  5. Leave TIME, ENV, SKY, WEATHER, WORDMARK, MENU, PROFILE and DEMO alone unless the variant
     is about them. Screenshot with the URL params below.
  URL params: t=hour(0-24) m=month(0-11) s=season(0-3) w=auto|clear|fair|clouds|rain|storm|snow|fog
              p=moon phase(0-7) sel=item page=profile demo fast rm q=quote-index
              ts=terrain seed (base scene, default 11) bolt (freeze a lightning flash)
  ============================================================================================
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MUME Cockpit — round 2 · 04 Forest edge</title>
<link rel="icon" id="favicon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cormorant+Garamond:ital,wght@1,400;1,500&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --lamp: #ffcf8f; --lamp-hot: #ffe8c2; --ember: #ff7a1a;
  --iron: #2a2622; --iron-hi: #5d544a; --iron-lo: #110f0e;
  --text: #eadcc3; --dim: #9a8b76; --faint: #6d6252;
  --display: 'Cinzel', 'Times New Roman', serif;
  --serif: 'Cormorant Garamond', Georgia, serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
  --grain: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #020306; color: var(--text); overflow: hidden; }
body { font-family: var(--serif); -webkit-font-smoothing: antialiased; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block;
  transform-origin: var(--ox, 50%) var(--oy, 70%); transition: transform 1.8s cubic-bezier(.6,0,.25,1), filter 1.8s;
  opacity: 0; animation: fadein 2.2s .1s ease-out forwards; }
body.journey #scene { transform: scale(1.18); filter: brightness(1.08); }
@keyframes fadein { to { opacity: 1; } }
.vignette { position: fixed; inset: 0; pointer-events: none;
  background: radial-gradient(130% 95% at 50% 42%, transparent 52%, rgba(0,0,0,.55) 100%),
              linear-gradient(180deg, rgba(0,0,0,.22), transparent 18%); }
.grain { position: fixed; inset: -60px; pointer-events: none; background-image: var(--grain); opacity: .06;
  mix-blend-mode: overlay; animation: grain 1s steps(5) infinite; }
@keyframes grain { 0%{transform:translate(0,0)} 20%{transform:translate(-23px,11px)} 40%{transform:translate(17px,-29px)} 60%{transform:translate(-9px,31px)} 80%{transform:translate(29px,7px)} }

/* ================================================================ layout */
#stage { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
  padding: clamp(18px, 5.2vh, 70px) 16px 0; pointer-events: none; transition: opacity 1s; }
#stage > * { pointer-events: auto; }
body.journey #stage { opacity: 0; }

/* ================================================================ wordmark */
#brand { display: flex; flex-direction: column; align-items: center; transform-origin: 50% 0;
  transition: transform .8s cubic-bezier(.3,.9,.25,1); opacity: 0; animation: appear 1.6s .5s ease-out forwards; }
@keyframes appear { to { opacity: 1; } }
body.sub #brand { transform: scale(.62) translateY(-14px); }
#wordmark { display: block; width: clamp(290px, 40vw, 660px); }
.cockpit { display: flex; align-items: center; gap: .9em; margin-top: calc(clamp(290px, 40vw, 660px) * -.035);
  font: 600 clamp(11px, 1.05vw, 16px)/1 var(--display); letter-spacing: .95em; padding-left: .95em; color: #f0dcb8;
  text-shadow: 0 0 10px rgba(255,150,60,.45), 0 1px 2px #000, 0 0 18px rgba(0,0,0,.9); }
.cockpit .rule { width: clamp(36px, 6vw, 110px); height: 3px; position: relative;
  background: linear-gradient(90deg, transparent, #4d433a 30%, #6b5d50); border-radius: 2px; box-shadow: 0 1px 0 #000; }
.cockpit .rule.r { transform: scaleX(-1); }
.cockpit .rule::after { content: ""; position: absolute; right: -3px; top: -2px; width: 7px; height: 7px; border-radius: 50%;
  background: radial-gradient(circle at 45% 40%, #ffe3b0, #ff8a2a 45%, #6b2a08 75%); box-shadow: 0 0 6px rgba(255,138,42,.7); }

@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* ================================================================ the lantern panel (Lykta family) */
.lp { position: relative; padding: 7px; border-radius: 5px; border: 1px solid #000;
  background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,0) 30%, rgba(0,0,0,.22)), var(--grain), var(--iron);
  background-size: auto, 160px 160px, auto;
  box-shadow: inset 1px 1px 0 rgba(130,116,100,.55), inset -1px -1px 0 var(--iron-lo),
              0 0 46px -8px rgba(255,170,90,.24), 0 30px 80px -12px rgba(0,0,0,.85); }
.lp .br { position: absolute; width: 24px; height: 24px; z-index: 4;
  background: radial-gradient(circle at 3.5px 3.5px, #fff1d6 0 1px, #ffb35c 1.3px, #1a1412 1.9px 2.6px, transparent 3.1px) 0 0 / 7px 7px no-repeat,
              radial-gradient(circle at 3.5px 3.5px, #1a1412 0 1.2px, transparent 1.8px) 17px 0 / 7px 7px no-repeat,
              radial-gradient(circle at 3.5px 3.5px, #1a1412 0 1.2px, transparent 1.8px) 0 17px / 7px 7px no-repeat,
              linear-gradient(135deg, #6f655a, var(--iron) 75%);
  clip-path: polygon(0 0, 100% 0, 100% 7px, 7px 7px, 7px 100%, 0 100%);
  box-shadow: inset 1px 1px 0 rgba(255,255,255,.2); }
.lp .b1 { top: -1px; left: -1px; } .lp .b2 { top: -1px; right: -1px; transform: scaleX(-1); }
.lp .b3 { bottom: -1px; left: -1px; transform: scaleY(-1); } .lp .b4 { bottom: -1px; right: -1px; transform: scale(-1,-1); }
.lp .hood { position: absolute; z-index: 5; top: -1px; left: 50%; transform: translateX(-50%); height: 27px; padding: 0 26px;
  display: flex; align-items: center; gap: 8px; border-radius: 0 0 13px 13px; white-space: nowrap;
  background: linear-gradient(180deg, rgba(255,255,255,.09), rgba(0,0,0,.18)), var(--grain), var(--iron); background-size: auto, 160px 160px, auto;
  box-shadow: inset 0 -1px 0 var(--iron-hi), 0 0 0 1px #000, 0 3px 10px rgba(0,0,0,.6); }
.lp .hood::before, .lp .hood::after { content: ""; position: absolute; top: 10px; width: 5px; height: 5px; border-radius: 50%;
  background: #1a1513; box-shadow: inset 0 1px 0 rgba(0,0,0,.7), 0 1px 0 var(--iron-hi); }
.lp .hood::before { left: 9px; } .lp .hood::after { right: 9px; }
.lp .hood .t { font: 700 14px/1 var(--display); letter-spacing: .14em; padding-top: 2px; color: #ffe6bf;
  text-shadow: 0 0 5px rgba(255,200,120,.9), 0 0 14px rgba(255,150,60,.5); }
.lp .hood svg { width: 20px; height: 20px; filter: drop-shadow(0 0 3px rgba(255,160,60,.6)); }
.lp .win { position: relative; border: 1px solid #000; border-radius: 2px; padding: 32px 12px 12px; overflow: hidden;
  background:
    radial-gradient(55% 70px at 50% 0, rgba(255,207,143,.14), transparent),
    radial-gradient(130% 90% at 50% 30%, rgba(255,207,143,.08), rgba(255,207,143,.03) 60%, transparent 90%),
    rgba(14,11,9,.58);
  -webkit-backdrop-filter: blur(9px) saturate(1.1); backdrop-filter: blur(9px) saturate(1.1);
  box-shadow: inset 0 0 0 1px rgba(255,207,143,.10), inset 0 0 40px rgba(0,0,0,.65); }

/* ================================================================ MENU (panel + items) */
#menuPanel { width: min(360px, calc(100vw - 32px)); margin-top: clamp(14px, 2.6vh, 30px);
  opacity: 0; animation: rise 1.4s .9s cubic-bezier(.2,.8,.2,1) forwards;
  transition: opacity .45s, transform .55s cubic-bezier(.3,.9,.25,1), filter .45s; }
body.sub #menuPanel { opacity: 0 !important; transform: scale(.94) translateY(20px); filter: blur(6px); pointer-events: none; animation: none; }
.menu { list-style: none; margin: 0; padding: 0; position: relative; z-index: 1; }
.item { position: relative; z-index: 2; display: flex; align-items: center; gap: 14px; height: 42px; padding: 0 18px;
  font: 600 15.5px/1 var(--display); letter-spacing: .17em; color: #b2a288; cursor: pointer; user-select: none;
  transition: color .45s, text-shadow .45s; }
.item .ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; opacity: .65; transition: opacity .45s, filter .45s, color .45s; }
.item .ctx { font: italic 500 14px/1 var(--serif); letter-spacing: .02em; color: var(--faint); opacity: .75; margin-left: -4px; transition: color .45s, opacity .45s; }
.item .key { margin-left: auto; font: 400 10px/1 var(--mono); letter-spacing: 0; color: var(--faint); opacity: 0; transition: opacity .45s; }
.item.prime { height: 56px; gap: 16px; font-size: 20px; font-weight: 700; letter-spacing: .1em; color: #d6bf96; }
.item.prime .ic { width: 22px; height: 22px; stroke-width: 1.5; }
.sep { height: 13px; margin: 2px 8px 4px; position: relative; list-style: none; }
.sep::before { content: ""; position: absolute; left: 0; right: 0; top: 6px; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,200,130,.24) 30%, rgba(255,200,130,.24) 70%, transparent); }
.sep::after { content: ""; position: absolute; left: 50%; top: 3px; width: 7px; height: 7px; margin-left: -3.5px; transform: rotate(45deg);
  background: linear-gradient(135deg, #7a6a58, #2a2420); box-shadow: 0 0 0 1px #000, 0 0 6px rgba(255,160,70,.3); }
#menuWin { padding-bottom: 22px; }
.flash { position: absolute; left: 0; right: 0; bottom: 5px; text-align: center; pointer-events: none;
  font: italic 500 15px/1 var(--serif); color: #ffb870; text-shadow: 0 0 10px rgba(255,140,50,.6), 0 1px 2px #000; opacity: 0; transition: opacity .3s; white-space: nowrap; }
.flash.show { opacity: 1; }

/* ================================================================ SELECTION STYLE ▼
   04: a small ember glides softly to the chosen row (left of its icon), a fainter afterglow
   trailing it; the chosen text and icon brighten. Profile rows keep the base's lit lantern. */
.ember, .ember-tail { position: absolute; left: 3px; top: 0; width: 22px; height: 22px; margin: -11px 0 0 -11px; pointer-events: none; z-index: 3;
  will-change: transform; }
.ember { transition: transform .62s cubic-bezier(.33,.0,.2,1); }
.ember-tail { transition: transform 1.05s cubic-bezier(.4,0,.2,1); opacity: .5; }
.ember::before, .ember-tail::before { content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,170,80,.55), rgba(255,110,30,.18) 40%, transparent 70%); }
.ember::after { content: ""; position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px; border-radius: 50%;
  background: radial-gradient(circle at 45% 40%, #fff6dc, #ffc062 45%, #ff7a1a 80%);
  box-shadow: 0 0 4px 1px rgba(255,150,60,.9), 0 0 10px 2px rgba(255,100,30,.45); animation: ember-breathe 2.6s ease-in-out infinite; }
.ember-tail::before { background: radial-gradient(circle, rgba(255,140,60,.4), transparent 60%); }
@keyframes ember-breathe { 0%,100% { transform: scale(1); opacity: 1; } 45% { transform: scale(.82); opacity: .82; } 60% { transform: scale(1.08); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .ember::after { animation: none; } }
.ember.rm::after { animation: none; }
.item.on { color: #f8e7c8; text-shadow: 0 0 10px rgba(255,170,90,.3), 0 1px 1px rgba(0,0,0,.6); transition-duration: .3s; }
.item.on .ic { opacity: 1; color: #ffd9a2; filter: drop-shadow(0 0 3px rgba(255,160,70,.5)); transition-duration: .3s; }
.item.on .ctx { color: var(--dim); }
.item.on .key { opacity: .6; }
.prow::before { content: ""; position: absolute; inset: 0; border-radius: 5px; pointer-events: none;
  background: radial-gradient(22% 120% at 4% 50%, rgba(255,178,96,.16), transparent 80%), linear-gradient(90deg, rgba(255,200,140,.06), transparent 70%);
  opacity: 0; transition: opacity .8s ease-out; }
.prow.on::before { opacity: 1; transition: opacity .3s ease-out; }
.prow.on { color: #f8e7c8; box-shadow: inset 0 1px 0 rgba(255,220,170,.22), inset 0 0 0 1px rgba(255,200,130,.10), 0 1px 3px rgba(0,0,0,.5); }
.prow.on .pn { text-shadow: 0 0 10px rgba(255,180,100,.35); }
/* SELECTION STYLE ▲ */

/* ================================================================ quote */
#quote { margin: clamp(8px, 2vh, 24px) 0 0; max-width: 620px; padding: 10px 30px 14px; background: radial-gradient(closest-side, rgba(4,3,2,.5), rgba(4,3,2,.22) 60%, transparent); text-align: center; opacity: 0; animation: rise 1.6s 1.3s ease-out forwards; transition: opacity .5s; }
body.sub #quote { opacity: 0 !important; animation: none; }
#quote p { margin: 0; font: italic 400 clamp(17px, 1.45vw, 22px)/1.35 var(--serif); color: rgba(244,232,210,.92);
  text-shadow: 0 1px 2px #000, 0 0 16px rgba(0,0,0,.95), 0 0 30px rgba(0,0,0,.6); }
#quote cite { display: block; margin-top: 8px; font: 600 10.5px/1 var(--display); letter-spacing: .3em; font-style: normal; color: #b49a75;
  text-shadow: 0 1px 2px #000, 0 0 12px #000; }

/* ================================================================ PROFILE sub-page */
#profilePanel { position: fixed; left: 50%; top: clamp(150px, 26vh, 270px); width: min(820px, calc(100vw - 32px));
  transform: translate(-50%, 24px) scale(.96); opacity: 0; pointer-events: none; filter: blur(4px);
  transition: opacity .5s .12s, transform .6s .12s cubic-bezier(.2,.9,.2,1), filter .5s .12s; }
body.sub #profilePanel { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; filter: none; }
#profilePanel .win { padding: 40px 22px 14px; }
.ph, .prow { display: grid; grid-template-columns: 34px 1.1fr 1.5fr 1.3fr 1fr; align-items: center; gap: 12px; padding: 0 14px; }
.ph { font: 600 10.5px/1 var(--display); letter-spacing: .24em; color: var(--dim); margin-bottom: 8px; }
.ph span:first-child { grid-column: 2; }
.plist { position: relative; display: flex; flex-direction: column; gap: 7px; }
.prow { position: relative; height: 58px; border-radius: 5px; cursor: pointer; color: #c2b398;
  background: linear-gradient(180deg, rgba(255,207,143,.06), rgba(255,207,143,.02));
  box-shadow: inset 0 1px 0 rgba(255,207,143,.12), inset 0 0 0 1px rgba(255,207,143,.04), 0 1px 3px rgba(0,0,0,.5);
  transition: box-shadow .5s, color .45s; }
.prow .pl { width: 26px; height: 32px; justify-self: center; --lit: 0; }
.prow.on .pl { --lit: 1; }
.prow .pn { font: 700 17px/1.1 var(--display); letter-spacing: .08em; transition: text-shadow .45s; }
.prow .pn small { display: block; margin-top: 5px; font: 600 9.5px/1 var(--display); letter-spacing: .2em; color: #c99050; }
.prow .pc { font: italic 500 16px/1.2 var(--serif); color: inherit; opacity: .9; }
.prow .pc b { font-style: normal; font-weight: 500; font-family: var(--display); font-size: 13.5px; letter-spacing: .06em; }
.prow .ps, .prow .pt { font: 400 12px/1.3 var(--mono); color: var(--dim); }
.prow.on .ps, .prow.on .pt { color: #bea582; }
.pbtns { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 18px 0 6px; }
.ibtn { position: relative; display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 18px 0 14px; border: 1px solid #000; border-radius: 4px; cursor: pointer;
  font: 700 12px/1 var(--display); letter-spacing: .16em; color: #d8c29c;
  background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(0,0,0,.2)), var(--grain), var(--iron); background-size: auto, 160px 160px, auto;
  box-shadow: inset 0 1px 0 rgba(140,124,106,.55), inset 0 -1px 0 var(--iron-lo), 0 2px 6px rgba(0,0,0,.55);
  transition: color .25s, text-shadow .25s, box-shadow .25s, transform .12s; }
.ibtn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.ibtn:hover, .ibtn:focus-visible { outline: none; color: #fff1da; text-shadow: 0 0 7px rgba(255,190,110,.8);
  box-shadow: inset 0 1px 0 rgba(255,220,170,.5), inset 0 -1px 0 var(--iron-lo), 0 0 14px -2px rgba(255,150,60,.45), 0 2px 6px rgba(0,0,0,.55); }
.ibtn:active { transform: translateY(1px); }
.ibtn.danger { color: #e3a08a; } .ibtn.danger:hover { color: #ffd2c2; text-shadow: 0 0 7px rgba(255,90,60,.9); box-shadow: inset 0 1px 0 rgba(255,170,150,.5), 0 0 18px -2px rgba(255,70,40,.55), 0 2px 6px rgba(0,0,0,.55); }
.back { position: absolute; left: 12px; top: 6px; z-index: 6; font: 600 10.5px/1 var(--display); letter-spacing: .2em; color: var(--dim); cursor: pointer; padding: 6px; background: none; border: 0; }
.back:hover { color: #ffe1b5; text-shadow: 0 0 8px rgba(255,170,80,.8); }
.pfoot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 8px 4px 0; min-height: 18px; font: 400 10.5px/1 var(--mono); color: var(--faint); }
.pfoot kbd { font: inherit; color: var(--dim); }
.pfoot .flash { position: static; width: auto; }

/* ================================================================ DEMO panel (mockup tool) */
#demo { position: fixed; left: 12px; bottom: 12px; z-index: 20; font: 400 11px/1.4 var(--mono); color: #b8ab98; }
#demo > button { font: 600 10.5px/1 var(--mono); letter-spacing: .08em; color: #a8987f; background: rgba(12,10,9,.72); border: 1px solid #3a332c;
  border-radius: 4px; padding: 6px 10px; cursor: pointer; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
#demo > button:hover { color: #ffdcab; border-color: #6b5a48; }
#demo .body { display: none; margin-bottom: 6px; width: 312px; max-height: calc(100vh - 70px); overflow: auto; padding: 10px 12px; background: rgba(12,10,9,.88); border: 1px solid #3a332c; border-radius: 5px;
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); box-shadow: 0 10px 30px rgba(0,0,0,.6); }
#demo.open .body { display: block; }
#demo label { display: grid; grid-template-columns: 62px 1fr 44px; align-items: center; gap: 6px; margin: 5px 0; }
#demo select, #demo input[type=range] { width: 100%; font: inherit; color: #e0d2bc; background: #1c1916; border: 1px solid #3a332c; border-radius: 3px; padding: 2px; accent-color: #e08a3a; }
#demo .row { display: flex; gap: 6px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
#demo .row button { font: inherit; color: #e0d2bc; background: #1c1916; border: 1px solid #3a332c; border-radius: 3px; padding: 3px 7px; cursor: pointer; }
#demo .row button.on { border-color: #b07a3a; color: #ffd9a0; }
#demo .seasons { display: grid; grid-template-columns: 62px repeat(4, 1fr); gap: 4px; align-items: center; margin: 5px 0; }
#demo .seasons button { font: inherit; font-size: 10px; color: #e0d2bc; background: #1c1916; border: 1px solid #3a332c; border-radius: 3px; padding: 3px 0; cursor: pointer; }
#demo .seasons button.on { border-color: #b07a3a; color: #ffd9a0; }
#demo .ro { margin-top: 8px; padding-top: 6px; border-top: 1px solid #2c2722; color: #8e8170; white-space: pre-line; }
#demo .marks { display: flex; align-items: flex-end; gap: 10px; margin-top: 8px; padding-top: 8px; border-top: 1px solid #2c2722; }

<script>
(() => {
'use strict';

/* ======================================================================================= CORE
   Small helpers shared by every module: math, colour, seeded random, noise, canvases. */
const $ = (s) => document.querySelector(s);
const qs = new URLSearchParams(location.search);
const RM = qs.has('rm') || matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const mod = (a, n) => ((a % n) + n) % n;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const R = rng(Date.now() & 0xffff);
const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const mul = (c, k) => [c[0] * k, c[1] * k, c[2] * k];
const rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
function ramp(stops, x) {
  if (x <= stops[0][0]) return stops[0][1];
  for (let i = 1; i < stops.length; i++) if (x <= stops[i][0]) { const [x0, c0] = stops[i - 1], [x1, c1] = stops[i]; return mix(c0, c1, (x - x0) / (x1 - x0)); }
  return stops[stops.length - 1][1];
}
/** 1-D value noise in [0,1]. */
function vnoise(r) { const v = new Float32Array(1024); for (let i = 0; i < 1024; i++) v[i] = r(); return (x) => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(v[i & 1023], v[(i + 1) & 1023], u); }; }
/** 2-D value noise in [0,1]. */
function noise2(seed) {
  const v = new Float32Array(65536), r = rng(seed); for (let i = 0; i < 65536; i++) v[i] = r();
  return (x, y) => { const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi, u = fx * fx * (3 - 2 * fx), w = fy * fy * (3 - 2 * fy);
    const x0 = xi & 255, x1 = (xi + 1) & 255, y0 = (yi & 255) << 8, y1 = ((yi + 1) & 255) << 8;
    const a = v[y0 + x0], b = v[y0 + x1], c = v[y1 + x0], d = v[y1 + x1];
    return a + (b - a) * u + (c - a) * w + (a - b - c + d) * u * w; };
}
function fbm(n, x, oct) { let s = 0, a = .5, f = 1, t = 0; for (let o = 0; o < oct; o++) { s += a * n(x * f + o * 31.7); t += a; a *= .5; f *= 2.07; } return s / t; }
function rfbm(n, x, oct) { let s = 0, a = .5, f = 1, t = 0, w = 1; for (let o = 0; o < oct; o++) { let v = 1 - Math.abs(n(x * f + o * 17.3) * 2 - 1); v *= v; s += a * v * w; w = clamp(v * 1.4); t += a; a *= .5; f *= 2.1; } return s / t; }
/** Ridged 2-D fbm: sharp crests (1) and soft gullies (0). */
function ridged2(n, x, y, oct) { let s = 0, a = .5, f = 1, t = 0, w = 1; for (let o = 0; o < oct; o++) { let v = 1 - Math.abs(n(x * f + o * 19.1, y * f + o * 7.3) * 2 - 1); v *= v; s += a * v * w; w = clamp(v * 1.5); t += a; a *= .5; f *= 2.03; } return s / t; }
function mk(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }
function glowSprite(col, size = 64) { const c = mk(size, size), x = c.getContext('2d'), g = x.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  g.addColorStop(0, rgb(col, 1)); g.addColorStop(.18, rgb(col, .55)); g.addColorStop(.45, rgb(col, .14)); g.addColorStop(1, rgb(col, 0)); x.fillStyle = g; x.fillRect(0, 0, size, size); return c; }
const SPR = { warm: glowSprite(hex('#ffb35a')), hot: glowSprite(hex('#fff0c8'), 32), fly: glowSprite(hex('#d8ff7a'), 32), white: glowSprite([255, 255, 255], 64) };

const cv = $('#scene'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;

/* ======================================================================================= TIME
   MUME's game clock, offline (BRIEF.md). 1 real second = 1 game minute. The season names follow
   src/gmcp/gametime.ts seasonOf: Afteryule–Rethe = winter, Astron–Forelithe = spring,
   Afterlithe–Halimath = summer, Winterfilth–Foreyule = autumn. */
const YEAR = 518400, MONTH = 43200, DAY = 1440;
const DAWN = [8, 9, 8, 7, 7, 6, 5, 4, 5, 6, 7, 7], DUSK = [18, 17, 18, 19, 20, 20, 21, 22, 21, 20, 20, 19];
const MONTHS = ['Afteryule', 'Solmath', 'Rethe', 'Astron', 'Thrimidge', 'Forelithe', 'Afterlithe', 'Wedmath', 'Halimath', 'Winterfilth', 'Blotmath', 'Foreyule'];
const WEEKDAYS = ['Sterday', 'Sunday', 'Monday', 'Trewsday', 'Hevensday', 'Mersday', 'Highday'];
const SEASONS = ['winter', 'spring', 'summer', 'autumn'];
const seasonOf = (m) => SEASONS[Math.floor(m / 3)];
const SEED_EPOCH = 1696118400 - 2850 * YEAR;
const MOON_CYCLE = (29 * 24 + 12) * 60 + 44, MOON_ORIGIN = 2850 * YEAR;
const PHASES = ['new', 'waxing crescent', 'first quarter', 'waxing gibbous', 'full', 'waning gibbous', 'third quarter', 'waning crescent'];
function savedEpoch() {
  try { const s = JSON.parse(localStorage.getItem('wc.clock') || 'null'); if (s && typeof s.epoch === 'number' && isFinite(s.epoch)) return s.epoch; } catch (e) { /* none */ }
  return SEED_EPOCH;
}
function moonModel(g) {
  const zc = Math.floor(((g - MOON_ORIGIN) * DAY) / MOON_CYCLE), z = mod(zc, DAY);
  const level = Math.abs(12 - Math.floor((z + 30) / 60)), waxing = z >= 720, i = Math.min(4, Math.floor(level / 3));
  const phase = i === 0 ? 'new' : i === 4 ? 'full' : waxing ? PHASES[i] : PHASES[8 - i];
  const ha = mod(g - MOON_ORIGIN - zc - 1080, DAY);
  return { level, waxing, phase, up: ha < 720, frac: ha / 720 };
}
const clk = { epoch: savedEpoch(), g0: 0, r0: 0, speed: 1, phase: 'auto', weather: 'auto' };
const realG = () => Date.now() / 1000 - clk.epoch;
function rebase(g) { clk.g0 = g; clk.r0 = performance.now() / 1000; }
const gameG = () => clk.g0 + (performance.now() / 1000 - clk.r0) * clk.speed;
rebase(realG());
function setHour(h) { const g = gameG(); rebase(Math.floor(g / DAY) * DAY + h * 60); }
function setMonth(m) { const g = gameG(); rebase(Math.floor(g / YEAR) * YEAR + m * MONTH + mod(g, MONTH)); }
if (qs.has('s')) setMonth(+qs.get('s') * 3 + 1);
if (qs.has('m')) setMonth(+qs.get('m'));
if (qs.has('t')) setHour(+qs.get('t'));
if (qs.has('w')) clk.weather = qs.get('w');
if (qs.has('p')) clk.phase = qs.get('p');
if (qs.has('fast')) clk.speed = 600;

/* ======================================================================================= ENV
   The one object every module reads each frame (updated by updateEnv before anything draws).
     t, dt            real seconds since load / since last frame (dt capped at .05)
     W, H, DPR, RM    viewport in CSS px, canvas pixel ratio, reduced motion
     g                absolute game minute;  month (0-11), monthName, day (1-30), h (hour, float)
     season           'winter' | 'spring' | 'summer' | 'autumn' (gametime.ts seasonOf)
     period           'dawn' | 'day' | 'dusk' | 'night'
     e                sun elevation -1 (deep night) … 0 (horizon) … 1 (high noon in summer)
     daylight, dark   0..1 blends;  dawn 0..1 (peaks around sunrise)
     horizonY         y of the nominal horizon (sun/moon arcs end here)
     sun  {x,y,r,up,drawn}        moon {x,y,r,level 0-12,phase,waxing,visible,drawn,frac}
     light {x,y,I,col,kind}       the dominant light (sun or moon): position, intensity 0..1, rgb
     sunI, moonI      their separate intensities;  sky {top,mid,hor} rgb arrays of the sky gradient
     weather {cloud,rain,snow,storm,fog: 0..1, state, auto, left}   (the director's state)
     wind {dir ±1, dirS smoothed dir, s strength 0..1, gust 0..1, x signed total}
     swayAt(x, phase) a sway value (~ -1.5..1.5) for something at screen x: wind + travelling gusts
     flash            lightning flash 0..1;  busy 0..1 how "loud" the weather is (LIFE backs off)
     par {x,y}        smoothed mouse parallax -1..1 (plus a slow idle drift)
     enter, journey   "Enter MUME" is selected / was activated */
const env = {
  t: 0, dt: 0, W: 0, H: 0, DPR: 1, RM,
  g: 0, month: 0, monthName: '', day: 1, h: 0, season: 'winter', period: 'day',
  e: 0, daylight: 0, dark: 0, dawn: 0, horizonY: 0,
  sun: {}, moon: {}, light: {}, sunI: 0, moonI: 0, sky: { top: [0, 0, 0], mid: [0, 0, 0], hor: [0, 0, 0] },
  weather: null, wind: null, flash: 0, busy: 0,
  par: { x: 0, y: 0 }, enter: false, journey: false,
  swayAt(x, ph = 0) {
    const w = this.wind, t = this.t * (RM ? .35 : 1);
    const wave = .5 + .5 * Math.sin(t * 1.05 - x * .0042 * w.dir + ph * .4);
    const flutter = Math.sin(t * (1.5 + (ph % 1) * .5) + ph * 6.1) * (.14 + .34 * w.s) + Math.sin(t * 3.1 + ph * 2.3) * .04 * (1 + w.s);
    return w.dirS * (w.s * .35 + w.gust * wave * 1.4) + flutter * (RM ? .4 : 1);
  },
};
const mouse = { x: .5, y: .5, sx: .5, sy: .5 };
addEventListener('pointermove', (e) => { mouse.x = e.clientX / W; mouse.y = e.clientY / H; }, { passive: true });

const SKYRAMP = [
  [-1.0, ['#020309', '#050816', '#0a1022']],
  [-0.5, ['#03050f', '#0a0f24', '#1a1c36']],
  [-0.2, ['#0b1130', '#2a2650', '#6b3a4a']],
  [-0.04, ['#1b2550', '#5a3e66', '#e0703c']],
  [0.06, ['#2b4579', '#8f6a83', '#ffaa5a']],
  [0.2, ['#3a64a0', '#8fa4c4', '#ffd2a0']],
  [0.42, ['#3a70b6', '#7eaad6', '#d6e4ec']],
  [1.0, ['#2a62ae', '#6a9fd6', '#bfd8ec']],
].map(([x, cs]) => [x, cs.map(hex)]);
const skyAt = (e) => { const out = []; for (let k = 0; k < 3; k++) out.push(ramp(SKYRAMP.map(([x, cs]) => [x, cs[k]]), e)); return out; };

function updateEnv(dt, t) {
  const g = gameG(), month = mod(Math.floor(g / MONTH), 12), h = mod(g, DAY) / 60;

  // --- sun: clearly larger than the moon
  const tc = clamp(tt, -.08, 1.08);
  // the arc climbs fast (sin^.5) so the sun clears the peaks for most of the day
  const sun = { x: lerp(.06, .94, tc) * W, y: env.horizonY - Math.sin(Math.PI * clamp(tt)) ** .5 * (.34 + .3 * maxAlt) * H + (tt < 0 || tt > 1 ? H * .08 : 0),

  moon.visible = mm.up && mm.level > 0 && (mm.level > 4 || e < -.05);

  let [top, mid, hor] = skyAt(e);

   The director: ONE weather state at a time, long calm stretches, slow cross-fades.
     winter         always snow, drifting gently between light and steady
     spring/autumn  mostly clear or fair; light rain now and then (well under 20 % of the time);

  const STATES = {

    clouds: { cloud: .64, rain: 0, snow: 0, storm: 0, fog: .10, wind: .36, dur: [70, 160] },
    rain:   { cloud: .76, rain: .45, snow: 0, storm: 0, fog: .16, wind: .40, dur: [45, 100] },
    storm:  { cloud: .96, rain: .85, snow: 0, storm: 1, fog: .14, wind: .85, dur: [25, 45] },
    fog:    { cloud: .12, rain: 0, snow: 0, storm: 0, fog: .85, wind: .04, dur: [60, 140] },

    spring: { clear: 4, fair: 4, clouds: 1.6, rain: 1.5 },
    summer: { clear: 5, fair: 3.5 },
    autumn: { clear: 3, fair: 3, clouds: 2, rain: 1.7, storm: .3 },

  const wx = { cloud: .03, rain: 0, snow: 0, storm: 0, fog: .03, state: 'clear', auto: true, left: 0 };

  function build() {
    S.pole = { x: W * .28, y: -H * .55 };

    for (let i = 0; i < 220; i++) { const px = r() * w, py = h / 2 + (r() + r() - 1) * h * .22, rad = 4 + r() * 16;
      const g = x.createRadialGradient(px, py, 0, px, py, rad); g.addColorStop(0, `rgba(205,210,255,${.03 + r() * .05})`); g.addColorStop(1, 'rgba(200,205,255,0)'); x.fillStyle = g; x.fillRect(px - rad, py - rad, rad * 2, rad * 2); }
    for (let i = 0; i < 6000; i++) { const px = r() * w, py = h / 2 + (r() + r() + r() - 1.5) * h * .3; x.fillStyle = `rgba(230,230,255,${r() * .5})`; x.fillRect(px, py, .6, .6); }

/* ======================================================================================= MENU
   Keyboard (↑↓ Home End, Enter/Space, letter keys), mouse hover = select, click = activate. */
/* SELECTION (JS half of the selection style). 04: the ember and its afterglow, moved to the
   middle of the chosen row; the CSS transitions do the gliding. */
const SELECTION = {
  init(menuEl, items) {
    this.tail = document.createElement('i'); this.tail.className = 'ember-tail'; this.tail.setAttribute('aria-hidden', 'true');
    this.em = document.createElement('i'); this.em.className = 'ember' + (RM ? ' rm' : ''); this.em.setAttribute('aria-hidden', 'true');
    menuEl.append(this.tail, this.em);
    addEventListener('resize', () => this.cur && this.move(null, this.cur, items, true));
  },
  move(prev, next, items, instant) {
    this.cur = next;
    const y = next.offsetTop + next.offsetHeight / 2;
    for (const el of [this.em, this.tail]) {
      if (instant || RM) { el.style.transition = 'none'; el.style.transform = `translateY(${y}px)`; el.offsetWidth; el.style.transition = ''; }
      else el.style.transform = `translateY(${y}px)`;
    }
  },
};
const items = [...document.querySelectorAll('#menu .item')];
const menuEl = $('#menu');
let cur = 0, journey = false;
SELECTION.init(menuEl, items);
function select(i, instant = false) {
  const prev = items[cur];
  cur = mod(i, items.length);
  items.forEach((el, k) => el.classList.toggle('on', k === cur));
  env.enter = cur === 0;
  SELECTION.move(prev === items[cur] ? null : prev, items[cur], items, instant);
}
items.forEach((el, k) => { el.addEventListener('pointerenter', () => { if (k !== cur && !sub) select(k); }); el.addEventListener('click', () => { select(k); activate(k); }); });
let flashT;
function flash(el, msg) { el.textContent = msg; el.classList.add('show'); clearTimeout(flashT); flashT = setTimeout(() => el.classList.remove('show'), 1800); }
function activate(k) {
  const key = items[k].dataset.k;
  if (key === 'enter') return journeyStart();
  if (key === 'profile') return openProfile();
  const name = items[k].childNodes[1] ? items[k].childNodes[1].textContent.trim() : key;
  flash($('#flash'), `${name} — not in this mockup`);
}
function journeyStart() {
  if (journey) return; journey = env.journey = true;
  const f = SCENE.focus ? SCENE.focus() : { x: W / 2, y: H * .7 };
  document.documentElement.style.setProperty('--ox', (f.x / W * 100) + '%'); document.documentElement.style.setProperty('--oy', (f.y / H * 100) + '%');
  setTimeout(() => document.body.classList.add('journey'), 300);
  const toast = $('#toast');
  setTimeout(() => { toast.innerHTML = 'The way opens.<small>connecting to MUME would start here — not in this mockup</small>'; toast.classList.add('show'); }, 1500);
  setTimeout(() => { toast.classList.remove('show'); document.body.classList.remove('journey'); }, 3900);
  setTimeout(() => { journey = env.journey = false; }, 4800);
}

    else if (k === 'Enter' || k === ' ') flash($('#pflash'), 'Edit — not in this mockup');
    else { const m = { n: 'New', e: 'Edit', i: 'Import', x: 'Export', d: 'Delete' }[k.toLowerCase()]; if (m) flash($('#pflash'), `${m} — not in this mockup`); else return; }
    e.preventDefault(); return;
  }
  if (k === 'ArrowDown') select(cur + 1); else if (k === 'ArrowUp') select(cur - 1);
  else if (k === 'Home') select(0); else if (k === 'End') select(items.length - 1);
  else if (k === 'Enter' || k === ' ') activate(cur);
  else { const m = { p: 1, s: 2, h: 3, l: 4, c: 5, a: 6 }[k.toLowerCase()]; if (m !== undefined) { select(m); activate(m); } else return; }
  e.preventDefault();
});

const QUOTES = [
  ['Not all those who wander are lost.', 'Bilbo Baggins'], ["It's a dangerous business, Frodo, going out of your door.", 'Bilbo Baggins'],
  ['The Road goes ever on and on.', 'Bilbo Baggins'], ['Faithless is he that says farewell when the road darkens.', 'Gimli'],
  ['All we have to decide is what to do with the time that is given us.', 'Gandalf'], ['Despair is only for those who see the end beyond all doubt.', 'Gandalf'],
  ['The world is indeed full of peril, and in it there are many dark places.', 'Haldir'], ['Courage is found in unlikely places.', 'Gildor Inglorion'],
];
const quote = QUOTES[qs.has('q') ? +qs.get('q') : Math.floor(Math.random() * QUOTES.length)];
$('#qtext').textContent = quote[0]; $('#qby').textContent = '— ' + quote[1];

/* ======================================================================================= DEMO
   Mockup tool: time, month, season quick-pick, weather override, moon phase, fast time, and a
   readout of the director, the light and the wind. */
const demo = $('#demo');
$('#dToggle').addEventListener('click', () => { demo.classList.toggle('open'); $('#dToggle').textContent = demo.classList.contains('open') ? 'DEMO ▾' : 'DEMO ▸'; });
if (qs.has('demo')) $('#dToggle').click();
$('#dMonth').innerHTML = MONTHS.map((m, i) => `<option value="${i}">${m} · ${seasonOf(i)}</option>`).join('');
$('#dMoon').innerHTML += PHASES.map((p, i) => `<option value="${i}">${p}</option>`).join('');
$('#dTime').addEventListener('input', (e) => setHour(+e.target.value));
$('#dMonth').addEventListener('change', (e) => setMonth(+e.target.value));
document.querySelectorAll('#demo .seasons button').forEach((b) => b.addEventListener('click', () => setMonth(+b.dataset.s * 3 + 1)));
$('#dWeather').addEventListener('change', (e) => { clk.weather = e.target.value; });
$('#dMoon').addEventListener('change', (e) => { clk.phase = e.target.value; });
$('#dFast').addEventListener('change', (e) => { const g = gameG(); clk.speed = e.target.checked ? 600 : 1; rebase(g); });
$('#dReal').addEventListener('click', () => { clk.speed = 1; $('#dFast').checked = false; clk.weather = 'auto'; clk.phase = 'auto'; $('#dWeather').value = 'auto'; $('#dMoon').value = 'auto'; rebase(realG()); });
$('#dWeather').value = clk.weather; $('#dMoon').value = clk.phase; $('#dFast').checked = clk.speed > 1;
const f2 = (v) => v.toFixed(2).replace(/^0/, '');
function ui() {
  if (!demo.classList.contains('open')) return;
  const e = env, hh = Math.floor(e.h), mm = Math.floor((e.h - hh) * 60), wx = e.weather, w = e.wind, m = e.moon;
  if (document.activeElement !== $('#dTime')) $('#dTime').value = e.h.toFixed(2);
  $('#dTimeV').textContent = `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
  if (document.activeElement !== $('#dMonth')) $('#dMonth').value = e.month;
  document.querySelectorAll('#demo .seasons button').forEach((b) => b.classList.toggle('on', SEASONS[+b.dataset.s] === e.season));
  const arrow = w.x > .03 ? '→ E' : w.x < -.03 ? '← W' : '·';
  $('#dRo').textContent =
    `${e.monthName} ${e.day} · ${e.season} · ${e.period}\n` +
    `sun elev ${e.e.toFixed(2)} · light: ${e.light.kind} ${f2(e.light.I)}\n` +
    `moon ${m.phase} (${m.level}/12) ${m.visible ? 'visible' : m.up ? 'up, hidden' : 'below'}${m.nudged ? ' · nudged' : ''}\n` +
    `weather ${wx.auto ? 'auto → ' : ''}${wx.state}${wx.auto && wx.left < 1e8 ? ` (next in ${Math.max(0, Math.round(wx.left))} s)` : ''}\n` +
    `  cloud ${f2(wx.cloud)} rain ${f2(wx.rain)} snow ${f2(wx.snow)} fog ${f2(wx.fog)} storm ${f2(wx.storm)}\n` +
    `wind ${arrow} ${f2(Math.abs(w.x))} (base ${f2(w.s)}, gust ${f2(w.gust)})\n` +
    `epoch ${clk.epoch === SEED_EPOCH ? 'seed' : 'wc.clock'}${clk.speed > 1 ? ' · ×600' : ''}`;
}

/* ======================================================================================= LOOP
   favicon, film grain, resize, relight throttle, the frame loop (pauses when hidden). */
(function favicon() {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><defs><radialGradient id="g" cx="50%" cy="62%" r="62%"><stop offset="0" stop-color="#fff5d0"/><stop offset=".35" stop-color="#ffc25a"/><stop offset=".78" stop-color="#e2661a"/><stop offset="1" stop-color="#7a2806"/></radialGradient><linearGradient id="i" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9a8a74"/><stop offset="1" stop-color="#3a3028"/></linearGradient></defs><path d="M16 .9a2.7 2.7 0 1 1 0 5.4a2.7 2.7 0 1 1 0-5.4zm0 1.6a1.1 1.1 0 1 0 0 2.2a1.1 1.1 0 1 0 0-2.2z" fill="url(#i)"/><path d="M16 5.2 25 10.6H7z" fill="url(#i)"/><rect x="6" y="10" width="20" height="2.8" rx="1.1" fill="url(#i)"/><path d="M9.3 12.6h13.4l-1.3 12.2h-10.8z" fill="url(#g)" stroke="#2a221c" stroke-width="1.5"/><path d="M16 14.6c2.3 3 3 4.8 3 6.1a3 3 0 0 1-6 0c0-1.3.7-3.1 3-6.1z" fill="#fff6dc"/><rect x="7.6" y="24.2" width="16.8" height="2.9" rx="1.1" fill="url(#i)"/><rect x="10.2" y="27" width="11.6" height="2.4" rx=".9" fill="url(#i)"/></svg>`;
  $('#favicon').href = 'data:image/svg+xml,' + encodeURIComponent(svg);
})();
(function grain() {
  const c = mk(160, 160), x = c.getContext('2d'), id = x.createImageData(160, 160);
  for (let i = 0; i < id.data.length; i += 4) { const v = Math.random() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 40; }
  x.putImageData(id, 0, 0); document.documentElement.style.setProperty('--grain', `url(${c.toDataURL()})`);
})();

function buildAll() {
  W = innerWidth; H = innerHeight; DPR = Math.min(devicePixelRatio || 1, 1.5);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  env.W = W; env.H = H; env.DPR = DPR;
  SKY.build(env); WEATHER.build(env); SCENE.build(env); LIFE.build(env);
  lightKey = '';
}
let lightKey = '', lastRelight = -1e9;
function relightIfNeeded(now, force) {
  const e = env, wx = e.weather;
  const key = [Math.round(e.e * 120), Math.round(e.light.x / 6), Math.round(e.light.y / 6), Math.round(e.light.I * 40), Math.round(wx.fog * 20), Math.round(wx.cloud * 16), Math.round(wx.rain * 10), Math.round(wx.snow * 10), e.season, Math.round(e.moonI * 20)].join();
  if (force || (key !== lightKey && now - lastRelight > (clk.speed > 1 ? 80 : 400))) { lightKey = key; lastRelight = now; SCENE.relight(e); }
}
let last = performance.now(), running = false, lastUi = 0;
function frame(now) {
  if (document.hidden) { running = false; return; }
  const dt = clamp((now - last) / 1000, 0, .05); last = now;
  const t = now / 1000;
  updateEnv(dt, t);
  SKY.update(env, dt); LIFE.update(env, dt);
  relightIfNeeded(now, false);
  const x = ctx; x.setTransform(DPR, 0, 0, DPR, 0, 0);
  SKY.draw(x, env);
  LIFE.drawSky(x, env);
  WEATHER.drawBack(x, env);
  SCENE.draw(x, env);
  LIFE.drawNear(x, env);
  WEATHER.drawFront(x, env);
  WORDMARK.draw(t, dt, env.enter);
  if (now - lastUi > 250) { lastUi = now; ui(); }
  requestAnimationFrame(frame);
}
function start() { if (running) return; running = true; last = performance.now(); requestAnimationFrame(frame); }
document.addEventListener('visibilitychange', () => { if (!document.hidden) start(); });
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { buildAll(); updateEnv(0, performance.now() / 1000); relightIfNeeded(performance.now(), true); WORDMARK.build(); }, 120); });

buildAll();
updateEnv(0, performance.now() / 1000);
relightIfNeeded(performance.now(), true);
select(qs.has('sel') ? +qs.get('sel') : 0, true);
document.fonts.load('900 100px Cinzel').then(() => document.fonts.ready).then(() => WORDMARK.build());
if (qs.get('page') === 'profile') openProfile();
start();
})();
</script>
