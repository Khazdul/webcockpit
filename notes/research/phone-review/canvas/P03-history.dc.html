<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>P03 History cards</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
.root{width:390px;height:844px;overflow:hidden;position:relative;background:#000;color:#c6c6c6;font-family:'JetBrains Mono',ui-monospace,monospace;display:flex;flex-direction:column}
.bar{height:56px;flex:none;display:flex;align-items:center;gap:4px;padding:0 12px 0 4px;border-bottom:1px solid #2a2e33}
.back{width:44px;height:44px;background:transparent;border:0;color:#c6c6c6;display:grid;place-items:center;padding:0}
.back svg{width:22px;height:22px}
.bar h1{margin:0;flex:1;font:700 16px/1 'JetBrains Mono',ui-monospace,monospace;color:#e8e8e8;letter-spacing:.04em}
.bar .cnt{color:#8a8a8a;font-size:12px}
.chips{display:flex;gap:8px;padding:12px 16px 4px;flex:none}
.chip{height:44px;padding:0 18px;border-radius:22px;background:#121416;border:1px solid #2a2e33;color:#c6c6c6;font:14px/1 'JetBrains Mono',ui-monospace,monospace}
.chip[aria-pressed="true"]{background:#ffaf00;border-color:#ffaf00;color:#000;font-weight:700}
.list{flex:1;min-height:0;overflow:hidden;padding:0 16px}
.grp{margin:16px 2px 8px;font:700 11px/14px 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.14em;color:#8a8a8a;text-transform:uppercase}
.run{position:relative;margin-bottom:8px}
.runb{display:block;width:100%;box-sizing:border-box;text-align:left;padding:12px 56px 12px 14px;background:#121416;border:1px solid #2a2e33;border-radius:10px;color:#c6c6c6;font:13px/18px 'JetBrains Mono',ui-monospace,monospace}
.top{display:flex;align-items:baseline;gap:10px}
.top b{color:#e8e8e8;font-size:16px;line-height:20px}
.top .when{color:#c6c6c6}
.meta{display:block;color:#8a8a8a;margin-top:2px}
.bot{display:flex;align-items:center;gap:10px;margin-top:6px}
.stars{color:#ffaf00;letter-spacing:2px;font-size:15px}
.stars i{font-style:normal;color:#4a4a4a}
.unr{color:#8a8a8a}
.kept{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border:1px solid rgba(255,175,0,.45);border-radius:10px;color:#ffaf00;font-size:11px;line-height:16px}
.kept svg{width:11px;height:11px}
.pl{position:absolute;right:12px;bottom:12px;width:32px;height:32px;border-radius:50%;background:rgba(255,175,0,.14);color:#ffaf00;display:grid;place-items:center}
.pl svg{width:12px;height:12px;margin-left:2px}
.more{position:absolute;top:2px;right:2px;width:44px;height:44px;background:transparent;border:0;border-radius:10px;color:#c6c6c6;display:grid;place-items:center;padding:0}
.more svg{width:20px;height:20px}
.more[aria-expanded="true"]{background:#1b1e21}
.menu{position:absolute;top:46px;right:4px;z-index:2;width:184px;padding:4px;background:#1b1e21;border:1px solid #3a3a3a;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.7)}
.mi{width:100%;height:44px;display:flex;align-items:center;gap:12px;padding:0 12px;background:transparent;border:0;border-radius:8px;color:#e8e8e8;font:14px/1 'JetBrains Mono',ui-monospace,monospace;text-align:left}
.mi svg{width:18px;height:18px;color:#8a8a8a}
.mi .v{margin-left:auto;color:#8a8a8a;font-size:12px}
.mi.del{color:#d75f5f}
.mi.del svg{color:#d75f5f}
.sepm{height:1px;background:#2a2e33;margin:4px 6px}
</style>
</helmet>
<div class="root">
  <header class="bar">
    <button class="back" type="button" aria-label="Back"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></button>
    <h1>History</h1>
    <span class="cnt">5 runs</span>
  </header>
  <div class="chips" role="group" aria-label="Character">
    <button class="chip" type="button" aria-pressed="true">All</button>
    <button class="chip" type="button" aria-pressed="false">Rasta</button>
    <button class="chip" type="button" aria-pressed="false">Gittan</button>
  </div>
  <div class="list">
    <div class="grp">Today</div>
    <article class="run">
      <button class="runb" type="button" aria-label="Play run: Rasta, today 14:02, 1 h 12 m, 4 of 5 stars">
        <span class="top"><b>Rasta</b><span class="when">Today 14:02</span></span>
        <span class="meta">1 h 12 m · 9 kills · 38k xp</span>
        <span class="bot"><span class="stars">★★★★<i>★</i></span></span>
        <span class="pl" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l15 8-15 8z"></path></svg></span>
      </button>
      <button class="more" type="button" aria-label="More for this run" aria-haspopup="menu" aria-expanded="true"><svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button>
      <div class="menu" role="menu" aria-label="Run actions">
        <button class="mi" type="button" role="menuitem"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.8 6 6.2.5-4.8 4.1 1.6 6.4-5.8-3.4-5.8 3.4 1.6-6.4L3 9.5 9.2 9z"></path></svg>Rate<span class="v">★★★★☆</span></button>
        <button class="mi" type="button" role="menuitem"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6l-1 6 4 4H6l4-4zM12 13v8"></path></svg>Keep</button>
        <div class="sepm" aria-hidden="true"></div>
        <button class="mi del" type="button" role="menuitem"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"></path></svg>Delete</button>
      </div>
    </article>

    <div class="grp">Yesterday</div>
    <article class="run">
      <button class="runb" type="button" aria-label="Play run: Gittan, yesterday 21:30, 48 m, 3 of 5 stars">
        <span class="top"><b>Gittan</b><span class="when">Yesterday 21:30</span></span>
        <span class="meta">48 m · 3 kills · 12k xp</span>
        <span class="bot"><span class="stars">★★★<i>★★</i></span></span>
        <span class="pl" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l15 8-15 8z"></path></svg></span>
      </button>
      <button class="more" type="button" aria-label="More for this run" aria-haspopup="menu" aria-expanded="false"><svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button>
    </article>
    <article class="run">
      <button class="runb" type="button" aria-label="Play run: Rasta, yesterday 18:40, 2 h 5 m, not rated, kept">
        <span class="top"><b>Rasta</b><span class="when">Yesterday 18:40</span></span>
        <span class="meta">2 h 05 m · 14 kills · 61k xp</span>
        <span class="bot"><span class="unr">Not rated</span><span class="kept"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6l-1 6 4 4H6l4-4zM12 13v8"></path></svg>Kept</span></span>
        <span class="pl" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l15 8-15 8z"></path></svg></span>
      </button>
      <button class="more" type="button" aria-label="More for this run" aria-haspopup="menu" aria-expanded="false"><svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button>
    </article>

    <div class="grp">Earlier</div>
    <article class="run">
      <button class="runb" type="button" aria-label="Play run: Rasta, Thursday 29 October 20:15, 34 m, 2 of 5 stars">
        <span class="top"><b>Rasta</b><span class="when">Thu 29 Oct 20:15</span></span>
        <span class="meta">34 m · 2 kills · 7k xp</span>
        <span class="bot"><span class="stars">★★<i>★★★</i></span></span>
        <span class="pl" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l15 8-15 8z"></path></svg></span>
      </button>
      <button class="more" type="button" aria-label="More for this run" aria-haspopup="menu" aria-expanded="false"><svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button>
    </article>
    <article class="run">
      <button class="runb" type="button" aria-label="Play run: Gittan, Tuesday 27 October 19:02, 1 h 40 m, 5 of 5 stars">
        <span class="top"><b>Gittan</b><span class="when">Tue 27 Oct 19:02</span></span>
        <span class="meta">1 h 40 m · 11 kills · 44k xp</span>
        <span class="bot"><span class="stars">★★★★★</span></span>
        <span class="pl" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l15 8-15 8z"></path></svg></span>
      </button>
      <button class="more" type="button" aria-label="More for this run" aria-haspopup="menu" aria-expanded="false"><svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button>
    </article>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
