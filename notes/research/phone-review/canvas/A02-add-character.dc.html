<!doctype html>
<html lang="en">
<head>

<title>A02 Add character</title>

<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
.s{position:relative;width:390px;height:844px;overflow:hidden;background:#000;color:#c6c6c6;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:15px;line-height:18px;display:flex;flex-direction:column}
.s *{box-sizing:border-box}
:where(.s) button,:where(.s) input,:where(.s) select{font:inherit;letter-spacing:inherit;border-radius:0;margin:0}
:where(.s) button{background:#000;color:#e8e8e8;border:1px solid #3a3a3a;padding:0 12px;min-height:44px;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.d{color:#8a8a8a}.y{color:#d7d75f}.a{color:#ffaf00}.w{color:#e8e8e8}.b{font-weight:700}
.hdr{flex:none;display:flex;align-items:center;height:56px;border-bottom:1px solid #3a3a3a}
.back{width:56px;height:55px;border:0;border-right:1px solid #3a3a3a;color:#ffaf00;font-size:20px;padding:0}
.hdr h1{margin:0 0 0 14px;font-size:15px;font-weight:700;letter-spacing:.08em;color:#e8e8e8}
.mark{flex:none;display:flex;justify-content:center;padding-top:36px}
.sp{flex:1}
form{flex:none;padding:0 16px 16px;margin:0}
.lab{display:block;color:#8a8a8a;margin-bottom:6px}
.fld{display:block;width:100%;height:48px;background:#000;border:1px solid #3a3a3a;color:#e8e8e8;padding:0 12px;outline:none}
.fld:focus{border-color:#ffaf00}
.grp{margin-bottom:14px}
.pw{display:flex}
.pw .fld{flex:1;border-right:0}
.pw button{width:76px;height:48px;color:#c6c6c6}
.chk label{display:flex;align-items:center;gap:10px;height:48px;color:#e8e8e8;cursor:pointer}
.bx{font-weight:700;font-size:18px;color:#ffaf00;width:36px}
.warn{margin:0 0 16px 46px;color:#d7d75f}
.prof{display:flex;align-items:center;justify-content:space-between;height:48px;margin-bottom:18px}
.sel{position:relative;width:190px}
.sel select{appearance:none;-webkit-appearance:none;width:100%;height:48px;background:#000;color:#e8e8e8;border:1px solid #3a3a3a;padding:0 36px 0 12px}
.sel span{position:absolute;right:12px;top:15px;color:#8a8a8a;pointer-events:none}
.pri{display:block;width:100%;height:52px;background:#ffaf00;color:#000;border:0;font-weight:700;letter-spacing:.06em}
.lnk{display:block;width:100%;height:48px;margin-top:6px;border:0;color:#c6c6c6;text-decoration:underline;text-underline-offset:4px}
</style>
</helmet>
<div class="s" style="width: 390px; height: 844px; overflow: hidden;">
  <header class="hdr"><button type="button" class="back" aria-label="Back">←</button><h1>ADD CHARACTER</h1></header>

  <div class="mark">
    <svg role="img" aria-label="MUME Cockpit" width="236" height="20" viewBox="0 0 59 5" shape-rendering="crispEdges"><path fill="#00c8c8" d="M0 0h1v1h-1zM4 0h1v1h-1zM0 1h2v1h-2zM3 1h2v1h-2zM0 2h1v1h-1zM2 2h1v1h-1zM4 2h1v1h-1zM0 3h1v1h-1zM4 3h1v1h-1zM0 4h1v1h-1zM4 4h1v1h-1zM6 0h1v1h-1zM10 0h1v1h-1zM6 1h1v1h-1zM10 1h1v1h-1zM6 2h1v1h-1zM10 2h1v1h-1zM6 3h1v1h-1zM10 3h1v1h-1zM7 4h3v1h-3zM12 0h1v1h-1zM16 0h1v1h-1zM12 1h2v1h-2zM15 1h2v1h-2zM12 2h1v1h-1zM14 2h1v1h-1zM16 2h1v1h-1zM12 3h1v1h-1zM16 3h1v1h-1zM12 4h1v1h-1zM16 4h1v1h-1zM18 0h4v1h-4zM18 1h1v1h-1zM18 2h3v1h-3zM18 3h1v1h-1zM18 4h4v1h-4z"></path><path fill="#0a9a9a" d="M26 0h3v1h-3zM25 1h1v1h-1zM25 2h1v1h-1zM25 3h1v1h-1zM26 4h3v1h-3zM31 0h2v1h-2zM30 1h1v1h-1zM33 1h1v1h-1zM30 2h1v1h-1zM33 2h1v1h-1zM30 3h1v1h-1zM33 3h1v1h-1zM31 4h2v1h-2zM36 0h3v1h-3zM35 1h1v1h-1zM35 2h1v1h-1zM35 3h1v1h-1zM36 4h3v1h-3zM40 0h1v1h-1zM43 0h1v1h-1zM40 1h1v1h-1zM42 1h1v1h-1zM40 2h2v1h-2zM40 3h1v1h-1zM42 3h1v1h-1zM40 4h1v1h-1zM43 4h1v1h-1zM45 0h3v1h-3zM45 1h1v1h-1zM48 1h1v1h-1zM45 2h3v1h-3zM45 3h1v1h-1zM45 4h1v1h-1zM50 0h3v1h-3zM51 1h1v1h-1zM51 2h1v1h-1zM51 3h1v1h-1zM50 4h3v1h-3zM54 0h5v1h-5zM56 1h1v1h-1zM56 2h1v1h-1zM56 3h1v1h-1zM56 4h1v1h-1z"></path></svg>
  </div>

  <div class="sp"></div>

  <form>
    <div class="grp">
      <label class="lab" for="nm">Character name</label>
      <input class="fld" id="nm" type="text" value="Rasta" autocomplete="username" autocapitalize="words">
    </div>
    <div class="grp">
      <label class="lab" for="pw">Password</label>
      <div class="pw"><input class="fld" id="pw" type="password" value="dragonfly" autocomplete="current-password"><button type="button" aria-label="Show password">SHOW</button></div>
    </div>
    <div class="chk">
      <input class="sr" type="checkbox" id="rem" checked>
      <label for="rem"><span class="bx" aria-hidden="true">[X]</span>Remember password on this device</label>
    </div>
    <p class="warn">! Stored unencrypted in this browser.</p>
    <div class="prof">
      <label for="pf" class="w">Profile</label>
      <span class="sel"><select id="pf"><option selected>default</option><option>warrior</option></select><span aria-hidden="true">▾</span></span>
    </div>
    <button type="button" class="pri">[ SAVE &amp; PLAY ]</button>
    <button type="button" class="lnk">Play without saving</button>
  </form>
</div>
</x-dc>
