<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>B02 Add character</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
*{box-sizing:border-box}
.ph{--bg:#000;--tx:#c6c6c6;--hi:#e8e8e8;--dim:#8a8a8a;--acc:#ffaf00;--acc-tx:#ffaf00;--acc-ui:#ffaf00;--sf:#121416;--rs:#1b1e21;--bd:#2a2e33;position:relative;width:390px;height:844px;overflow:hidden;display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:13px;line-height:1.35}
button,input,select{font:inherit;color:inherit;margin:0}
button{background:none;border:0;padding:0;cursor:pointer}
svg{display:block;flex:none}
.cap{margin:0;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.btn{height:48px;padding:0 18px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.btn.pri{background:var(--acc);color:#000}
.top{flex:none;display:flex;align-items:center;gap:6px;height:56px;padding:0 8px;border-bottom:1px solid var(--bd);background:var(--sf)}
.top h1{margin:0;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--hi)}
.back{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--hi)}
.body{flex:1;padding:24px 16px 0;display:flex;flex-direction:column}
.fld{margin-bottom:18px}
.fld label.cap{display:block;margin-bottom:8px}
.inp{display:flex;align-items:center;height:52px;background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:0 4px 0 14px}
.inp.focus{border-color:var(--acc-ui)}
.inp input,.inp select{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;font-size:16px;color:var(--hi);padding:0}
.inp select{-webkit-appearance:none;appearance:none}
.eye{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--dim);border-radius:8px}
.chk{display:flex;align-items:flex-start;gap:12px;padding:10px 4px;min-height:52px;margin-bottom:8px}
.chk input{-webkit-appearance:none;appearance:none;flex:none;width:24px;height:24px;margin:0;border-radius:6px;border:1.5px solid #4a4f55;background:var(--sf);position:relative}
.chk input:checked{background:var(--acc);border-color:var(--acc)}
.chk input:checked::after{content:"";position:absolute;left:7px;top:3px;width:6px;height:11px;border:solid #000;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.chk .t{font-size:14px;color:var(--hi)}
.warn{display:flex;gap:8px;align-items:center;margin-top:6px;font-size:12px;color:#d7af5f}
.foot{margin-top:auto;padding:16px 0 24px;display:flex;flex-direction:column;gap:8px}
.foot .btn.pri{width:100%;height:52px}
.link{height:48px;width:100%;font-size:13px;color:var(--hi);text-decoration:underline;text-underline-offset:4px;text-decoration-color:#4a4f55}
.hint{margin:0 0 24px;font-size:13px;color:var(--dim)}
</style>
</helmet>
<div class="ph">
  <header class="top">
    <button class="back" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
    <h1>Add character</h1>
  </header>

  <form class="body">
    <p class="hint">Logs in to mume.org when you press Play.</p>

    <div class="fld">
      <label class="cap" for="cname">Character name</label>
      <div class="inp"><input id="cname" type="text" value="Rasta" autocomplete="username"></div>
    </div>

    <div class="fld">
      <label class="cap" for="cpass">Password</label>
      <div class="inp focus">
        <input id="cpass" type="password" value="mellonfriend" autocomplete="current-password">
        <button class="eye" type="button" aria-label="Show password"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
      </div>
    </div>

    <label class="chk">
      <input type="checkbox" checked>
      <span>
        <span class="t">Remember password on this device</span>
        <span class="warn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4L2.5 20h19zM12 10v4M12 17h.01"></path></svg>Stored unencrypted in this browser.</span>
      </span>
    </label>

    <div class="fld">
      <label class="cap" for="cprof">Profile</label>
      <div class="inp">
        <select id="cprof"><option>default</option><option>ranger</option></select>
        <span class="eye" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></span>
      </div>
    </div>

    <div class="foot">
      <button class="btn pri" type="submit"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor"></path></svg>Save &amp; play</button>
      <button class="link" type="button">Play without saving</button>
    </div>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
