<style>
body{margin:0;background:#000}
*{box-sizing:border-box}
.ph{--bg:#000;--tx:#c6c6c6;--hi:#e8e8e8;--dim:#8a8a8a;--acc:#ffaf00;--acc-tx:#ffaf00;--acc-ui:#ffaf00;--on-acc:#000;--sf:#121416;--rs:#1b1e21;--bd:#2a2e33;--empty:#262626;--red:#d75f5f;--green:#5faf5f;--yellow:#d7d75f;--blue:#5f87d7;--cyan:#00afaf;--cmd:#87afd7;position:relative;width:390px;height:844px;overflow:hidden;display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:13px;line-height:1.35}
button,input,select{font:inherit;color:inherit;margin:0}
button{background:none;border:0;padding:0;cursor:pointer}
svg{display:block;flex:none}
.cap{margin:0;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.ibtn{flex:none;width:44px;height:44px;border-radius:10px;background:var(--rs);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;color:var(--hi)}
.btn{height:48px;padding:0 18px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.btn.pri{background:var(--acc);color:#000}
.btn.sec{background:var(--rs);border:1px solid var(--bd);color:var(--hi)}
.group{margin:0 16px;background:var(--sf);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;width:100%;min-height:52px;padding:0 14px;border-top:1px solid var(--bd);font-size:14px;color:var(--hi);text-align:left}
.row:first-child{border-top:0}
.row .t{flex:1}
.row .val{color:var(--dim);font-size:13px}
.row .ico{color:var(--dim)}
.banner{display:flex;align-items:center;gap:12px;margin:12px 16px 0;padding:8px 8px 8px 14px;background:var(--sf);border:1px solid var(--bd);border-left:3px solid var(--acc);border-radius:10px}
.banner p{flex:1;margin:0;font-size:13px;color:var(--hi)}
.banner .btn{height:44px;padding:0 14px;font-size:12px}
.wm{display:flex;justify-content:center;margin-top:30px}
.quote{margin:14px 0 0;text-align:center;font-size:12px;font-style:italic;color:var(--dim)}
.quote span{font-style:normal;color:#87af87}
.head{display:flex;align-items:center;padding:26px 16px 10px}
.char{display:flex;align-items:center;gap:12px;margin:0 16px 8px;padding:12px 12px 12px 14px;background:var(--sf);border:1px solid var(--bd);border-radius:12px}
.av{flex:none;width:40px;height:40px;border-radius:8px;background:#0b2526;border:1px solid #13494b;color:#00c8c8;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center}
.ct{flex:1;min-width:0}
.cn{font-size:17px;font-weight:700;color:var(--hi)}
.cs{font-size:12px;color:var(--dim)}
.kb{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--dim)}
.play{width:96px;padding:0}
.add{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 16px;width:358px;height:52px;border:1px dashed #3e434a;border-radius:12px;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--hi)}
.more{margin-top:auto;padding-bottom:20px}
</style>
