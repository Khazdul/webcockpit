.pb.sm2{font-size:13px;font-weight:600;background:#22262a;color:#c6c6c6}
.pb.flee{background:#d75f5f;color:#000;font-size:13px}
.pb.x{width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:30px;background:#ffaf00;color:#000}
.nav{height:64px;flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:#121416;border-top:1px solid #2a2e33;padding:6px 4px 8px}
.nv{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:500;color:#9a9a9a;position:relative}
.nv .pl{width:56px;height:30px;border-radius:15px;display:grid;place-items:center;position:relative}
.nv.on{color:#ffaf00}
.nv.on .pl{background:rgba(255,175,0,.16)}
.bdg{position:absolute;top:-4px;left:34px;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#ffaf00;color:#000;font-size:12px;font-weight:700;line-height:20px;text-align:center}
