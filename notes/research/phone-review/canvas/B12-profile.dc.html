<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>B12 Quick buttons and profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
*{box-sizing:border-box}
.ph{--bg:#000;--tx:#c6c6c6;--hi:#e8e8e8;--dim:#8a8a8a;--acc:#ffaf00;--acc-tx:#ffaf00;--acc-ui:#ffaf00;--sf:#121416;--rs:#1b1e21;--bd:#2a2e33;--red:#d75f5f;--cmd:#87afd7;position:relative;width:390px;height:844px;overflow:hidden;display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:13px;line-height:1.35}
button,input,select{font:inherit;color:inherit;margin:0}
button{background:none;border:0;padding:0;cursor:pointer}
svg{display:block;flex:none}
.cap{margin:0;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.top{flex:none;display:flex;align-items:center;gap:6px;height:56px;padding:0 8px;border-bottom:1px solid var(--bd);background:var(--sf)}
.top h1{margin:0;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--hi)}
.back{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--hi)}
.prof{flex:none;display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--sf);border-bottom:1px solid var(--bd)}
.prof label{flex:none}
.sel{flex:1;display:flex;align-items:center;height:44px;padding:0 4px 0 12px;border:1px solid var(--bd);border-radius:10px;background:var(--rs)}
.sel select{-webkit-appearance:none;appearance:none;flex:1;height:100%;border:0;outline:0;background:transparent;font-size:15px;font-weight:700;color:var(--hi)}
.sel span{width:36px;display:flex;justify-content:center;color:var(--dim)}
.tabs{flex:none;display:flex;border-bottom:1px solid var(--bd);padding:0 8px}
.tab{flex:auto;height:48px;padding:0 6px;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--dim);border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--acc-tx);border-bottom-color:var(--acc)}
.acts{flex:none;display:flex;gap:8px;padding:12px 12px 8px}
.btn{height:44px;padding:0 12px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.btn.pri{background:var(--acc);color:#000}
.btn.sec{background:var(--rs);border:1px solid var(--bd);color:var(--hi)}
.btn.grow{flex:1}
.list{flex:1;min-height:0;overflow:hidden;margin:4px 12px 0;border:1px solid var(--bd);border-radius:12px;background:var(--sf)}
.inner{margin-top:-26px}
.ent{display:flex;align-items:center;height:52px;border-top:1px solid var(--bd)}
.ent.sel-row{position:relative;z-index:3;background:var(--rs);box-shadow:inset 3px 0 0 var(--acc)}
.grip{width:40px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--dim)}
.edit{flex:1;min-width:0;height:52px;display:flex;align-items:center;gap:10px;text-align:left}
.lbl{flex:none;min-width:44px;height:30px;padding:0 8px;border-radius:7px;background:var(--rs);border:1px solid #3a3f45;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--hi)}
.lbl.flee{color:var(--red)}
.arrow{color:var(--dim)}
.cmd{font-size:14px;color:var(--cmd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.del{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--dim);border-radius:10px}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.62);z-index:2}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:4;display:flex;flex-direction:column;background:var(--sf);border:1px solid var(--bd);border-bottom:0;border-radius:12px 12px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.55);padding:0 16px 22px}
.grab{flex:none;width:40px;height:4px;margin:8px auto 2px;border-radius:2px;background:#4a4f55}
.shead{display:flex;align-items:center;height:48px;margin-right:-10px}
.shead h2{flex:1;margin:0;font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--hi)}
.x{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--hi);border-radius:10px}
.form{display:grid;grid-template-columns:120px 1fr;gap:10px;margin-bottom:16px}
.form label{display:block;margin-bottom:6px}
.inp{height:48px;width:100%;border:1px solid var(--bd);border-radius:10px;background:var(--bg);padding:0 12px;font-size:15px;color:var(--hi);outline:0}
.inp.focus{border-color:var(--acc-ui)}
.fbtns{display:flex;gap:10px}
.fbtns .btn{height:48px;font-size:13px}
.danger{color:var(--red);border:1px solid #4a2a2a;background:transparent}
</style>
</helmet>
<div class="ph">
  <header class="top">
    <button class="back" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
    <h1>Quick buttons &amp; profile</h1>
  </header>

  <div class="prof">
    <label class="cap" for="pf">Profile</label>
    <div class="sel">
      <select id="pf"><option>default</option><option>ranger</option></select>
      <span aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></span>
    </div>
  </div>

  <div class="tabs" role="tablist" aria-label="Profile sections">
    <button class="tab" role="tab" aria-selected="true">Quick buttons</button>
    <button class="tab" role="tab" aria-selected="false">Aliases</button>
    <button class="tab" role="tab" aria-selected="false">Highlights</button>
    <button class="tab" role="tab" aria-selected="false">Actions</button>
  </div>

  <div class="acts">
    <button class="btn sec grow"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v10M7 9l5 5 5-5M5 19h14"></path></svg>Import from profile macros</button>
    <button class="btn pri"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add</button>
  </div>

  <div class="list" role="list" aria-label="Quick buttons">
    <div class="inner">
      <div class="ent" role="listitem"><button class="grip" aria-label="Reorder U"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01"></path></svg></button><button class="edit"><span class="lbl">U</span><span class="arrow">→</span><span class="cmd">up</span></button><button class="del" aria-label="Delete U"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14M10 7V5h4v2M7 7l1 13h8l1-13"></path></svg></button></div>
      <div class="ent" role="listitem"><button class="grip" aria-label="Reorder D"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01"></path></svg></button><button class="edit"><span class="lbl">D</span><span class="arrow">→</span><span class="cmd">down</span></button><button class="del" aria-label="Delete D"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14M10 7V5h4v2M7 7l1 13h8l1-13"></path></svg></button></div>
      <div class="ent" role="listitem"><button class="grip" aria-label="Reorder FLEE"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01"></path></svg></button><button class="edit"><span class="lbl flee">FLEE</span><span class="arrow">→</span><span class="cmd">flee</span></button><button class="del" aria-label="Delete FLEE"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14M10 7V5h4v2M7 7l1 13h8l1-13"></path></svg></button></div>
      <div class="ent" role="listitem"><button class="grip" aria-label="Reorder EXITS"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01"></path></svg></button><button class="edit"><span class="lbl">EXITS</span><span class="arrow">→</span><span class="cmd">exits</span></button><button class="del" aria-label="Delete EXITS"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14M10 7V5h4v2M7 7l1 13h8l1-13"></path></svg></button></div>
      <div class="ent" role="listitem"><button class="grip" aria-label="Reorder OPEN"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01"></path></svg></button><button class="edit"><span class="lbl">OPEN</span><span class="arrow">→</span><span class="cmd">open exit</span></button><button class="del" aria-label="Delete OPEN"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14M10 7V5h4v2M7 7l1 13h8l1-13"></path></svg></button></div>
      <div class="ent" role="listitem"><button class="grip" aria-label="Reorder CLOSE"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01"></path></svg></button><button class="edit"><span class="lbl">CLOSE</span><span class="arrow">→</span><span class="cmd">close exit</span></button><button class="del" aria-label="Delete CLOSE"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14M10 7V5h4v2M7 7l1 13h8l1-13"></path></svg></button></div>
      <div class="ent sel-row" role="listitem"><button class="grip" aria-label="Reorder RESCUE"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01"></path></svg></button><button class="edit"><span class="lbl">RESCUE</span><span class="arrow">→</span><span class="cmd">rescue dori</span></button><button class="del" aria-label="Delete RESCUE"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14M10 7V5h4v2M7 7l1 13h8l1-13"></path></svg></button></div>
      <div class="ent" role="listitem"><button class="grip" aria-label="Reorder SCORE"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01"></path></svg></button><button class="edit"><span class="lbl">SCORE</span><span class="arrow">→</span><span class="cmd">score</span></button><button class="del" aria-label="Delete SCORE"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14M10 7V5h4v2M7 7l1 13h8l1-13"></path></svg></button></div>
      <div class="ent" role="listitem"><button class="grip" aria-label="Reorder BASH"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01"></path></svg></button><button class="edit"><span class="lbl">BASH</span><span class="arrow">→</span><span class="cmd">bash</span></button><button class="del" aria-label="Delete BASH"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14M10 7V5h4v2M7 7l1 13h8l1-13"></path></svg></button></div>
    </div>
  </div>
  <div style="flex:none;height:12px"></div>

  <div class="scrim" aria-hidden="true"></div>
  <section class="sheet" role="dialog" aria-label="Edit quick button">
    <div class="grab" aria-hidden="true"></div>
    <div class="shead">
      <h2>EDIT BUTTON</h2>
      <button class="x" aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>
    <div class="form">
      <div><label class="cap" for="ql">Label</label><input class="inp" id="ql" type="text" value="RESCUE"></div>
      <div><label class="cap" for="qc">Command</label><input class="inp focus" id="qc" type="text" value="rescue dori"></div>
    </div>
    <div class="fbtns">
      <button class="btn danger"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14M10 7V5h4v2M7 7l1 13h8l1-13"></path></svg>Delete</button>
      <button class="btn pri grow">Save</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
