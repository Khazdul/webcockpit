<head>

<title>C01 Launcher</title>

<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
*{box-sizing:border-box}
.ph{position:relative;width:390px;height:844px;overflow:hidden;background:#000;color:#c6c6c6;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:16px;line-height:1.35;display:flex;flex-direction:column}
button,input{font:inherit;color:inherit;margin:0}
button{background:none;border:0;padding:0;cursor:pointer}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.sm{width:18px;height:18px}
.top{display:flex;justify-content:center;padding:32px 0 0}
.wrap{padding:0 16px;display:flex;flex-direction:column;flex:1}
.note{margin-top:22px;display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 6px 6px 14px;border-radius:14px;background:#121416;border:1px solid #2a2e33;font-size:14px;color:#e8e8e8}
.note .txt{flex:1}
.note .sub{display:block;font-size:13px;color:#9a9a9a}
.tonal{height:44px;padding:0 16px;border-radius:22px;background:#1b1e21;border:1px solid #2a2e33;color:#ffaf00;font-weight:600;font-size:15px}
.hdr{margin:24px 4px 8px;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#9a9a9a}
.card{display:flex;align-items:center;gap:12px;height:80px;padding:0 12px 0 14px;border-radius:16px;background:#121416;border:1px solid #2a2e33;margin-bottom:10px}
.av{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
.who{flex:1;min-width:0}
.nm{font-size:18px;font-weight:600;color:#e8e8e8}
.meta{display:flex;align-items:center;gap:6px;font-size:13px;color:#9a9a9a;margin-top:2px}
.play{display:flex;align-items:center;justify-content:center;gap:8px;width:104px;height:52px;border-radius:26px;background:#ffaf00;color:#000;font-weight:700;font-size:16px;flex:none}
.play.alt{background:#1b1e21;color:#ffaf00;border:1px solid #3a3a3a}
.play svg.i{fill:currentColor;stroke:none;width:18px;height:18px}
.add{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:16px;border:1.5px dashed #3a3a3a;color:#e8e8e8;font-weight:600;font-size:16px}
.list{margin-top:20px;border-radius:16px;background:#121416;border:1px solid #2a2e33;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;width:100%;height:52px;padding:0 12px 0 16px;text-align:left;color:#e8e8e8;font-size:16px;border-top:1px solid #2a2e33}
.row:first-child{border-top:0}
.row .l{flex:1}
.row .ic{color:#00c8c8}
.row .ch{color:#6a6a6a}
.quote{margin-top:auto;padding:0 0 28px;text-align:center;font-size:14px;color:#9a9a9a;font-style:italic}
.quote b{display:block;font-style:normal;font-weight:500;color:#87af87;margin-top:2px}
</style>
</helmet>

  </div>

      <span class="txt">Version 0.2.2 is ready<span class="sub">Reload to update</span></span>
      <button class="tonal">Reload</button>

    <div class="hdr">Characters</div>
    <div class="card">
      <div class="av" style="background:#00c8c8;color:#000">R</div>

    </div>
    <div class="card">
      <div class="av" style="background:#1b1e21;color:#00c8c8;border:1px solid #2a2e33">G</div>
